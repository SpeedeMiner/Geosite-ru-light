name: RU complete VPN coverage (review only)
on:
  push:
    branches: [audit/ru-domain-liveness]
    paths:
      - .github/workflows/ru-vpn-full.yml
      - tools/vpn_full_*.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      batches: ${{ steps.plan.outputs.batches }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'aiohttp==3.11.18' 'dnspython==2.7.0' 'publicsuffix2==2.20191221'
      - name: Build verified plan
        id: plan
        run: python tools/vpn_full_plan.py
      - uses: actions/upload-artifact@v4
        with:
          name: vpn-full-plan
          path: vpn-plan/
          retention-days: 14
  measure:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: ${{ fromJSON(needs.plan.outputs.batches) }}
    env:
      AUDIT: .vpn-pilot/research/docs/research/2026-11-14-wide-post-v11-18/get-audit
      PYTHONDONTWRITEBYTECODE: '1'
      BATCH: ${{ matrix.batch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c84fc559733525194da3f899cc5b10bc8a1bdebf
          path: .vpn-pilot/research
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SpeedeMiner/Geoip-ru-server
          ref: 30e797f05ddb8e38ccc2c44938b64846b4fce2fb
          path: .vpn-pilot/upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SpeedeMiner/Geoip-ru-server
          ref: 7eef1efcaafbdbe259f3aa4e56a07c38979afbfb
          path: .vpn-pilot/geoip-release
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: vpn-full-plan
          path: vpn-plan
      - name: Install VPN dependencies
        run: |
          set -euo pipefail
          test -c /dev/net/tun
          sudo timeout 120s apt-get -o Acquire::Retries=1 update
          sudo timeout 90s apt-get -o Acquire::Retries=1 install -y --no-install-recommends openvpn iptables
          python3 -m unittest discover -s "$AUDIT" -p test_vpnobratno_get.py -q
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Prepare verified inventory
        run: |
          set -euo pipefail
          (cd .vpn-pilot/geoip-release && sha256sum -c geoip_RU.dat.sha256sum)
          (cd .vpn-pilot/upstream/.github/reachability/inventory && GOTOOLCHAIN=local go build -mod=mod -o "$RUNNER_TEMP/vpn-inventory" .)
          "$RUNNER_TEMP/vpn-inventory" .vpn-pilot/geoip-release/geoip_RU.dat .vpn-pilot/inventory.tsv
      - name: Measure all subgroups through independent Russian ASNs
        timeout-minutes: 65
        run: |
          set -euo pipefail
          printf -v plan 'vpn-plan/batch-%03d.tsv' "$BATCH"
          mkdir -p .vpn-pilot/subplans .vpn-pilot/reports
          PLAN="$plan" python3 - <<'PY'
          import csv, os
          from pathlib import Path
          with open(os.environ['PLAN'],encoding='utf-8',newline='') as f:
              reader=csv.DictReader(f,delimiter='\t'); fields=reader.fieldnames; rows=list(reader)
          for i in range(0,len(rows),10):
              with open(f'.vpn-pilot/subplans/{i//10:02d}.tsv','w',encoding='utf-8',newline='') as f:
                  writer=csv.DictWriter(f,fieldnames=fields,delimiter='\t'); writer.writeheader(); writer.writerows(rows[i:i+10])
          PY
          upstream="$PWD/.vpn-pilot/upstream/.github/reachability"
          failed=0
          for subplan in .vpn-pilot/subplans/*.tsv; do
            name="$(basename "$subplan" .tsv)"
            echo "Starting subgroup $name of batch $BATCH"
            if sudo env GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" PYTHONDONTWRITEBYTECODE=1 \
              bash "$upstream/vpn_netns_exec.sh" -- timeout --signal=TERM --kill-after=6s 5m \
                python3 -B tools/vpn_full_wrapper.py "$AUDIT/vpnobratno_get.py" "$subplan" .vpn-pilot/inventory.tsv \
                  "$upstream" ".vpn-pilot/reports/$name" --exits 2 --attempts 6 --connect-timeout 16; then :; else failed=1; fi
          done
          exit "$failed"
      - name: Print coverage summary
        if: always()
        run: find .vpn-pilot/reports -name geosite-vpnobratno-summary.json -exec cat {} \; || true
      - name: Upload partial or complete observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpn-shard-${{ matrix.batch }}
          path: |
            .vpn-pilot/reports/*/geosite-vpnobratno-summary.json
            .vpn-pilot/reports/*/vpnobratno-observations.jsonl
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
  collect:
    if: always() && needs.plan.result == 'success'
    needs: [plan, measure]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: vpn-full-plan
          path: vpn-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: vpn-shard-*
          path: vpn-results
      - run: python3 tools/vpn_full_collect.py | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: vpn-full-coverage
          path: vpn-coverage/
          retention-days: 14
