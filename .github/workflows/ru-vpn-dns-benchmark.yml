name: VPN DNS and HTTPS timing benchmark
on:
  push:
    branches: [audit/ru-domain-liveness]
    paths:
      - .github/workflows/ru-vpn-dns-benchmark.yml
      - tools/vpn_dns_benchmark.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AUDIT: .vpn-pilot/research/docs/research/2026-11-14-wide-post-v11-18/get-audit
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c84fc559733525194da3f899cc5b10bc8a1bdebf
          path: .vpn-pilot/research
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SpeedeMiner/Geoip-ru-server
          ref: 30e797f05ddb8e38ccc2c44938b64846b4fce2fb
          path: .vpn-pilot/upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SpeedeMiner/Geoip-ru-server
          ref: 7eef1efcaafbdbe259f3aa4e56a07c38979afbfb
          path: .vpn-pilot/geoip-release
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install DNS and HTTP dependencies
        run: python -m pip install 'aiohttp==3.11.18' 'dnspython==2.7.0' 'publicsuffix2==2.20191221'
      - name: Select reproducible sample from verified DAT
        env:
          VPN_SMOKE: '1'
        run: |
          python tools/vpn_full_plan.py
          python - <<'PY'
          import csv, json
          m=json.load(open('vpn-plan/manifest.json',encoding='utf-8'))
          hosts=sorted(m['hosts_to_rules'])
          fields=['cohort','type','rule','host','url','markers','source']
          rows=[]
          for i in range(10):
              host=hosts[i*(len(hosts)-1)//9]; rule=m['hosts_to_rules'][host][0]
              rows.append(dict(cohort='audit',type=rule['type'],rule=rule['value'],host=host,url='https://'+host+'/',markers='',source='verified rolling DAT'))
          with open('vpn-plan/benchmark.tsv','w',encoding='utf-8',newline='') as f:
              writer=csv.DictWriter(f,fieldnames=fields,delimiter='\t'); writer.writeheader(); writer.writerows(rows)
          PY
      - name: Install isolated VPN dependencies
        run: |
          set -euo pipefail
          test -c /dev/net/tun
          sudo timeout 120s apt-get -o Acquire::Retries=1 update
          sudo timeout 90s apt-get -o Acquire::Retries=1 install -y --no-install-recommends openvpn iptables
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Prepare verified inventory
        run: |
          set -euo pipefail
          (cd .vpn-pilot/geoip-release && sha256sum -c geoip_RU.dat.sha256sum)
          (cd .vpn-pilot/upstream/.github/reachability/inventory && GOTOOLCHAIN=local go build -mod=mod -o "$RUNNER_TEMP/vpn-inventory" .)
          "$RUNNER_TEMP/vpn-inventory" .vpn-pilot/geoip-release/geoip_RU.dat .vpn-pilot/inventory.tsv
      - name: Compare DNS and HTTPS inside verified RU VPN exits
        timeout-minutes: 10
        run: |
          set -euo pipefail
          upstream="$PWD/.vpn-pilot/upstream/.github/reachability"
          py="$(command -v python)"
          sudo env GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" PYTHONDONTWRITEBYTECODE=1 \
            bash "$upstream/vpn_netns_exec.sh" -- timeout --signal=TERM --kill-after=6s 8m \
              "$py" -B tools/vpn_dns_benchmark.py "$AUDIT/vpnobratno_get.py" vpn-plan/benchmark.tsv .vpn-pilot/inventory.tsv \
                "$upstream" .vpn-pilot/benchmark --exits 2 --attempts 6 --connect-timeout 16
      - name: Upload benchmark observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpn-dns-benchmark
          path: |
            vpn-plan/benchmark.tsv
            .vpn-pilot/benchmark/geosite-vpnobratno-summary.json
            .vpn-pilot/benchmark/vpnobratno-observations.jsonl
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
