name: Targeted 603-name RU audit
on:
  push:
    branches: [audit/ru-domain-liveness]
    paths: [.github/workflows/ru-audit-603.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'dnspython==2.7.0'
      - uses: actions/download-artifact@v4
        with:
          name: plan603
          run-id: 45464155753
          github-token: ${{ github.token }}
          path: plan603
      - run: python tools/audit_603_authority.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authority603
          path: authority603/
          retention-days: 90
          if-no-files-found: warn
  collect:
    if: always()
    needs: [authority]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: plan603
          run-id: 45464155753
          github-token: ${{ github.token }}
          path: plan603
      - uses: actions/download-artifact@v4
        with:
          name: ru-final-service-recount
          run-id: 45456957539
          github-token: ${{ github.token }}
          path: previous
      - uses: actions/download-artifact@v4
        with:
          name: ru-audit-verified-reports
          run-id: 45428437312
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          name: dns603
          run-id: 45464155753
          github-token: ${{ github.token }}
          path: dns603
      - uses: actions/download-artifact@v4
        with:
          name: foreign603
          run-id: 45464155753
          github-token: ${{ github.token }}
          path: foreign603
      - uses: actions/download-artifact@v4
        with:
          pattern: ru603-*
          run-id: 45464155753
          github-token: ${{ github.token }}
          path: ru603
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: authority603
          path: authority603
      - name: Reconcile saved observations without repeating network checks
        run: python3 tools/audit_603_collect.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit603-results
          path: results603/
          retention-days: 90
          if-no-files-found: warn
