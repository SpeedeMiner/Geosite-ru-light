name: Update RU-BLOCKED
on:
  push:
    branches: [feat/add-ru-blocked-category]
    paths:
      - "tools/**"
      - ".github/workflows/update-ru-blocked.yml"
      - "README.md"
  schedule:
    - cron: "15 0 * * 1"
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Recheck all domains
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ru-blocked-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install resolver
        run: python -m pip install dnspython==2.7.0
      - name: Test
        run: |
          python -m unittest discover -s tools -p 'test_*.py'
          go test ./...
          go build ./tools/ru-geosite-filter
          go build ./tools/geosite-delta
      - name: Restore probe cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/ru_blocked_probe_cache.json
          key: ru-blocked-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ru-blocked-v1-
      - name: Download source snapshots and pinned compilers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p input bin
          curl -fsSL --retry 3 --max-time 180 -o input/geosite.dat https://raw.githubusercontent.com/runetfreedom/russia-blocked-geosite/release/geosite-ru-only.dat
          curl -fsSL --retry 3 --max-time 180 -o input/geoip.dat https://raw.githubusercontent.com/SpeedeMiner/Geoip-ru-server/cdn/geoip_RU.dat
          curl -fsSL --retry 3 --max-time 180 -o /tmp/sing.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.13.12/sing-box-1.13.12-linux-amd64.tar.gz
          echo "1540533adb3df24f5ad5f14b5c7ca3dbc2401b10a1c1eb278fcadcada47ec6c4  /tmp/sing.tar.gz" | sha256sum -c -
          tar xzf /tmp/sing.tar.gz --strip-components=1 -C bin sing-box-1.13.12-linux-amd64/sing-box
          curl -fsSL --retry 3 --max-time 180 -o /tmp/mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.19.27/mihomo-linux-amd64-v1-v1.19.27.gz
          echo "b922f6fc90a232b9265db1cc9c5206fee8479dc2047bb037ebf09bc3c9e3b352  /tmp/mihomo.gz" | sha256sum -c -
          gzip -dc /tmp/mihomo.gz > bin/mihomo
          chmod +x bin/mihomo bin/sing-box
      - name: Build and verify DAT, SRS and MRS
        env:
          SING_BOX: ${{ github.workspace }}/bin/sing-box
          MIHOMO: ${{ github.workspace }}/bin/mihomo
          FORCE_REFRESH: ${{ inputs.force_refresh }}
        run: |
          args=()
          if [[ "$FORCE_REFRESH" == "true" ]]; then args+=(--force-refresh); fi
          python tools/build_ru_blocked.py --source input/geosite.dat --geoip input/geoip.dat --cache .cache/ru_blocked_probe_cache.json --output dist "${args[@]}"
      - name: Save probe cache
        uses: actions/cache/save@v4
        with:
          path: .cache/ru_blocked_probe_cache.json
          key: ru-blocked-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload verified artifacts and statistics
        uses: actions/upload-artifact@v4
        with:
          name: ru-blocked-${{ github.run_id }}
          path: dist/
          if-no-files-found: error

