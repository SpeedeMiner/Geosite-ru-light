name: Focused mail and delegation checks
on:
  push:
    branches: [audit/ru-domain-liveness]
    paths: [.github/workflows/ru-audit-344.yml]
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install dnspython==2.7.0
      - uses: actions/download-artifact@v4
        with:
          name: audit603-results
          run-id: 45555011119
          github-token: ${{ github.token }}
          path: prior
      - run: python tools/audit_344_services.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ru-audit-344-evidence
          path: evidence344/
          if-no-files-found: warn
          retention-days: 90
