name: Verify exact RU exclusion delta
on:
  push:
    branches: [fix/remove-unregistered-ru-domains]
    paths: [.github/workflows/ru-exclusion-proof.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: geosite-ru-v11-pr-audit
          run-id: 45459770303
          github-token: ${{ github.token }}
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: ru-audit-verified-reports
          run-id: 45428437312
          github-token: ${{ github.token }}
          path: baseline
      - name: Verify exact typed delta and eligible host coverage
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 90 https://github.com/SpeedeMiner/Geosite-ru-light/releases/download/latest-optimized/geosite_RU.dat -o old.dat
          mkdir -p proof
          python3 - <<'PY'
          import collections,hashlib,json,pathlib
          expected=set("aksyuterian.com aodahl.com avito-services.com bluestacksads.com bluestacksapi.com bluestackscdn.com bluestackscloud.com bluestacksdata.com bluestacksengine.com bonus-card.ml cdn-tinkoff.com honestmark.org investalfabank.com lead-pro2023.online rosbank-credit.com russieactuelle.fr sberfinance.net sbruss.store smsemailstats.com tbankjob.site tinkoff-anketa.site tinkoff-digital.com tinkoffdigital.com tinkoffip.site tinkoffreg.site tynkoff.cc vk.cloud vkcache.com vkusvill.net".split())
          raw=pathlib.Path('old.dat').read_bytes()
          digest=hashlib.sha256(raw).hexdigest()
          if digest!='027939e3a31591bd48a57428c893a8237fe61352d90a8c3077b39366a3a3d0cc': raise SystemExit('rolling DAT changed: '+digest)
          def vi(b,i):
            v=0;shift=0
            while i<len(b) and shift<70:
              x=b[i];i+=1;v|=(x&127)<<shift
              if x<128:return v,i
              shift+=7
            raise ValueError('invalid varint')
          def fields(b):
            i=0
            while i<len(b):
              tag,i=vi(b,i);n,w=tag>>3,tag&7
              if w==0:v,i=vi(b,i)
              elif w==2:
                size,i=vi(b,i);end=i+size
                if end>len(b):raise ValueError('truncated')
                v=b[i:end];i=end
              elif w==1:v=b[i:i+8];i+=8
              elif w==5:v=b[i:i+4];i+=4
              else:raise ValueError('invalid wire')
              yield n,w,v
          def parse(data):
            result={}
            for f,w,site in fields(data):
              if (f,w)!=(1,2):continue
              entries=list(fields(site));cat=next(v.decode().upper() for a,b,v in entries if (a,b)==(1,2))
              if cat in result:raise ValueError('duplicate category')
              values=[]
              for a,b,v in entries:
                if (a,b)!=(2,2):continue
                d=list(fields(v));typ=next((x for i,j,x in d if (i,j)==(1,0)),0)
                name=next(x.decode() for i,j,x in d if (i,j)==(2,2))
                values.append((typ,name))
              if len(values)!=len(set(values)):raise ValueError('duplicate typed rule '+cat)
              result[cat]=set(values)
            return result
          a=parse(raw);b=parse(pathlib.Path('candidate/geosite_RU.dat').read_bytes())
          lost=a['RU']-b['RU'];added=b['RU']-a['RU']
          if lost!={(2,h) for h in expected} or added:raise SystemExit('RU exact delta mismatch: '+str((lost,added)))
          if set(a)!=set(b) or any(a[c]!=b[c] for c in a if c!='RU'):raise SystemExit('protected category change')
          baseline=json.loads(pathlib.Path('baseline/report.json').read_text())['manifest']
          host_rules=baseline['hosts_to_rules']
          if set(expected)-set(host_rules):raise SystemExit('excluded name absent from audit plan')
          retained={h for h,rules in host_rules.items() if any((r['type_code'],r['value']) in b['RU'] for r in rules)}
          if set(host_rules)-retained!=expected:raise SystemExit('unexpected eligible host loss')
          summary={'release_sha256':digest,'candidate_sha256':hashlib.sha256(pathlib.Path('candidate/geosite_RU.dat').read_bytes()).hexdigest(),'ru_before':len(a['RU']),'ru_after':len(b['RU']),'lost_exact':sorted(x[1] for x in lost),'added':len(added),'other_categories_unchanged':True,'eligible_before':len(host_rules),'eligible_after':len(retained)}
          pathlib.Path('proof/summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ru-exclusion-exact-proof
          path: proof/
          retention-days: 90
          if-no-files-found: warn
