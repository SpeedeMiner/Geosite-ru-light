name: Verify unresolved registrations
on:
  push:
    branches: [audit/ru-domain-liveness]
    paths: [.github/workflows/ru-fqdn-rdap.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  rdap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'aiohttp==3.11.18'
      - uses: actions/download-artifact@v4
        with:
          name: ru-fqdn-classification-refined
          run-id: 45449297996
          github-token: ${{ github.token }}
          path: refined
      - run: python tools/audit_fqdn_rdap.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ru-fqdn-classification-final
          path: enriched/
          retention-days: 90
          if-no-files-found: warn
