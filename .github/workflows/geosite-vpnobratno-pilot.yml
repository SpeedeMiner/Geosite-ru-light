name: GeoSite reviewed CDN and video DNS attribution

on:
  push:
    branches: [research/geosite-ru-wide-20261114-1810]
    paths: [.github/workflows/geosite-vpnobratno-pilot.yml]

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Compare public DNS and RIPE records without VPN
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures
          import json
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          hosts = """cdnvideo.com www.cdnvideo.com doc.cdnvideo.com globalcloudnetwork.ru dashboard.globalcloudnetwork.ru
          videomost.com trueconf.com developers.trueconf.com check.livedigital.space macroscop.com
          doc.macroscop.com cloud.macroscop.com pro.macroscop.com packages.macroscop.com store.ivideon.com
          bx-static.ivideon.com packages.ivideon.com updates.iv-cdn.com trassircloud.com shop.trassircloud.com
          confluence.trassir.com support.trassir.com sigma.cloud.trassir.com stratonet.net www.stratonet.net""".split()
          resolvers = {'google':'https://dns.google/resolve','cloudflare':'https://cloudflare-dns.com/dns-query'}

          def get(url):
              req = Request(url, headers={'Accept':'application/dns-json, application/json'})
              with urlopen(req, timeout=8) as res:
                  return json.loads(res.read(262144))

          def dns(q):
              name, host, qt = q
              r = dict(kind='dns', resolver=name, host=host, query=qt)
              try:
                  d = get(resolvers[name] + '?' + urlencode(dict(name=host, type=qt)))
                  r.update(status=d.get('Status'), answers=[a for a in d.get('Answer',[]) if a.get('type') in (1,5,28)])
              except (OSError, ValueError) as e:
                  r['error'] = type(e).__name__
              return r

          def ripe(asn):
              r = dict(kind='rir', asn=asn)
              try:
                  d = get('https://rest.db.ripe.net/ripe/aut-num/AS' + str(asn) + '.json')
                  attrs = d['objects']['object'][0]['attributes']['attribute']
                  r['aut_num'] = next((i['value'] for i in attrs if i['name']=='aut-num'), '')
                  r['as_name'] = next((i['value'] for i in attrs if i['name']=='as-name'), '')
                  r['org'] = next((i['value'] for i in attrs if i['name']=='org'), '')
                  r['relation_57363_204720'] = [i['value'] for i in attrs if i['name'] in ('import','export','mp-import','mp-export') and
                                               (asn==57363 and 'AS204720' in i['value'] or asn==204720 and 'AS57363' in i['value'])]
              except (OSError, ValueError, KeyError, IndexError) as e:
                  r['error'] = type(e).__name__
              return r

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as p:
              rows = list(p.map(dns, ((n,h,q) for h in hosts for n in resolvers for q in ('A','AAAA'))))
              rows.extend(p.map(ripe, (57363,204720,60068)))
          Path('cdn-dns.jsonl').write_text(''.join(json.dumps(x,sort_keys=True)+'\n' for x in rows))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geosite-cdn-video-dns
          path: cdn-dns.jsonl
          if-no-files-found: error
          retention-days: 7
