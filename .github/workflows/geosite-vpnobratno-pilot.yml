name: GeoSite Selectel and LiveDigital public DNS and download checks

on:
  push:
    branches: [research/geosite-ru-wide-20261114-1810]
    paths: [.github/workflows/geosite-vpnobratno-pilot.yml]

permissions:
  contents: read

jobs:
  public-observation:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Query two public resolvers and sample published downloads
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import tempfile
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          hosts = [
              'cdn.selectel.ru', 'cdn-blog.selectel.ru', 'www.novochag.ru', 'edu.livedigital.space',
              'docs.livedigital.space', 'help.livedigital.space', 'livedigital.space',
              'downloads.livedigital.space', 'check.livedigital.space',
              '900e128c-56c0-4e51-8817-ad005b45783f.selcdn.net',
          ]
          resolvers = {'google': 'https://dns.google/resolve', 'cloudflare': 'https://cloudflare-dns.com/dns-query'}

          def dns(item):
              resolver, host, qtype = item
              row = dict(kind='dns', resolver=resolver, host=host, qtype=qtype)
              url = resolvers[resolver] + '?' + urlencode({'name': host, 'type': qtype})
              try:
                  with urlopen(Request(url, headers={'Accept': 'application/dns-json'}), timeout=8) as response:
                      data = json.loads(response.read(65536))
                  row.update(status=data.get('Status'), answers=[a for a in data.get('Answer', []) if a.get('type') in (1, 5, 28)])
              except (OSError, ValueError) as error:
                  row.update(error=type(error).__name__)
              return row

          def download(url):
              row = dict(kind='download_range', url=url)
              with tempfile.TemporaryDirectory() as tmp:
                  body = Path(tmp) / 'body'
                  proc = subprocess.run(['curl', '-q', '-sS', '--max-time', '12', '--max-filesize', '65536',
                                         '--range', '0-511', '--proto', '=https', '--output', str(body),
                                         '--write-out', '%{json}', '--', url], capture_output=True, text=True, timeout=15)
                  data = json.loads(proc.stdout or '{}')
                  row.update(curl_exit=proc.returncode, tls_verify=data.get('ssl_verify_result'),
                             http=data.get('response_code'), mime=data.get('content_type'),
                             redirect_url=data.get('redirect_url'), remote_ip=data.get('remote_ip'))
                  if body.exists():
                      sample = body.read_bytes()
                      row.update(sample_size=len(sample), sha256=hashlib.sha256(sample).hexdigest())
              return row

          tasks = [(resolver, host, qtype) for host in hosts for resolver in resolvers for qtype in ('A','AAAA')]
          files = ['livedigital-arm64-latest.dmg', 'livedigital-latest.dmg']
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
              a = list(pool.map(dns, tasks))
              b = list(pool.map(download, ['https://downloads.livedigital.space/livedigital-desktop/' + name for name in files]))
          Path('dns-downloads.jsonl').write_text(''.join(json.dumps(r, sort_keys=True) + '\n' for r in a + b))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geosite-selcdn-dns-downloads
          path: dns-downloads.jsonl
          if-no-files-found: error
          retention-days: 7
