name: GeoSite VPNObratno GET pool

on:
  push:
    branches:
      - research/geosite-ru-wide-20261114-1810
    paths:
      - .github/workflows/geosite-vpnobratno-pilot.yml

permissions:
  contents: read

concurrency:
  group: geosite-vpnobratno-pilot
  cancel-in-progress: false

jobs:
  pilot:
    name: VPN GET pool batch ${{ matrix.batch }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: ["01", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14", "15", "16", "17", "18"]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AUDIT: docs/research/2026-11-14-wide-post-v11-18/get-audit
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout the GeoSite research commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout the unchanged reviewed GeoIP transport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SpeedeMiner/Geoip-ru-server
          ref: 30e797f05ddb8e38ccc2c44938b64846b4fce2fb
          path: .vpn-pilot/upstream
          persist-credentials: false

      - name: Checkout the fixed GeoIP inventory input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: SpeedeMiner/Geoip-ru-server
          ref: 7eef1efcaafbdbe259f3aa4e56a07c38979afbfb
          path: .vpn-pilot/geoip-release
          persist-credentials: false

      - name: Install OpenVPN and check runner capabilities
        timeout-minutes: 6
        run: |
          set -euo pipefail
          test -c /dev/net/tun
          if ! command -v openvpn >/dev/null || ! command -v iptables >/dev/null; then
            sudo timeout --signal=TERM --kill-after=2s 45s python3 -B - <<'PYTHON'
          from pathlib import Path
          import sys
          sys.path.insert(0, ".vpn-pilot/upstream/.github/reachability")
          from vpn_gate import install_ubuntu_apt_host_overrides
          install_ubuntu_apt_host_overrides(Path("/etc/hosts"))
          PYTHON
            sudo timeout --kill-after=5s 120s apt-get \
              -o Acquire::Retries=1 -o Acquire::http::Timeout=12 \
              -o Acquire::https::Timeout=12 -o APT::Update::Error-Mode=any update
            sudo timeout --kill-after=5s 90s apt-get \
              -o Acquire::Retries=1 -o Acquire::http::Timeout=12 \
              -o Acquire::https::Timeout=12 install -y --no-install-recommends openvpn iptables
          fi
          command -v ip openvpn iptables ip6tables curl
          bash -n .vpn-pilot/upstream/.github/reachability/vpn_netns_exec.sh
          python3 -m unittest discover -s "$AUDIT" -p test_vpnobratno_get.py -q

      - name: Set up the upstream inventory exporter
        uses: actions/setup-go@0778a10ce47b5d450cf60fb94fafad4330008a35
        with:
          go-version: "1.26.10"
          cache: false

      - name: Export a checksum-verified inventory for annotations
        timeout-minutes: 3
        run: |
          set -euo pipefail
          (cd .vpn-pilot/geoip-release && sha256sum -c geoip_RU.dat.sha256sum)
          (
            cd .vpn-pilot/upstream/.github/reachability/inventory
            GOTOOLCHAIN=local go build -mod=mod -o "$RUNNER_TEMP/geosite-vpn-inventory" .
          )
          "$RUNNER_TEMP/geosite-vpn-inventory" \
            .vpn-pilot/geoip-release/geoip_RU.dat .vpn-pilot/inventory.tsv

      - name: Measure this pool batch from two distinct Russian ASNs
        timeout-minutes: 8
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          set -euo pipefail
          upstream="$PWD/.vpn-pilot/upstream/.github/reachability"
          sudo env GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" PYTHONDONTWRITEBYTECODE=1 \
            bash "$upstream/vpn_netns_exec.sh" -- \
              timeout --signal=TERM --kill-after=6s 7m \
              python3 -B "$AUDIT/vpnobratno_get.py" \
                "$AUDIT/vpnobratno/pool-01-plans/batch-$BATCH.tsv" .vpn-pilot/inventory.tsv \
                "$upstream" .vpn-pilot/report --exits 2 --attempts 6 --connect-timeout 12

      - name: Upload observation and diagnostic reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: geosite-pool-01-batch-${{ matrix.batch }}-${{ github.run_attempt }}
          path: |
            .vpn-pilot/report/geosite-vpnobratno-summary.json
            .vpn-pilot/report/vpnobratno-observations.jsonl
            .vpn-pilot/report/vpn_gate_summary.json
            .vpn-pilot/report/vpn_gate_providers.tsv
            .vpn-pilot/report/vpn_gate_vpnobratto_progress.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
