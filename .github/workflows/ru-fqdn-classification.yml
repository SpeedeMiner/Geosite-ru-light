name: Complete RU FQDN classification
on:
  push:
    branches: [audit/ru-domain-liveness]
    paths: [.github/workflows/ru-fqdn-classification.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'aiohttp==3.11.18' 'publicsuffix2==2.20191221'
      - uses: actions/download-artifact@v4
        with:
          name: ru-fqdn-freshness
          run-id: 45447983660
          github-token: ${{ github.token }}
          path: fresh
      - uses: actions/download-artifact@v4
        with:
          name: ru-audit-assembled-report
          run-id: 45445214672
          github-token: ${{ github.token }}
          path: preserved
      - name: Check registration and classify all FQDNs
        run: python tools/audit_fqdn_classify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ru-fqdn-classification
          path: final-freshness/
          if-no-files-found: warn
          retention-days: 90
