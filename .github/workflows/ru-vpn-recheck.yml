name: RU VPN liveness recheck (review only)
on:
  push:
    branches: [audit/ru-domain-liveness]
    paths:
      - .github/workflows/ru-vpn-recheck.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vpn-recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      AUDIT: .vpn-pilot/research/docs/research/2026-11-14-wide-post-v11-18/get-audit
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout reviewed GeoSite VPN adapter
        uses: actions/checkout@v4
        with:
          ref: c84fc559733525194da3f899cc5b10bc8a1bdebf
          path: .vpn-pilot/research
          persist-credentials: false
      - name: Checkout pinned VPN transport
        uses: actions/checkout@v4
        with:
          repository: SpeedeMiner/Geoip-ru-server
          ref: 30e797f05ddb8e38ccc2c44938b64846b4fce2fb
          path: .vpn-pilot/upstream
          persist-credentials: false
      - name: Checkout pinned inventory
        uses: actions/checkout@v4
        with:
          repository: SpeedeMiner/Geoip-ru-server
          ref: 7eef1efcaafbdbe259f3aa4e56a07c38979afbfb
          path: .vpn-pilot/geoip-release
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install 'aiohttp==3.11.18' 'dnspython==2.7.0' 'publicsuffix2==2.20191221'
      - name: Run verified baseline audit
        run: python tools/audit_ru_liveness.py
      - name: Select up to 10 repeatable suspect hostnames
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          data=json.loads(Path('audit-output/report.json').read_text(encoding='utf-8'))
          expected='027939e3a31591bd48a57428c893a8237fe61352d90a8c3077b39366a3a3d0cc'
          if data['metadata']['sha256'] != expected:
              raise SystemExit('Release changed since the previous audit: comparison stopped')
          candidates=[r for r in data['rules'] if r.get('state') in ('network_error','tls_error') and r.get('repeat',{}).get('result') in ('network_error','tls_error')]
          candidates.sort(key=lambda r:(r['type']!='full',r['value']))
          selected=[]; seen=set()
          for r in candidates:
              h=r['hostname']
              if h in seen: continue
              seen.add(h); selected.append(r)
              if len(selected)==10: break
          if not selected: raise SystemExit('No repeatable network/TLS candidates')
          with open('audit-output/vpn-plan.tsv','w',encoding='utf-8',newline='') as f:
              fields=['cohort','type','rule','host','url','markers','source']
              w=csv.DictWriter(f,fieldnames=fields,delimiter='\t'); w.writeheader()
              for r in selected:
                  h=r['hostname']; w.writerow(dict(cohort='audit',type=r['type'],rule=r['value'],host=h,url='https://'+h+'/',markers='',source='verified rolling DAT'))
          print('Selected', len(selected), 'repeatable network/TLS rules; full rules prioritised')
          PY
      - name: Install isolated VPN transport dependencies
        timeout-minutes: 5
        run: |
          set -euo pipefail
          test -c /dev/net/tun
          sudo timeout 120s apt-get -o Acquire::Retries=1 update
          sudo timeout 90s apt-get -o Acquire::Retries=1 install -y --no-install-recommends openvpn iptables
          command -v ip openvpn iptables ip6tables curl
          python -m unittest discover -s "$AUDIT" -p test_vpnobratno_get.py -q
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Export pinned GeoIP annotations
        run: |
          set -euo pipefail
          (cd .vpn-pilot/geoip-release && sha256sum -c geoip_RU.dat.sha256sum)
          (cd .vpn-pilot/upstream/.github/reachability/inventory && GOTOOLCHAIN=local go build -mod=mod -o "$RUNNER_TEMP/vpn-inventory" .)
          "$RUNNER_TEMP/vpn-inventory" .vpn-pilot/geoip-release/geoip_RU.dat .vpn-pilot/inventory.tsv
      - name: Measure targets through distinct verified RU VPN ASNs
        timeout-minutes: 12
        run: |
          set -euo pipefail
          upstream="$PWD/.vpn-pilot/upstream/.github/reachability"
          sudo env GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" PYTHONDONTWRITEBYTECODE=1 \
            bash "$upstream/vpn_netns_exec.sh" -- timeout --signal=TERM --kill-after=6s 10m \
              python3 -B "$AUDIT/vpnobratno_get.py" audit-output/vpn-plan.tsv .vpn-pilot/inventory.tsv \
                "$upstream" .vpn-pilot/report --exits 2 --attempts 6 --connect-timeout 16
      - name: Print sanitized evidence
        if: always()
        run: |
          if test -f .vpn-pilot/report/geosite-vpnobratno-summary.json; then cat .vpn-pilot/report/geosite-vpnobratno-summary.json; fi
          if test -f .vpn-pilot/report/vpnobratno-observations.jsonl; then cat .vpn-pilot/report/vpnobratno-observations.jsonl; fi
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ru-vpn-recheck
          path: |
            audit-output/report.json
            audit-output/report.md
            audit-output/vpn-plan.tsv
            .vpn-pilot/report/geosite-vpnobratno-summary.json
            .vpn-pilot/report/vpnobratno-observations.jsonl
            .vpn-pilot/report/vpn_gate_summary.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
