name: Trace RU candidate source inputs
on:
  push:
    branches: [audit/ru-domain-liveness]
    paths: [.github/workflows/ru-candidate-sources.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'aiohttp==3.11.18' 'dnspython==2.7.0' 'publicsuffix2==2.20191221'
      - uses: actions/download-artifact@v4
        with:
          name: ru-fqdn-classification-reviewed
          run-id: 45449848242
          github-token: ${{ github.token }}
          path: existing
      - run: python tools/audit_ru_candidate_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ru-candidate-source-matches
          path: source-audit/
          retention-days: 90
          if-no-files-found: warn
