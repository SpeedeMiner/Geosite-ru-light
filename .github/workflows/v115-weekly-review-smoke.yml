name: v11.5 weekly Draft PR smoke test (no publish)

on:
  push:
    branches: [ci/v115-weekly-review-smoke-20261113]
    paths: [.github/workflows/v115-weekly-review-smoke.yml]

permissions: {}
concurrency:
  group: v115-weekly-review-smoke-20261113

jobs:
  verify:
    if: github.repository == 'SpeedeMiner/Geosite-ru-light' && github.ref == 'refs/heads/ci/v115-weekly-review-smoke-20261113'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out published v11.5 code
        uses: actions/checkout@v7
        with:
          ref: 3a6b31071d04a9f85ab80bbabb434e962e3aeac7
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and verify two isolated pending review fixtures
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/weekly-smoke"
          mkdir -p "$work"
          curl -fsSL --retry 2 "https://github.com/$GITHUB_REPOSITORY/releases/download/v11.5/geosite_RU.dat" -o "$work/base.dat"
          echo "9e13ae5da4122ea9567bb99c5c108503079083ed3eb5d7c97ca0f940ac9e068f  $work/base.dat" | sha256sum -c -
          curl -fsSL --retry 2 "https://github.com/$GITHUB_REPOSITORY/releases/download/v11.5/geosite_RU_hydra_appended_categories.txt" -o "$work/hydra.txt"
          go build -o "$work/filter" ./tools/ru-geosite-filter
          go build -o "$work/delta" ./tools/geosite-delta
          python3 - "$work" <<'PY'
          from pathlib import Path
          import sys

          work = Path(sys.argv[1])
          raw = (work / "base.dat").read_bytes()

          def varint(n):
              data = bytearray()
              while n >= 128:
                  data.append((n & 127) | 128)
                  n >>= 7
              return data + bytes([n])

          def field(n, data):
              return varint(n << 3 | 2) + varint(len(data)) + data

          assert raw[0] == 10
          n = 0
          for i, b in enumerate(raw[1:], 1):
              n |= (b & 127) << ((i - 1) * 7)
              if b < 128:
                  break
          offset = i + 1
          assert raw[offset:offset + 4] == b"\x0a\x02RU"
          for label in ("create", "update"):
              domain = ("weekly-review-smoke-" + label + ".example").encode()
              rule = field(2, b"\x08\x02" + field(2, domain))
              candidate = field(1, raw[offset:offset + n] + rule) + raw[offset + n:]
              (work / f"{label}.dat").write_bytes(candidate)
          PY
          for label in create update; do
            RU_APPROVED_MANIFEST="$PWD/data/v11-approved-effective-ru.txt" "$work/filter" validate "$work/$label.dat" "$work/hydra.txt"
            code=0
            "$work/delta" "$work/base.dat" "$work/$label.dat" "$work/$label.md" data/v11-approved-effective-ru.txt || code=$?
            test "$code" = 3
            grep -F -- "domain:weekly-review-smoke-$label.example" "$work/$label.md"
            sed -i '2a **TEST FIXTURE ONLY. Reserved .example name. Do not merge or approve.**' "$work/$label.md"
          done
      - name: Exercise GitHub Actions token and the shipped review writer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/weekly-smoke" <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys

          sys.path.insert(0, "tools")
          import publish_weekly_review as weekly

          # Only redirect the published writer to an isolated draft branch.
          # It still uses the production token permissions, git and gh paths.
          weekly.BRANCH = "auto/weekly-review-smoke-v115-20261113"
          weekly.BRANCH_REF = f"refs/heads/{weekly.BRANCH}"
          weekly.TITLE = "[SMOKE TEST, do not merge] v11.5 weekly Draft PR"
          os.environ.update(
              GITHUB_SHA=weekly.git("rev-parse", "HEAD"),
              GITHUB_REF="refs/heads/main",
              GITHUB_EVENT_NAME="schedule",
          )
          repo = os.environ["GITHUB_REPOSITORY"]
          work = Path(sys.argv[1])

          def head():
              return weekly.remote_sha(weekly.BRANCH_REF)

          assert not head(), "smoke branch already exists"
          first = None
          try:
              weekly.publish(work / "create.md")
              first = weekly.lookup_pr(repo)
              assert first and first["isDraft"] and first["headRefOid"] == head()
              assert "weekly-review-smoke-create.example" in first["body"]
              print(f"CREATED draft #{first['number']}: {first['url']}", flush=True)
              weekly.publish(work / "update.md")
              second = weekly.lookup_pr(repo)
              assert second and second["number"] == first["number"] and second["isDraft"]
              assert second["headRefOid"] != first["headRefOid"] and second["headRefOid"] == head()
              assert "weekly-review-smoke-update.example" in second["body"]
              assert "weekly-review-smoke-create.example" not in second["body"]
              assert weekly.git("diff", "--name-only", os.environ["GITHUB_SHA"], head()) == weekly.REPORT
              print(f"UPDATED same draft #{second['number']} with exactly one report file", flush=True)
              weekly.publish(work / "update.md")
              assert head() == second["headRefOid"]
              print("IDEMPOTENT retry preserved the same branch head", flush=True)
          finally:
              # Close only a draft owned by this smoke test. Keep its report
              # branch so the closed PR remains independently inspectable.
              owned = first or weekly.lookup_pr(repo)
              if owned:
                  weekly.gh("pr", "close", str(owned["number"]), "--repo", repo)
                  print(f"CLOSED smoke-only draft #{owned['number']}", flush=True)
          PY
