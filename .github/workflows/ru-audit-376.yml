name: Targeted functional follow-up
on:
  push:
    branches: [audit/ru-domain-liveness]
    paths: [.github/workflows/ru-audit-376.yml]
permissions:
  contents: read
  actions: read
jobs:
  feed-and-registry:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: audit603-results
          run-id: 45555011119
          github-token: ${{ github.token }}
          path: previous
      - uses: actions/download-artifact@v4
        with:
          name: audit376-functional
          run-id: 45556323219
          github-token: ${{ github.token }}
          path: original
      - run: python3 tools/audit_376_followup.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit376-followup
          path: followup376/
          retention-days: 90
  ipv6-control:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: audit603-results
          run-id: 45555011119
          github-token: ${{ github.token }}
          path: previous
      - run: python3 tools/audit_376_ipv6.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit376-ipv6-corrected
          path: ipv6.json
          retention-days: 90
