name: Compare ten ambiguous RU and US hosts
on:
  push:
    branches: [audit/ru-domain-liveness]
    paths: [.github/workflows/ru-geo-ten.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      AUDIT: .vpn-pilot/research/docs/research/2026-11-14-wide-post-v11-18/get-audit
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c84fc559733525194da3f899cc5b10bc8a1bdebf
          path: .vpn-pilot/research
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SpeedeMiner/Geoip-ru-server
          ref: 30e797f05ddb8e38ccc2c44938b64846b4fce2fb
          path: .vpn-pilot/upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: SpeedeMiner/Geoip-ru-server
          ref: 7eef1efcaafbdbe259f3aa4e56a07c38979afbfb
          path: .vpn-pilot/geoip-release
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ru-unknown-final-evidence
          run-id: 45453520178
          github-token: ${{ github.token }}
          path: joined
      - uses: actions/download-artifact@v4
        with:
          name: ru-audit-assembled-report
          run-id: 45445214672
          github-token: ${{ github.token }}
          path: preserved
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends openvpn iptables
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'aiohttp==3.11.18' 'dnspython==2.7.0' 'publicsuffix2==2.20191221'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - run: |
          set -euo pipefail
          (cd .vpn-pilot/geoip-release && sha256sum -c geoip_RU.dat.sha256sum)
          (cd .vpn-pilot/upstream/.github/reachability/inventory && GOTOOLCHAIN=local go build -mod=mod -o "$RUNNER_TEMP/vpn-inventory" .)
          "$RUNNER_TEMP/vpn-inventory" .vpn-pilot/geoip-release/geoip_RU.dat .vpn-pilot/inventory.tsv
          python tools/audit_geo_comparison.py plan
          python tools/audit_geo_comparison.py us
      - name: Probe same URLs in two verified RU networks
        id: russian
        continue-on-error: true
        run: |
          set -euo pipefail
          upstream="$PWD/.vpn-pilot/upstream/.github/reachability"
          py="$(command -v python)"
          sudo env GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" PYTHONDONTWRITEBYTECODE=1 \
            bash "$upstream/vpn_netns_exec.sh" -- timeout --signal=TERM --kill-after=6s 8m \
            "$py" -B tools/vpn_targeted_wrapper.py "$AUDIT/vpnobratno_get.py" geo-plan.tsv .vpn-pilot/inventory.tsv \
            "$upstream" .vpn-pilot/reports/main --exits 2 --attempts 6 --connect-timeout 16
      - name: Preserve matched results and missing exits
        if: always()
        run: python tools/audit_geo_comparison.py compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ru-us-matched-geo-ten
          path: |
            geo-plan.tsv
            geo-us/
            geo-comparison/
            .vpn-pilot/reports/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn
