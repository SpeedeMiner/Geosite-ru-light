name: RU release liveness audit
on:
  workflow_dispatch:
  push:
    branches: [audit/ru-domain-liveness]
    paths:
      - .github/workflows/audit-ru-liveness.yml
      - tools/audit_ru_liveness.py
      - tools/test_audit_ru_liveness.py
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'aiohttp==3.11.18' 'dnspython==2.7.0' 'publicsuffix2==2.20191221'
      - name: Run unit tests
        run: python -m unittest discover -s tools -p test_audit_ru_liveness.py -v
      - name: Audit verified release
        run: python tools/audit_ru_liveness.py
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ru-liveness-audit
          path: audit-output/
          if-no-files-found: warn
          retention-days: 14

