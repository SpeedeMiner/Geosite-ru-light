name: Build Ultimate Light RU Geosite (Optimized v11.5)

concurrency:
  group: build-ultimate-light-ru-geosite
  # Never cancel a run that may be halfway through publishing; queue instead.
  cancel-in-progress: false

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "local/**"
      # Audit policy and comparator changes must also trigger PR checks.
      - "data/**"
      - "tools/**"
      - "docs/**"
      - "go.mod"
      - "go.sum"
  schedule:
    # Каждый понедельник в 00:00 UTC
    - cron: "0 0 * * 1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "local/**"
      - "data/**"
      - "tools/**"
      - "go.mod"
      - "go.sum"

jobs:
  build:
    # PR builds run all tests but never publish production artifacts.
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      review_pending: ${{ steps.semantic_gate.outputs.review_pending }}

    permissions:
      contents: write

    env:
      # Актуальная полная GeoSite-база runetfreedom
      GEOSITE_URL: https://raw.githubusercontent.com/runetfreedom/russia-blocked-geosite/release/geosite.dat
      GEOSITE_SHA_URL: https://raw.githubusercontent.com/runetfreedom/russia-blocked-geosite/release/geosite.dat.sha256sum

      HYDRA_GEOSITE_URL: https://github.com/hydraponique/roscomvpn-geosite/releases/latest/download/geosite.dat
      GRIMBIRD_GEOSITE_URL: https://raw.githubusercontent.com/GrimbirdUsers/ru-routing-dat/main/geosite.dat
      MVR_GEOSITE_URL: https://raw.githubusercontent.com/mvrvntn/routing/release/geosite.dat
      YULARZHI_GEOSITE_URL: https://github.com/Yularzhi/geosite_russia/releases/latest/download/geosite.dat
      VPNYASHA_GEOSITE_URL: https://raw.githubusercontent.com/vpnyasha/geosite/main/geosite.dat
      KIRILL_GEOSITE_URL: https://github.com/kirilllavrov/RU-domain-list-for-whitelist/releases/latest/download/dlc.dat
      DIGNE_GEOSITE_URL: https://raw.githubusercontent.com/DigneZzZ/routing/main/v2ray/geosite.dat
      DAVOYAN_LEGACY_URL: https://raw.githubusercontent.com/Davoyan/mihomo-rule-sets/main/domains/category-ru-legacy.txt

      # Positive-only RU allow-pool enrichments. These are NOT refilter/block feeds.
      W1ZARDZ_RU_DIRECT_URL: https://raw.githubusercontent.com/w1zardz/amnezia-vpn-russia-split-tunneling/master/dist/ru-direct-domains.txt
      KYORESUAS_RU_STANDARD_URL: https://raw.githubusercontent.com/kyoresuas/ru-direct/release/ru-standard.domains.txt

      INPUT_FILE: source-geosite.dat
      HYDRA_INPUT_FILE: hydra-geosite.dat
      GRIMBIRD_INPUT_FILE: grimbird-geosite.dat
      MVR_INPUT_FILE: mvrvntn-geosite.dat
      YULARZHI_INPUT_FILE: yularzhi-geosite.dat
      VPNYASHA_INPUT_FILE: vpnyasha-geosite.dat
      KIRILL_INPUT_FILE: kirill-geosite.dat
      DIGNE_INPUT_FILE: digne-geosite.dat
      DAVOYAN_LEGACY_INPUT_FILE: davoyan-category-ru-legacy.txt
      W1ZARDZ_RU_DIRECT_INPUT_FILE: w1zardz-ru-direct-domains.txt
      KYORESUAS_RU_STANDARD_INPUT_FILE: kyoresuas-ru-standard-domains.txt

      # Shared by the filter and the semantic promotion gate.
      RU_APPROVED_MANIFEST: ${{ github.workspace }}/data/v11-approved-effective-ru.txt
      LOCAL_RU_INPUT_FILE: local/ru.txt
      LOCAL_BLOCK_INPUT_FILE: local/block.txt

      RU_SUPPRESSED_ROOTS_REPORT: geosite_RU_suppressed_roots.tsv
      OUTPUT_FILE: geosite_RU.dat
      CATEGORY_FILE: geosite_RU_categories.txt
      HYDRA_APPEND_FILE: geosite_RU_hydra_appended_categories.txt
      OUTPUT_SHA_FILE: geosite_RU.dat.sha256sum
      NEW_SOURCES_REPORT_FILE: geosite_RU_new_sources.txt

      # Sanity floor for the final RU pool.
      MIN_RU_RULES: "800"

    steps:
      # ------------------------------------------------------------
      # 1. Repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ------------------------------------------------------------
      # 2. Clone current domain-list-community
      # ------------------------------------------------------------
      - name: Clone domain-list-community
        uses: actions/checkout@v7
        with:
          repository: v2fly/domain-list-community
          path: domain-list-community
          fetch-depth: 1
          persist-credentials: false

      # ------------------------------------------------------------
      # 3. Setup Go according to current domain-list-community
      # ------------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # ------------------------------------------------------------
      # 4. Fetch sources. Only successful main builds seed future caches.
      # ------------------------------------------------------------
      - name: Restore last known-good Tier-2 source snapshots
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .geosite-source-cache
          key: geosite-tier2-v1-${{ hashFiles('tools/fetch_geosite_sources.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            geosite-tier2-v1-${{ hashFiles('tools/fetch_geosite_sources.py') }}-
      - name: Download source GeoSite files
        id: source_downloads
        run: python3 tools/fetch_geosite_sources.py

      # ------------------------------------------------------------
      # 5. Build RU category manifest from the current v2fly tree
      # ------------------------------------------------------------
      - name: Build RU category manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/build_ru_category_manifest.py

          test -s "$CATEGORY_FILE"
          test -s "$HYDRA_APPEND_FILE"

      # ------------------------------------------------------------
      # 6. Compile and unit-test the RU GeoSite tool
      # ------------------------------------------------------------
      - name: Compile and test RU GeoSite filter
        shell: bash
        run: |
          set -euo pipefail

          python3 -m unittest discover -s tools -p 'test_*.py'
          go test ./...
          go build -o /tmp/ru-geosite-filter ./tools/ru-geosite-filter
          go build -o /tmp/geosite-delta ./tools/geosite-delta
          echo "Filter compiled and policy-tested successfully."

      # ------------------------------------------------------------
      # 7. Generate final lightweight geosite_RU.dat
      # ------------------------------------------------------------
      - name: Build lightweight geosite_RU.dat
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$OUTPUT_FILE" "$OUTPUT_SHA_FILE" "$NEW_SOURCES_REPORT_FILE"

          test -s v2fly-corporate-extra-domains.txt
          cat "$LOCAL_RU_INPUT_FILE" v2fly-corporate-extra-domains.txt > /tmp/geosite-ru-v11-merged-local.txt

          /tmp/ru-geosite-filter build \
            "$INPUT_FILE" \
            "$HYDRA_INPUT_FILE" \
            "$GRIMBIRD_INPUT_FILE" \
            "$MVR_INPUT_FILE" \
            "$YULARZHI_INPUT_FILE" \
            "$VPNYASHA_INPUT_FILE" \
            "$KIRILL_INPUT_FILE" \
            "$DIGNE_INPUT_FILE" \
            "$DAVOYAN_LEGACY_INPUT_FILE" \
            "$CATEGORY_FILE" \
            "$HYDRA_APPEND_FILE" \
            /tmp/geosite-ru-v11-merged-local.txt \
            "$LOCAL_BLOCK_INPUT_FILE" \
            "$W1ZARDZ_RU_DIRECT_INPUT_FILE" \
            "$KYORESUAS_RU_STANDARD_INPUT_FILE" \
            "$NEW_SOURCES_REPORT_FILE" \
            "$OUTPUT_FILE"

          test -s "$OUTPUT_FILE"

          echo
          echo "========================================"
          echo "OUTPUT"
          echo "========================================"
          ls -lh "$OUTPUT_FILE"

      # ------------------------------------------------------------
      # 8. Final validation
      # ------------------------------------------------------------
      - name: Validate final DAT
        shell: bash
        run: |
          set -euo pipefail

          /tmp/ru-geosite-filter validate "$OUTPUT_FILE" "$HYDRA_APPEND_FILE"
          test -s "$NEW_SOURCES_REPORT_FILE"

      # ------------------------------------------------------------
      # 9. Calculate checksum
      # ------------------------------------------------------------
      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "$OUTPUT_FILE" > "$OUTPUT_SHA_FILE"
          cat "$OUTPUT_SHA_FILE"

      - name: Upload validated input for corporate audit
        if: github.event_name == 'pull_request' || github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: geosite-corporate-audit-input
          retention-days: 2
          if-no-files-found: error
          path: |
            geosite_RU.dat
            geosite_RU.dat.sha256sum

      # ------------------------------------------------------------
      # 9b. Reproducible semantic delta against the currently published DAT.
      # ------------------------------------------------------------
      - name: Audit semantic DAT delta against release
        id: semantic_gate
        # Fail closed before production publication, not just in PR builds.
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 --max-time 90 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-optimized/geosite_RU.dat" \
            -o /tmp/geosite-ru-released.dat
          test -s /tmp/geosite-ru-released.dat
          # Verify the published reference asset against its own checksum.
          # A stale/mismatched release reference must not authorize publishing.
          curl -fL --retry 3 --connect-timeout 15 --max-time 90 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-optimized/geosite_RU.dat.sha256sum" \
            -o /tmp/geosite-ru-released.dat.sha256sum
          RELEASE_SHA="$(awk 'NR==1{print $1}' /tmp/geosite-ru-released.dat.sha256sum)"
          test -n "$RELEASE_SHA"
          ACTUAL_SHA="$(sha256sum /tmp/geosite-ru-released.dat | awk '{print $1}')"
          test "$RELEASE_SHA" = "$ACTUAL_SHA" || { echo "ERROR: published DAT checksum differs from published SHA256" >&2; exit 1; }
          # Require the complete, exact promotion and preserve all non-RU
          # categories when building against the verified v11.1 snapshot.
          if [ "$ACTUAL_SHA" = "450f7b0d837671121c34f5a08adc35ef95f845e5abaa35fa47b0d0444a73ca83" ]; then
            export GEOSITE_EXPECTED_RU_ADDITIONS=33
          fi

          # This production gate also runs in pull requests and must not rely
          # on the optional external candidate inventory.
          RESULT=0
          /tmp/geosite-delta \
            /tmp/geosite-ru-released.dat "$OUTPUT_FILE" geosite_RU_semantic_delta.md \
            "$RU_APPROVED_MANIFEST" || RESULT=$?
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -s geosite_RU_semantic_delta.md ]; then
            cp geosite_RU_semantic_delta.md geosite_RU_production_preflight.md
          fi
          if [ "$RESULT" = 3 ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            test -s geosite_RU_semantic_delta.md
            echo "review_pending=true" >> "$GITHUB_OUTPUT"
            echo "### New RU rules need manual approval. Publication skipped." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RESULT" != 0 ]; then
            exit "$RESULT"
          else
            test -s geosite_RU_semantic_delta.md
            echo "publish_allowed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit optional external candidate inventory
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 --connect-timeout 15 --max-time 35 \
            "https://raw.githubusercontent.com/w1zardz/amnezia-vpn-russia-split-tunneling/master/data/external-candidates.json" \
            -o /tmp/geosite-ru-external-candidates.json
          test -s /tmp/geosite-ru-external-candidates.json
          /tmp/geosite-delta \
            /tmp/geosite-ru-released.dat "$OUTPUT_FILE" geosite_RU_inventory_delta.md \
            /tmp/geosite-ru-external-candidates.json geosite_RU_external_candidate_audit.md \
            data/v11-external-domain-review.tsv "$RU_APPROVED_MANIFEST"
          python3 tools/build_domain_research_queue.py geosite_RU_external_candidate_audit.md geosite_RU_attribution_research_queue.tsv

      # Unreviewed upstream additions must not silently land in a production
      # release. Preserve the candidate and the diff even if main/schedule gate
      # fails so maintainers can inspect and approve the incremental change.
      - name: Preserve blocked auto-update candidate for review
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (failure() || steps.semantic_gate.outputs.review_pending == 'true') }}
        uses: actions/upload-artifact@v4
        with:
          name: geosite-ru-main-blocked-update-review
          retention-days: 14
          if-no-files-found: warn
          path: |
            geosite_RU.dat
            geosite_RU.dat.sha256sum
            geosite_RU_semantic_delta.md
            geosite_RU_categories.txt
            geosite_RU_new_sources.txt
            geosite_RU_source_fetch.tsv
            geosite_RU_suppressed_roots.tsv
            data/v11-approved-effective-ru.txt

      - name: Upload PR candidate DAT and audit report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: geosite-ru-v11-pr-audit
          retention-days: 14
          if-no-files-found: error
          path: |
            geosite_RU.dat
            geosite_RU.dat.sha256sum
            geosite_RU_semantic_delta.md
            geosite_RU_production_preflight.md
            geosite_RU_external_candidate_audit.md
            geosite_RU_attribution_research_queue.tsv
            data/v11-external-domain-review.tsv
            data/v11-approved-effective-ru.txt
            geosite_RU_categories.txt
            geosite_RU_new_sources.txt
            geosite_RU_source_fetch.tsv
            geosite_RU_suppressed_roots.tsv
            v2fly-corporate-extra-domains.txt

      # ------------------------------------------------------------
      # 10. Publish GitHub Release
      # ------------------------------------------------------------
      - name: Verify release artifacts
        if: steps.semantic_gate.outputs.publish_allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFY RELEASE ARTIFACTS"
          echo "========================================"

          for file in \
            "$OUTPUT_FILE" \
            "$OUTPUT_SHA_FILE" \
            "$CATEGORY_FILE" \
            "$HYDRA_APPEND_FILE" \
            "$NEW_SOURCES_REPORT_FILE"; do
            test -s "$GITHUB_WORKSPACE/$file"
            echo "OK: $file"
          done

      - name: Cache validated fresh Tier-2 snapshots from main
        if: success() && github.ref == 'refs/heads/main' && steps.semantic_gate.outputs.publish_allowed == 'true' && steps.source_downloads.outputs.all_tier2_fresh == 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .geosite-source-cache
          key: geosite-tier2-v1-${{ hashFiles('tools/fetch_geosite_sources.py') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.semantic_gate.outputs.publish_allowed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-optimized
          name: "Optimized RU GeoSite v11.5"
          make_latest: true

          files: |
            ${{ env.OUTPUT_FILE }}
            ${{ env.OUTPUT_SHA_FILE }}
            ${{ env.CATEGORY_FILE }}
            ${{ env.HYDRA_APPEND_FILE }}
            ${{ env.NEW_SOURCES_REPORT_FILE }}

          body: |
            # Optimized RU GeoSite v11.5

            - Opens or updates a report-only weekly Draft PR for unreviewed RU additions.
            - Does not publish pending candidates or import audit findings into RU or BLOCK.
            - Retains the v11.3 protection for exact hosts and Tier-2 fallback.
            - 4pda.to and its subdomains remain excluded from RU-DIRECT.

            Details: https://github.com/${{ github.repository }}/blob/main/docs/v11-5-weekly-review.md

          fail_on_unmatched_files: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # 11. Publish files to release branch and verify exact CDN content
      # ------------------------------------------------------------
      - name: Publish files to release branch and sync CDN
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.semantic_gate.outputs.publish_allowed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          STAGE="$(mktemp -d)"
          trap 'rm -rf "$STAGE"' EXIT

          for file in \
            "$OUTPUT_FILE" \
            "$OUTPUT_SHA_FILE" \
            "$CATEGORY_FILE" \
            "$HYDRA_APPEND_FILE" \
            "$NEW_SOURCES_REPORT_FILE"; do
            cp "$file" "$STAGE/"
          done

          cd "$STAGE"

          git init -q -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -q -m "Update optimized RU GeoSite"

          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic ${AUTH}" \
            push --force "https://github.com/${GITHUB_REPOSITORY}.git" release

          echo "========================================"
          echo "Waiting for GitHub raw cache propagation"
          echo "========================================"

          EXPECTED_SHA="$(awk '{print $1}' "$OUTPUT_SHA_FILE")"
          echo "Target SHA256: $EXPECTED_SHA"

          RAW_UPDATED=false
          for i in {1..12}; do
            REMOTE_SHA="$(curl -fsSL --max-time 10 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/release/${OUTPUT_SHA_FILE}?cb=$(date +%s%N)" | awk '{print $1}' || true)"
            if [ "$REMOTE_SHA" = "$EXPECTED_SHA" ]; then
              echo "GitHub raw updated successfully (check $i/12)."
              RAW_UPDATED=true
              break
            fi
            sleep 5
          done

          if [ "$RAW_UPDATED" != true ]; then
            echo "WARNING: GitHub raw checksum has not propagated within the validation window."
            echo "WARNING: Release branch is updated, but raw.githubusercontent.com may still serve cached content."
          fi

          echo "========================================"
          echo "Purging jsDelivr CDN cache"
          echo "========================================"

          curl -sS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/" || true
          echo
          curl -sS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/${OUTPUT_FILE}" || true
          echo
          curl -sS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/${OUTPUT_SHA_FILE}" || true
          echo

          echo "========================================"
          echo "Verifying exact jsDelivr SHA256"
          echo "========================================"

          CDN_UPDATED=false
          for i in {1..12}; do
            CDN_SHA="$(curl -fsSL --max-time 30 "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/${OUTPUT_FILE}?cb=$(date +%s%N)" | sha256sum | awk '{print $1}' || true)"
            echo "CDN SHA (check $i/12): $CDN_SHA"
            if [ "$CDN_SHA" = "$EXPECTED_SHA" ]; then
              echo "SUCCESS: jsDelivr content SHA256 matches local DAT."
              CDN_UPDATED=true
              break
            fi
            sleep 5
          done

          if [ "$CDN_UPDATED" != true ]; then
            echo "WARNING: jsDelivr content SHA256 did not match within the validation window."
            echo "WARNING: The release branch is updated; CDN edge propagation may still be in progress."
          fi

      # ------------------------------------------------------------
      # 11b. Immutable versioned release and floating-tag alignment.
      # ------------------------------------------------------------
      - name: Publish immutable v11.5 release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.semantic_gate.outputs.publish_allowed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # This tag represents the audited v11.5 source snapshot. Never move an
          # existing versioned tag on future automated weekly rebuilds.
          if gh release view v11.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Immutable v11.5 release already exists; preserving its tag."
          else
            EXPECTED_SHA="$(awk 'NR==1{print $1}' "$OUTPUT_SHA_FILE")"
            gh release create v11.5 \
              "$OUTPUT_FILE" \
              "$OUTPUT_SHA_FILE" \
              "$CATEGORY_FILE" \
              "$HYDRA_APPEND_FILE" \
              "$NEW_SOURCES_REPORT_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "GeoSite RU Light v11.5" \
              --latest=false \
              --notes "v11.5: a weekly Draft PR queues unreviewed RU additions without publishing them. DAT SHA256: $EXPECTED_SHA. Details: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/v11-5-weekly-review.md"
          fi
          gh release view v11.5 --repo "$GITHUB_REPOSITORY" --json tagName,url --jq '.url'
          test "$(gh release view v11.5 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "false"

      - name: Align floating latest-optimized tag with successful main release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.semantic_gate.outputs.publish_allowed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest-optimized" --jq '.object.sha')"
          echo "Previously published floating tag: $CURRENT"
          if [ "$CURRENT" != "$GITHUB_SHA" ]; then
            # latest-optimized is intentionally floating; v11 through v11.5 remain immutable.
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest-optimized" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          fi
          VERIFIED="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest-optimized" --jq '.object.sha')"
          test "$VERIFIED" = "$GITHUB_SHA" || {
            echo "ERROR: floating release tag does not match main commit" >&2
            exit 1
          }
          echo "latest-optimized tag now points to $VERIFIED"

      # ------------------------------------------------------------
      # 12. Workflow summary
      # ------------------------------------------------------------
      - name: Print download URLs
        if: steps.semantic_gate.outputs.publish_allowed == 'true'
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "DOWNLOAD URLS"
          echo "========================================"
          echo
          echo "GitHub Release:"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-optimized/${OUTPUT_FILE}"
          echo
          echo "Raw release branch:"
          echo "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/release/${OUTPUT_FILE}"
          echo
          echo "jsDelivr CDN:"
          echo "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@release/${OUTPUT_FILE}"
          echo
          echo "Positive-source delta report:"
          echo "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/release/${NEW_SOURCES_REPORT_FILE}"
          echo
          echo "SHA256:"
          cat "$OUTPUT_SHA_FILE"

  weekly-review:
    # Only trusted scheduled builds can invoke this write-capable job.
    needs: build
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && needs.build.outputs.review_pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout review tooling
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Download blocked candidate evidence
        uses: actions/download-artifact@v4
        with:
          name: geosite-ru-main-blocked-update-review
          path: ${{ runner.temp }}/geosite-weekly-review
      - name: Open or update the weekly Draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: python3 tools/publish_weekly_review.py "$RUNNER_TEMP/geosite-weekly-review/geosite_RU_semantic_delta.md"

  corporate-audit:
    # This job consumes an artifact. No build or publishing step depends on it.
    needs: build
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout audit tools
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: false
      - name: Download validated DAT
        id: audit_input
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: geosite-corporate-audit-input
          path: .corporate-audit-input
      - name: Generate review-only corporate report
        id: audit_report
        if: steps.audit_input.outcome == 'success'
        continue-on-error: true
        run: bash tools/run_corporate_audit.sh
      - name: Summarize audit status
        if: ${{ !cancelled() }}
        env:
          AUDIT_OUTCOME: ${{ steps.audit_report.outcome }}
        run: |
          if [ "$AUDIT_OUTCOME" = success ]; then
            echo "### Corporate discovery (review only)" >> "$GITHUB_STEP_SUMMARY"
            grep -E '^Observed:|^\*\*Collection incomplete' geosite_RU_discovered_candidates.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Corporate discovery unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo "No successful review report was generated. See this job's logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload corporate audit evidence
        if: ${{ !cancelled() && steps.audit_input.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: geosite-ru-corporate-domain-discovery
          retention-days: 14
          if-no-files-found: warn
          path: |
            geosite_RU_discovered_candidates.md
            geosite_RU_discovery_raw.tsv
            geosite_RU_discovery_review_queue.tsv
            geosite_RU_discovery_status.json
            data/corporate_discovery_seeds.tsv
