name: Build Ultimate Light RU Geosite (Optimized v9)

concurrency:
  group: build-ultimate-light-ru-geosite
  # Never cancel a run that may be halfway through publishing; queue instead.
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    # Каждый понедельник в 00:00 UTC
    - cron: "0 0 * * 1"
  push:
    branches:
      - main
    # Rebuild when the workflow itself or the local lists change.
    paths:
      - ".github/workflows/**"
      - "local/**"

jobs:
  build:
    # Publication is allowed only from the main branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    env:
      # Актуальная полная GeoSite-база runetfreedom
      GEOSITE_URL: https://raw.githubusercontent.com/runetfreedom/russia-blocked-geosite/release/geosite.dat
      GEOSITE_SHA_URL: https://raw.githubusercontent.com/runetfreedom/russia-blocked-geosite/release/geosite.dat.sha256sum

      HYDRA_GEOSITE_URL: https://github.com/hydraponique/roscomvpn-geosite/releases/latest/download/geosite.dat
      GRIMBIRD_GEOSITE_URL: https://raw.githubusercontent.com/GrimbirdUsers/ru-routing-dat/main/geosite.dat
      MVR_GEOSITE_URL: https://raw.githubusercontent.com/mvrvntn/routing/release/geosite.dat
      YULARZHI_GEOSITE_URL: https://github.com/Yularzhi/geosite_russia/releases/latest/download/geosite.dat
      VPNYASHA_GEOSITE_URL: https://raw.githubusercontent.com/vpnyasha/geosite/main/geosite.dat
      KIRILL_GEOSITE_URL: https://github.com/kirilllavrov/RU-domain-list-for-whitelist/releases/latest/download/dlc.dat
      DIGNE_GEOSITE_URL: https://raw.githubusercontent.com/DigneZzZ/routing/main/v2ray/geosite.dat
      DAVOYAN_LEGACY_URL: https://raw.githubusercontent.com/Davoyan/mihomo-rule-sets/main/domains/category-ru-legacy.txt

      # Positive-only RU allow-pool enrichments. These are NOT refilter/block feeds.
      W1ZARDZ_RU_DIRECT_URL: https://raw.githubusercontent.com/w1zardz/amnezia-vpn-russia-split-tunneling/master/dist/ru-direct-domains.txt
      KYORESUAS_RU_STANDARD_URL: https://raw.githubusercontent.com/kyoresuas/ru-direct/release/ru-standard.domains.txt

      INPUT_FILE: source-geosite.dat
      HYDRA_INPUT_FILE: hydra-geosite.dat
      GRIMBIRD_INPUT_FILE: grimbird-geosite.dat
      MVR_INPUT_FILE: mvrvntn-geosite.dat
      YULARZHI_INPUT_FILE: yularzhi-geosite.dat
      VPNYASHA_INPUT_FILE: vpnyasha-geosite.dat
      KIRILL_INPUT_FILE: kirill-geosite.dat
      DIGNE_INPUT_FILE: digne-geosite.dat
      DAVOYAN_LEGACY_INPUT_FILE: davoyan-category-ru-legacy.txt
      W1ZARDZ_RU_DIRECT_INPUT_FILE: w1zardz-ru-direct-domains.txt
      KYORESUAS_RU_STANDARD_INPUT_FILE: kyoresuas-ru-standard-domains.txt

      LOCAL_RU_INPUT_FILE: local/ru.txt
      LOCAL_BLOCK_INPUT_FILE: local/block.txt

      OUTPUT_FILE: geosite_RU.dat
      CATEGORY_FILE: geosite_RU_categories.txt
      HYDRA_APPEND_FILE: geosite_RU_hydra_appended_categories.txt
      OUTPUT_SHA_FILE: geosite_RU.dat.sha256sum
      NEW_SOURCES_REPORT_FILE: geosite_RU_new_sources.txt

      # Sanity floor for the final RU pool.
      MIN_RU_RULES: "800"

    steps:
      # ------------------------------------------------------------
      # 1. Repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # ------------------------------------------------------------
      # 2. Clone current domain-list-community
      # ------------------------------------------------------------
      - name: Clone domain-list-community
        uses: actions/checkout@v7
        with:
          repository: v2fly/domain-list-community
          path: domain-list-community
          fetch-depth: 1
          persist-credentials: false

      # ------------------------------------------------------------
      # 3. Setup Go according to current domain-list-community
      # ------------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: domain-list-community/go.mod
          cache-dependency-path: domain-list-community/go.sum

      # ------------------------------------------------------------
      # 4. Download source GeoSite files
      # ------------------------------------------------------------
      - name: Download source GeoSite files
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Downloading GeoSite sources"
          echo "========================================"

          for local_list in "$LOCAL_RU_INPUT_FILE" "$LOCAL_BLOCK_INPUT_FILE"; do
            if [ ! -f "$local_list" ]; then
              echo "ERROR: required local list is missing: $local_list" >&2
              exit 1
            fi
          done

          download_source() {
            local label="$1"
            local url="$2"
            local output="$3"

            echo "--- $label"
            echo "URL: $url"
            rm -f "$output"

            if ! curl -fsSL \
              --connect-timeout 20 \
              --max-time 300 \
              --retry 5 \
              --retry-delay 2 \
              --retry-max-time 180 \
              --retry-all-errors \
              "$url" -o "$output"; then
              echo "ERROR: download failed: $label" >&2
              echo "ERROR: URL: $url" >&2
              rm -f "$output"
              return 1
            fi

            if ! test -s "$output"; then
              echo "ERROR: downloaded file is empty: $label" >&2
              rm -f "$output"
              return 1
            fi

            ls -lh "$output"
          }

          download_all() {
            local spec label url output i
            local pids=() logs=()
            local failed=0

            mkdir -p .download-logs
            i=0
            for spec in "$@"; do
              IFS='|' read -r label url output <<< "$spec"
              logs+=(".download-logs/$i.log")
              download_source "$label" "$url" "$output" > ".download-logs/$i.log" 2>&1 &
              pids+=("$!")
              i=$((i + 1))
            done

            for i in "${!pids[@]}"; do
              wait "${pids[$i]}" || failed=1
              cat "${logs[$i]}"
            done

            rm -rf .download-logs
            return "$failed"
          }

          RUNET_SPECS=(
            "runetfreedom GeoSite|$GEOSITE_URL|$INPUT_FILE"
            "runetfreedom SHA256|$GEOSITE_SHA_URL|source-geosite.dat.sha256sum"
          )

          download_all \
            "${RUNET_SPECS[@]}" \
            "Hydra GeoSite|$HYDRA_GEOSITE_URL|$HYDRA_INPUT_FILE" \
            "Grimbird GeoSite|$GRIMBIRD_GEOSITE_URL|$GRIMBIRD_INPUT_FILE" \
            "mvrvntn GeoSite|$MVR_GEOSITE_URL|$MVR_INPUT_FILE" \
            "Yularzhi GeoSite|$YULARZHI_GEOSITE_URL|$YULARZHI_INPUT_FILE" \
            "vpnyasha GeoSite|$VPNYASHA_GEOSITE_URL|$VPNYASHA_INPUT_FILE" \
            "Kirill GeoSite|$KIRILL_GEOSITE_URL|$KIRILL_INPUT_FILE" \
            "Digne GeoSite|$DIGNE_GEOSITE_URL|$DIGNE_INPUT_FILE" \
            "Davoyan legacy|$DAVOYAN_LEGACY_URL|$DAVOYAN_LEGACY_INPUT_FILE" \
            "W1ZARDZ RU direct domains|$W1ZARDZ_RU_DIRECT_URL|$W1ZARDZ_RU_DIRECT_INPUT_FILE" \
            "KYORESUAS RU standard domains|$KYORESUAS_RU_STANDARD_URL|$KYORESUAS_RU_STANDARD_INPUT_FILE"

          echo "Local RU list    : $LOCAL_RU_INPUT_FILE"
          echo "Local BLOCK list : $LOCAL_BLOCK_INPUT_FILE"

          echo
          echo "========================================"
          echo "Verifying SHA256 of runetfreedom source"
          echo "========================================"

          sha_ok=false
          for attempt in 1 2 3; do
            EXPECTED_SHA256="$(awk 'NF {print $1; exit}' source-geosite.dat.sha256sum)"
            ACTUAL_SHA256="$(sha256sum "$INPUT_FILE" | awk '{print $1}')"

            echo "Expected: $EXPECTED_SHA256"
            echo "Actual:   $ACTUAL_SHA256"

            if [ -n "$EXPECTED_SHA256" ] && [ "$EXPECTED_SHA256" = "$ACTUAL_SHA256" ]; then
              sha_ok=true
              break
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "WARNING: SHA256 mismatch (attempt $attempt/3); upstream may be mid-update, retrying in 15s..." >&2
              sleep 15
              download_all "${RUNET_SPECS[@]}"
            fi
          done

          if [ "$sha_ok" != true ]; then
            echo "ERROR: SHA256 mismatch for runetfreedom source!" >&2
            exit 1
          fi

          echo "SHA256 verification OK."

          echo
          echo "Downloaded sources:"
          ls -lh \
            "$INPUT_FILE" \
            "$HYDRA_INPUT_FILE" \
            "$GRIMBIRD_INPUT_FILE" \
            "$MVR_INPUT_FILE" \
            "$YULARZHI_INPUT_FILE" \
            "$VPNYASHA_INPUT_FILE" \
            "$KIRILL_INPUT_FILE" \
            "$DIGNE_INPUT_FILE" \
            "$DAVOYAN_LEGACY_INPUT_FILE" \
            "$W1ZARDZ_RU_DIRECT_INPUT_FILE" \
            "$KYORESUAS_RU_STANDARD_INPUT_FILE"

      # ------------------------------------------------------------
      # 5. Build RU category manifest from the current v2fly tree
      # ------------------------------------------------------------
      - name: Build RU category manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          DATA = Path("domain-list-community/data")
          output = Path(os.environ["CATEGORY_FILE"])

          selected = set()
          visited = set()
          missing_v2fly = set()

          excluded = {
              "private",
              "category-ip-geo-detect",
              "ipip",
              "tld-ru",
              "category-geoblock-ru",
          }

          def normalize(name: str) -> str:
              return name.strip().lower()

          def is_negative_category(name: str) -> bool:
              name = normalize(name)
              if not name:
                  return False
              if any(marker in name for marker in ("blocked", "geoblock", "re-filter", "refilter")):
                  return True
              return re.search(r"(^|[-_.])ban([-_.]|$)", name) is not None

          def is_excluded(name: str) -> bool:
              name = normalize(name)
              if not name:
                  return True
              if name in excluded:
                  return True
              return is_negative_category(name)

          def visit(name: str):
              name = normalize(name)

              if not name or name in visited or is_excluded(name):
                  return

              visited.add(name)
              path = DATA / name

              if not path.is_file():
                  missing_v2fly.add(name)
                  return

              selected.add(f"runetfreedom|{name}")

              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except Exception as exc:
                  raise RuntimeError(f"failed to read v2fly category {name}: {exc}") from exc

              for raw_line in text.splitlines():
                  line = raw_line.split("#", 1)[0].strip()
                  if not line:
                      continue

                  if line.lower().startswith("include:"):
                      payload = line.split(":", 1)[1].strip()
                      parts = payload.split()
                      # Selective includes with attributes are filters, not whole-list
                      # includes. The resolved category-ru in the upstream DAT already
                      # contains the effective rules, so do not promote the child here.
                      if len(parts) != 1:
                          continue
                      target = parts[0]
                      if re.fullmatch(r"[A-Za-z0-9_.!+-]+", target):
                          visit(target)

          visit("category-ru")

          for path in sorted(DATA.iterdir()):
              if (
                  path.is_file()
                  and not path.name.startswith(".")
                  and path.name.lower().endswith("-ru")
              ):
                  visit(path.name)

          extra_categories = {
              "2gis", "aviasales", "autoru", "avito", "dzen", "kinopoisk",
              "mailru", "mailru-group", "max", "mosmetro", "mts", "ok", "okko",
              "ozon", "rutube", "sokolov", "wildberries", "wb", "wink", "x5",
              "yandex",
              "beget", "carrotquest", "cdek", "comssone", "drweb", "envybox",
              "gismeteo", "group-ib", "headhunter", "ideco-ru", "kaspersky", "kontur",
              "mindbox", "myoffice-ru", "netcraze", "nic-ru", "positive-technologies",
              "regru", "selectel", "servicepipe", "skyeng", "smena", "tilda",
              "timeweb", "ucoz", "whoosh",
              "megafon", "mts-ru", "rostelecom", "t2-ru",
          }

          optional_missing = []
          for name in sorted(extra_categories):
              normalized = normalize(name)
              path = DATA / normalized
              if path.is_file():
                  visit(normalized)
              else:
                  optional_missing.append(normalized)

          if missing_v2fly:
              print()
              print("ERROR: required v2fly include categories are missing:")
              for name in sorted(missing_v2fly):
                  print(f"  - {name}")
              raise SystemExit(1)

          print()
          print(f"Optional standalone categories present: {len(extra_categories) - len(optional_missing)}/{len(extra_categories)}")
          if optional_missing:
              print("Optional standalone categories absent in current v2fly data (not fatal):")
              for name in optional_missing:
                  print(f"  - {name}")

          def add_external_categories(source: str, categories) -> int:
              excluded_count = 0
              for raw_name in categories:
                  name = normalize(raw_name)
                  if not name:
                      continue
                  if is_negative_category(name):
                      print(f"Excluded negative external category: {source}|{name}")
                      excluded_count += 1
                      continue
                  selected.add(f"{source}|{name}")
              return excluded_count

          excluded_external_count = 0

          excluded_external_count += add_external_categories("hydra", {
              "whitelist",
              "private",
              "category-ru",
          })

          excluded_external_count += add_external_categories("mvrvntn", {
              "category-ru",
          })

          excluded_external_count += add_external_categories("yularzhi", {
              "category-ru",
              "private",
          })

          excluded_external_count += add_external_categories("vpnyasha", {
              "our-whitelist",
              "our-category-ru",
              "our-games",
          })

          excluded_external_count += add_external_categories("kirill", {
              "category-ru",
          })

          excluded_external_count += add_external_categories("digne", {
              "category-ru",
          })

          excluded_external_count += add_external_categories("grimbird", {
              "category-ru-whitelist",
              "ozon",
              "ru-analytics",
              "ru-cdn",
              "ru-finance",
              "ru-medical",
              "ru-retail-extra",
              "ru-transport",
              "ru-tv",
              "ru-whitelist-extended",
              "swift",
          })

          leaked_negative = sorted(
              item for item in selected
              if is_negative_category(item.split("|", 1)[1])
          )
          if leaked_negative:
              print("ERROR: negative categories leaked into manifest:")
              for item in leaked_negative:
                  print(f"  - {item}")
              raise SystemExit(1)

          with output.open("w", encoding="utf-8") as f:
              for item in sorted(selected):
                  f.write(item + "\n")

          hydra_append_categories = [
              "apple",
              "epicgames",
              "escapefromtarkov",
              "faceit",
              "github",
              "google-deepmind",
              "google-play",
              "microsoft",
              "pinterest",
              "riot",
              "steam",
              "telegram",
              "twitch",
              "twitch-ads",
              "youtube",
              "win-spy",
          ]

          append_output = Path(os.environ["HYDRA_APPEND_FILE"])
          append_output.write_text(
              "\n".join(f"hydra|{name}" for name in hydra_append_categories) + "\n",
              encoding="utf-8",
          )

          print()
          print("========================================")
          print("RU CATEGORY MANIFEST")
          print("========================================")
          print(f"Manifest entries: {len(selected)}")
          print(f"Manifest written to: {output}")
          print(f"Excluded v2fly categories: {len(excluded)} fixed names + negative-name patterns")
          print(f"Excluded negative external categories: {excluded_external_count}")
          PY

          test -s "$CATEGORY_FILE"
          test -s "$HYDRA_APPEND_FILE"

      # ------------------------------------------------------------
      # 6. Compile and unit-test the RU GeoSite tool
      # ------------------------------------------------------------
      - name: Compile and test RU GeoSite filter
        shell: bash
        run: |
          set -euo pipefail

          TOOL_DIR=domain-list-community/tools/ru-geosite-filter
          mkdir -p "$TOOL_DIR"

          cat > "$TOOL_DIR/main.go" <<'EOF'
          package main

          import (
              "fmt"
              "os"
          )

          func usage() {
              fmt.Fprintf(os.Stderr, "usage:\n  %[1]s build    <17 positional arguments, see build.go>\n  %[1]s validate output.dat hydra_append_categories.txt\n", os.Args[0])
              os.Exit(2)
          }

          func main() {
              if len(os.Args) < 2 {
                  usage()
              }

              switch os.Args[1] {
              case "build":
                  runBuild(os.Args[2:])
              case "validate":
                  runValidate(os.Args[2:])
              default:
                  usage()
              }
          }
          EOF

          cat > "$TOOL_DIR/common.go" <<'EOF'
          package main

          import (
              "bufio"
              "fmt"
              "os"
              "strconv"
              "strings"
              "unicode"

              router "github.com/v2fly/v2ray-core/v5/app/router/routercommon"
              "google.golang.org/protobuf/proto"
          )

          const maxScanToken = 1024 * 1024

          func fatalf(format string, args ...any) {
              fmt.Fprintf(os.Stderr, "ERROR: "+format+"\n", args...)
              os.Exit(1)
          }

          func normalizeName(value string) string {
              return strings.ToLower(strings.TrimSpace(value))
          }

          func hasAttributeMarker(value string) bool {
              return strings.Contains(value, "@")
          }

          // RU-zone compaction policy.
          //
          // These roots are written to the RU category as RootDomain rules, i.e. the
          // Xray routing equivalent of domain:<root>. Both ASCII/Punycode and the
          // corresponding Unicode U-label are recognized on input, so e.g. foo.рф,
          // foo.xn--p1ai and nested subdomains all collapse to the same compact root.
          //
          // IMPORTANT: plain .org/.com/.net are NOT in this list. They are global TLDs.
          // The Cyrillic .орг/.ком zones are separate TLDs and may be compacted because
          // they are explicitly part of the configured Russian-language zone policy.
          var compactRussianRoots = []string{
              "ru",             // .ru
              "su",             // .su
              "xn--p1ai",      // .рф
              "moscow",        // .moscow
              "tatar",         // .tatar
              "xn--80adxhks",  // .москва
              "xn--p1acf",     // .рус
              "xn--d1acj3b",   // .дети
              "xn--c1avg",     // .орг
              "xn--j1aef",     // .ком
              "xn--80aswg",    // .сайт
              "xn--80asehdb",  // .онлайн
          }

          var russianTLDLabels = func() map[string]bool {
              m := make(map[string]bool)

              // Canonical ACE labels used in output.
              for _, root := range compactRussianRoots {
                  m[root] = true
              }

              // Unicode aliases seen in text sources.
              aliases := []string{
                  "рф",
                  "москва",
                  "рус",
                  "дети",
                  "орг",
                  "ком",
                  "сайт",
                  "онлайн",
              }
              for _, label := range aliases {
                  m[label] = true
              }

              return m
          }()

          // isRussianTLD reports whether value is exactly one configured RU-family
          // TLD or is below one. The last-label check also handles Unicode U-labels.
          func isRussianTLD(value string) bool {
              value = strings.TrimSuffix(strings.TrimSpace(normalizeName(value)), ".")
              if value == "" {
                  return false
              }

              if dot := strings.LastIndexByte(value, '.'); dot >= 0 {
                  value = value[dot+1:]
              }

              return russianTLDLabels[value]
          }

          func isCompactRussianRoot(value string) bool {
              value = normalizeName(value)
              for _, root := range compactRussianRoots {
                  if value == root {
                      return true
                  }
              }
              return false
          }

          func isAllDigits(s string) bool {
              if s == "" {
                  return false
              }
              for _, ch := range s {
                  if ch < '0' || ch > '9' {
                      return false
                  }
              }
              return true
          }

          func isValidDomain(value string) bool {
              if value == "" || len(value) > 253 {
                  return false
              }
              labels := strings.Split(value, ".")
              for _, label := range labels {
                  if label == "" || len(label) > 63 {
                      return false
                  }
                  if label[0] == '-' || label[len(label)-1] == '-' {
                      return false
                  }
                  for _, ch := range label {
                      switch {
                      case ch >= 'a' && ch <= 'z', ch >= '0' && ch <= '9', ch == '-', ch == '_':
                      case ch > unicode.MaxASCII && (unicode.IsLetter(ch) || unicode.IsDigit(ch)):
                      default:
                          return false
                      }
                  }
              }
              return !isAllDigits(labels[len(labels)-1])
          }

          func domainValueKey(domainType router.Domain_Type, value string) string {
              return strconv.Itoa(int(domainType)) + "|" + normalizeName(value)
          }

          func domainKey(domain *router.Domain) string {
              return domainValueKey(domain.Type, domain.Value)
          }

          func hasRootAncestor(value string, roots map[string]bool) bool {
              for parent := value; ; {
                  dot := strings.IndexByte(parent, '.')
                  if dot < 0 {
                      return false
                  }
                  parent = parent[dot+1:]
                  if roots[parent] {
                      return true
                  }
              }
          }

          func isCoveredByRoots(value string, roots map[string]bool) bool {
              value = normalizeName(value)
              if value == "" {
                  return false
              }
              return roots[value] || hasRootAncestor(value, roots)
          }

          func loadGeoSite(path string) (*router.GeoSiteList, error) {
              data, err := os.ReadFile(path)
              if err != nil {
                  return nil, err
              }

              list := new(router.GeoSiteList)
              if err := proto.Unmarshal(data, list); err != nil {
                  return nil, fmt.Errorf("invalid geosite %s: %w", path, err)
              }
              return list, nil
          }

          func newScanner(file *os.File) *bufio.Scanner {
              scanner := bufio.NewScanner(file)
              scanner.Buffer(make([]byte, 32*1024), maxScanToken)
              return scanner
          }

          func loadManifest(path string) (map[string]map[string]bool, error) {
              file, err := os.Open(path)
              if err != nil {
                  return nil, err
              }
              defer file.Close()

              result := make(map[string]map[string]bool)
              scanner := newScanner(file)
              for scanner.Scan() {
                  line := strings.TrimSpace(scanner.Text())
                  if line == "" || strings.HasPrefix(line, "#") {
                      continue
                  }

                  parts := strings.SplitN(line, "|", 2)
                  if len(parts) != 2 {
                      return nil, fmt.Errorf("invalid manifest entry: %q", line)
                  }

                  source := normalizeName(parts[0])
                  category := normalizeName(parts[1])
                  if source == "" || category == "" {
                      return nil, fmt.Errorf("invalid manifest entry: %q", line)
                  }

                  if result[source] == nil {
                      result[source] = make(map[string]bool)
                  }
                  result[source][category] = true
              }
              return result, scanner.Err()
          }

          func loadOrderedCategories(path string) ([]string, error) {
              file, err := os.Open(path)
              if err != nil {
                  return nil, err
              }
              defer file.Close()

              var categories []string
              seen := make(map[string]bool)
              scanner := newScanner(file)
              for scanner.Scan() {
                  line := strings.TrimSpace(scanner.Text())
                  if line == "" || strings.HasPrefix(line, "#") {
                      continue
                  }

                  parts := strings.SplitN(line, "|", 2)
                  if len(parts) != 2 || normalizeName(parts[0]) != "hydra" {
                      return nil, fmt.Errorf("invalid Hydra append manifest entry: %q", line)
                  }

                  category := normalizeName(parts[1])
                  if category == "" {
                      return nil, fmt.Errorf("empty Hydra category in manifest: %q", line)
                  }
                  if seen[category] {
                      return nil, fmt.Errorf("duplicate Hydra category in manifest: %q", category)
                  }
                  seen[category] = true
                  categories = append(categories, category)
              }
              if err := scanner.Err(); err != nil {
                  return nil, err
              }
              if len(categories) == 0 {
                  return nil, fmt.Errorf("hydra append manifest is empty")
              }
              return categories, nil
          }

          type skipReason int

          const (
              skipNone skipReason = iota
              skipBlank
              skipUnsupported
              skipInvalid
          )

          var unsupportedPrefixes = []string{
              "DOMAIN-KEYWORD,", "DOMAIN-REGEX,", "DOMAIN-WILDCARD,", "keyword:", "regexp:",
          }

          var typedPrefixes = []struct {
              prefix string
              typ    router.Domain_Type
              clash  bool
          }{
              {"DOMAIN-SUFFIX,", router.Domain_RootDomain, true},
              {"DOMAIN-FULL,", router.Domain_Full, true},
              // Clash DOMAIN is an exact domain, so preserve Full semantics for BLOCK.
              {"DOMAIN,", router.Domain_Full, true},
              {"domain:", router.Domain_RootDomain, false},
              {"full:", router.Domain_Full, false},
          }

          func trimPrefixFold(s, prefix string) (string, bool) {
              if len(s) >= len(prefix) && strings.EqualFold(s[:len(prefix)], prefix) {
                  return s[len(prefix):], true
              }
              return s, false
          }

          func normalizeDomainValue(value string) string {
              value = strings.TrimSpace(strings.TrimPrefix(strings.TrimSpace(value), "-"))
              for _, prefix := range []string{"+.", "*.", "."} {
                  if strings.HasPrefix(value, prefix) {
                      value = value[len(prefix):]
                      break
                  }
              }
              return strings.TrimSuffix(normalizeName(value), ".")
          }

          func parseRuleLine(raw string) (router.Domain_Type, string, skipReason) {
              line := strings.TrimSpace(strings.TrimPrefix(raw, "\ufeff"))
              if idx := strings.IndexByte(line, '#'); idx >= 0 {
                  line = strings.TrimSpace(line[:idx])
              }
              if line == "" {
                  return 0, "", skipBlank
              }

              for _, prefix := range unsupportedPrefixes {
                  if _, ok := trimPrefixFold(line, prefix); ok {
                      return 0, "", skipUnsupported
                  }
              }

              domainType := router.Domain_RootDomain
              for _, p := range typedPrefixes {
                  if rest, ok := trimPrefixFold(line, p.prefix); ok {
                      line, domainType = rest, p.typ
                      if p.clash {
                          if idx := strings.IndexByte(line, ','); idx >= 0 {
                              line = line[:idx]
                          }
                      }
                      break
                  }
              }

              value := normalizeDomainValue(line)
              if !isValidDomain(value) {
                  return 0, "", skipInvalid
              }
              return domainType, value, skipNone
          }

          type listStats struct {
              Rules       int
              Accepted    int
              Duplicates  int
              Unsupported int
              Invalid     int
              Samples     []string
          }

          func (s listStats) print(label string) {
              fmt.Printf("  %-32s rules=%-6d unique=%-6d dup=%-5d unsupported=%-4d invalid=%d\n",
                  label, s.Rules, s.Accepted, s.Duplicates, s.Unsupported, s.Invalid)
              for _, sample := range s.Samples {
                  fmt.Printf("    invalid sample: %q\n", sample)
              }
          }

          func scanRuleFile(path string, handle func(router.Domain_Type, string) bool) (listStats, error) {
              var stats listStats

              file, err := os.Open(path)
              if err != nil {
                  return stats, err
              }
              defer file.Close()

              scanner := newScanner(file)
              for scanner.Scan() {
                  domainType, value, reason := parseRuleLine(scanner.Text())
                  if reason == skipBlank {
                      continue
                  }
                  stats.Rules++

                  switch reason {
                  case skipUnsupported:
                      stats.Unsupported++
                  case skipInvalid:
                      stats.Invalid++
                      if len(stats.Samples) < 5 {
                          stats.Samples = append(stats.Samples, strings.TrimSpace(scanner.Text()))
                      }
                  default:
                      if handle(domainType, value) {
                          stats.Accepted++
                      } else {
                          stats.Duplicates++
                      }
                  }
              }
              return stats, scanner.Err()
          }

          func loadDomainList(path string, requireNonEmpty bool, label string) ([]string, error) {
              var domains []string
              seen := make(map[string]bool)

              stats, err := scanRuleFile(path, func(_ router.Domain_Type, value string) bool {
                  if seen[value] {
                      return false
                  }
                  seen[value] = true
                  domains = append(domains, value)
                  return true
              })
              if err != nil {
                  return nil, err
              }
              stats.print(label)

              if len(domains) == 0 && requireNonEmpty {
                  return nil, fmt.Errorf("%s domain list is empty", label)
              }
              return domains, nil
          }

          func loadBlockDomainList(path, label string) ([]*router.Domain, error) {
              var domains []*router.Domain
              seen := make(map[string]bool)

              stats, err := scanRuleFile(path, func(domainType router.Domain_Type, value string) bool {
                  key := domainValueKey(domainType, value)
                  if seen[key] {
                      return false
                  }
                  seen[key] = true
                  domains = append(domains, &router.Domain{Type: domainType, Value: value})
                  return true
              })
              if err != nil {
                  return nil, err
              }
              stats.print(label)
              return domains, nil
          }
          EOF

          cat > "$TOOL_DIR/build.go" <<'EOF'
          package main

          import (
              "bufio"
              "fmt"
              "os"
              "sort"
              "strconv"
              "strings"

              router "github.com/v2fly/v2ray-core/v5/app/router/routercommon"
              "google.golang.org/protobuf/proto"
          )

          const (
              argRunetfreedom = iota
              argHydra
              argGrimbird
              argMvrvntn
              argYularzhi
              argVpnyasha
              argKirill
              argDigne
              argDavoyan
              argManifest
              argHydraAppend
              argLocalRU
              argLocalBlock
              argW1zardz
              argKyoresuas
              argReport
              argOutput
              buildArgCount
          )

          const buildUsage = "usage: %s build runetfreedom.dat hydra.dat grimbird.dat mvrvntn.dat yularzhi.dat vpnyasha.dat kirill.dat digne.dat davoyan-legacy.txt selected.txt hydra_append.txt local-ru.txt local-block.txt w1zardz-ru-direct.txt kyoresuas-ru-standard-domains.txt new-positive-report.txt output.dat\n"

          const defaultMinRURules = 800

          func minRURules() int {
              value := strings.TrimSpace(os.Getenv("MIN_RU_RULES"))
              if value == "" {
                  return defaultMinRURules
              }
              n, err := strconv.Atoi(value)
              if err != nil || n < 0 {
                  fatalf("invalid MIN_RU_RULES value: %q", value)
              }
              return n
          }

          func addRoot(site *router.GeoSite, seen map[string]bool, value string) bool {
              key := domainValueKey(router.Domain_RootDomain, value)
              if seen[key] {
                  return false
              }
              seen[key] = true
              site.Domain = append(site.Domain, &router.Domain{
                  Type:  router.Domain_RootDomain,
                  Value: value,
              })
              return true
          }

          func pruneCoveredDomains(domains []*router.Domain) ([]*router.Domain, int) {
              roots := make(map[string]bool)
              for _, domain := range domains {
                  if domain == nil || domain.Type != router.Domain_RootDomain {
                      continue
                  }
                  if value := normalizeName(domain.Value); value != "" {
                      roots[value] = true
                  }
              }

              result := make([]*router.Domain, 0, len(domains))
              removed := 0
              for _, domain := range domains {
                  if domain == nil {
                      continue
                  }

                  value := normalizeName(domain.Value)
                  covered := false
                  switch domain.Type {
                  case router.Domain_RootDomain:
                      covered = hasRootAncestor(value, roots)
                  case router.Domain_Full:
                      covered = isCoveredByRoots(value, roots)
                  }

                  if covered {
                      removed++
                      continue
                  }
                  result = append(result, domain)
              }
              return result, removed
          }

          func sortDomains(domains []*router.Domain) {
              sort.Slice(domains, func(i, j int) bool {
                  a, b := domains[i], domains[j]
                  if a.Type != b.Type {
                      return a.Type < b.Type
                  }
                  return normalizeName(a.Value) < normalizeName(b.Value)
              })
          }

          type appendDomainStats struct {
              written              int
              duplicates           int
              removedRussian       int
              removedBare          int
              removedInvalid       int
          }

          func appendDomainStrings(category *router.GeoSite, values []string, seen map[string]bool, label string) appendDomainStats {
              stats := appendDomainStats{}
              for _, value := range values {
                  value = normalizeName(value)
                  if value == "" {
                      continue
                  }
                  if isRussianTLD(value) {
                      stats.removedRussian++
                      continue
                  }
                  if !strings.Contains(value, ".") {
                      stats.removedBare++
                      continue
                  }
                  if !isValidDomain(value) {
                      stats.removedInvalid++
                      continue
                  }
                  if !addRoot(category, seen, value) {
                      stats.duplicates++
                      continue
                  }
                  stats.written++
              }

              if stats.removedBare > 0 {
                  fmt.Printf("NOTE: %s: removed bare single-label rules: %d\n", label, stats.removedBare)
              }
              if stats.removedInvalid > 0 {
                  fmt.Printf("NOTE: %s: removed invalid domain rules: %d\n", label, stats.removedInvalid)
              }
              return stats
          }

          func collectNewPositiveSource(path, label string, baseRoots map[string]bool) (values []string, sourceLines int, skippedRussianTLD int, skippedBare int, skippedInvalid int, err error) {
              sourceValues, err := loadDomainList(path, true, label)
              if err != nil {
                  return nil, 0, 0, 0, 0, err
              }

              sort.Slice(sourceValues, func(i, j int) bool {
                  di := strings.Count(sourceValues[i], ".")
                  dj := strings.Count(sourceValues[j], ".")
                  if di != dj {
                      return di < dj
                  }
                  return sourceValues[i] < sourceValues[j]
              })

              for _, value := range sourceValues {
                  sourceLines++
                  if isRussianTLD(value) {
                      skippedRussianTLD++
                      continue
                  }
                  if !strings.Contains(value, ".") {
                      skippedBare++
                      continue
                  }
                  if !isValidDomain(value) {
                      skippedInvalid++
                      continue
                  }
                  if isCoveredByRoots(value, baseRoots) {
                      continue
                  }
                  values = append(values, value)
              }
              return values, sourceLines, skippedRussianTLD, skippedBare, skippedInvalid, nil
          }

          func runBuild(args []string) {
              if len(args) != buildArgCount {
                  fmt.Fprintf(os.Stderr, buildUsage, os.Args[0])
                  os.Exit(2)
              }

              outputPath := args[argOutput]
              reportPath := args[argReport]

              if outputPath == reportPath {
                  fatalf("output path and report path are the same: %s", outputPath)
              }
              for i := 0; i < argReport; i++ {
                  if args[i] == outputPath {
                      fatalf("output path collides with input argument %d: %s", i+1, outputPath)
                  }
                  if args[i] == reportPath {
                      fatalf("report path collides with input argument %d: %s", i+1, reportPath)
                  }
              }

              sources := []struct{ name, path string }{
                  {"runetfreedom", args[argRunetfreedom]},
                  {"hydra", args[argHydra]},
                  {"grimbird", args[argGrimbird]},
                  {"mvrvntn", args[argMvrvntn]},
                  {"yularzhi", args[argYularzhi]},
                  {"vpnyasha", args[argVpnyasha]},
                  {"kirill", args[argKirill]},
                  {"digne", args[argDigne]},
              }

              fmt.Println("Text sources:")
              legacyDomains, err := loadDomainList(args[argDavoyan], true, "Davoyan legacy")
              if err != nil {
                  fatalf("failed to read Davoyan legacy list: %v", err)
              }
              localRUDomains, err := loadDomainList(args[argLocalRU], false, "local RU")
              if err != nil {
                  fatalf("failed to read local RU list: %v", err)
              }
              localBlockDomains, err := loadBlockDomainList(args[argLocalBlock], "local BLOCK")
              if err != nil {
                  fatalf("failed to read local BLOCK list: %v", err)
              }

              positiveExtras := []struct{ name, path string }{
                  {"w1zardz-ru-direct-domains", args[argW1zardz]},
                  {"kyoresuas-ru-standard", args[argKyoresuas]},
              }

              manifest, err := loadManifest(args[argManifest])
              if err != nil {
                  fatalf("failed to read manifest: %v", err)
              }

              lists := make(map[string]*router.GeoSiteList, len(sources))
              for _, source := range sources {
                  list, err := loadGeoSite(source.path)
                  if err != nil {
                      fatalf("%v", err)
                  }
                  lists[source.name] = list
              }

              result := new(router.GeoSiteList)
              ruCategory := &router.GeoSite{CountryCode: "RU"}
              blockCategory := &router.GeoSite{CountryCode: "BLOCK"}
              globalSeen := make(map[string]bool)

              var (
                  sourceCategoryCount, sourceDomainCount, writtenDomainCount     int
                  duplicateDomainCount, removedRussianDomainCount                int
                  removedUnsupportedTypeCount, convertedFullToRootCount          int
                  removedCoveredDomainCount                                      int
                  localBlockDomainCount, removedCoveredBlockDomainCount           int
                  sourceAttributeCount, hydraAttributeCount                      int
                  appendedRuleCount, appendedDuplicateCount                      int
                  appendedConvertedFullToRootCount, appendedUnsupportedTypeCount int
                  appendedCoveredDomainCount                                     int
                  removedBareDomainCount, removedInvalidDomainCount              int
                  totalPositiveInput, totalPositiveNew, totalPositiveAdded       int
                  totalPositiveTLD, totalPositiveBare, totalPositiveInvalid       int
                  compactRootsAdded                                                int
              )

              manifestSources := make([]string, 0, len(manifest))
              for source := range manifest {
                  manifestSources = append(manifestSources, source)
              }
              sort.Strings(manifestSources)

              matched := make(map[string]map[string]bool, len(sources))
              for _, source := range sources {
                  matched[source.name] = make(map[string]bool)
              }

              for _, source := range manifestSources {
                  list, ok := lists[source]
                  if !ok {
                      fatalf("unknown source in manifest: %s", source)
                  }
                  selectedCategories := manifest[source]

                  for _, site := range list.Entry {
                      if site == nil {
                          continue
                      }

                      category := normalizeName(site.CountryCode)
                      if !selectedCategories[category] {
                          continue
                      }

                      matched[source][category] = true
                      sourceCategoryCount++

                      for _, domain := range site.Domain {
                          if domain == nil {
                              continue
                          }

                          sourceDomainCount++
                          sourceAttributeCount += len(domain.Attribute)

                          switch domain.Type {
                          case router.Domain_RootDomain:
                          case router.Domain_Full:
                              convertedFullToRootCount++
                          default:
                              removedUnsupportedTypeCount++
                              continue
                          }

                          value := normalizeName(domain.Value)
                          if value == "" {
                              continue
                          }
                          if hasAttributeMarker(value) {
                              fatalf("attribute marker embedded in RU source domain value: %s", domain.Value)
                          }
                          if isRussianTLD(value) {
                              removedRussianDomainCount++
                              continue
                          }
                          if !strings.Contains(value, ".") {
                              removedBareDomainCount++
                              continue
                          }
                          if !isValidDomain(value) {
                              removedInvalidDomainCount++
                              continue
                          }

                          if !addRoot(ruCategory, globalSeen, value) {
                              duplicateDomainCount++
                              continue
                          }
                          writtenDomainCount++
                      }
                  }
              }

              var missingExternal []string
              for _, source := range sources[1:] {
                  for category := range manifest[source.name] {
                      if !matched[source.name][category] {
                          missingExternal = append(missingExternal, source.name+"|"+category)
                      }
                  }
              }
              if len(missingExternal) > 0 {
                  sort.Strings(missingExternal)
                  fatalf("required external categories missing from source DATs: %s", strings.Join(missingExternal, ", "))
              }

              if !matched["runetfreedom"]["category-ru"] {
                  fatalf("category-ru not found in the runetfreedom DAT")
              }
              var absent []string
              for category := range manifest["runetfreedom"] {
                  if !matched["runetfreedom"][category] {
                      absent = append(absent, category)
                  }
              }
              if len(absent) > 0 {
                  sort.Strings(absent)
                  fmt.Printf("NOTE: %d v2fly categories are absent from the runetfreedom DAT (ignored): %s\n", len(absent), strings.Join(absent, ", "))
              }

              legacyDomainCount := len(legacyDomains)
              legacyStats := appendDomainStrings(ruCategory, legacyDomains, globalSeen, "Davoyan legacy")
              writtenDomainCount += legacyStats.written
              duplicateDomainCount += legacyStats.duplicates
              removedRussianDomainCount += legacyStats.removedRussian
              removedBareDomainCount += legacyStats.removedBare
              removedInvalidDomainCount += legacyStats.removedInvalid

              localStats := appendDomainStrings(ruCategory, localRUDomains, globalSeen, "local RU")
              writtenDomainCount += localStats.written
              duplicateDomainCount += localStats.duplicates
              removedRussianDomainCount += localStats.removedRussian
              removedBareDomainCount += localStats.removedBare
              removedInvalidDomainCount += localStats.removedInvalid

              blockSeen := make(map[string]bool)
              localBlockDuplicateCount := 0
              for _, domain := range localBlockDomains {
                  key := domainKey(domain)
                  if blockSeen[key] {
                      localBlockDuplicateCount++
                      continue
                  }
                  blockSeen[key] = true
                  blockCategory.Domain = append(blockCategory.Domain, domain)
                  localBlockDomainCount++
              }

              // Compact every configured RU-family TLD. This is deliberately broader
              // than only .ru/.su/.рф because the configured goal is to make every
              // domain in these Russian-language / Russian-region zones resolve to a
              // single RootDomain rule rather than keep thousands of individual names.
              for _, value := range compactRussianRoots {
                  if addRoot(ruCategory, globalSeen, value) {
                      writtenDomainCount++
                      compactRootsAdded++
                  }
              }

              reportFile, err := os.Create(reportPath)
              if err != nil {
                  fatalf("failed to create positive-source report: %v", err)
              }
              report := bufio.NewWriter(reportFile)

              fmt.Fprintln(report, "# Positive-only RU source delta")
              fmt.Fprintln(report, "# NEW = source domain not covered by the pre-enrichment RU root-domain set")
              fmt.Fprintln(report, "# refilter/block/negative feeds are intentionally excluded")
              fmt.Fprintln(report, "# Russian-family TLDs are compacted to configured RootDomain roots")
              fmt.Fprintln(report)

              baseRoots := make(map[string]bool)
              for _, domain := range ruCategory.Domain {
                  if domain.Type == router.Domain_RootDomain {
                      baseRoots[normalizeName(domain.Value)] = true
                  }
              }

              finalRoots := make(map[string]bool, len(baseRoots))
              for root := range baseRoots {
                  finalRoots[root] = true
              }

              for _, extra := range positiveExtras {
                  values, sourceLines, skippedTLD, skippedBare, skippedInvalid, err := collectNewPositiveSource(extra.path, extra.name, baseRoots)
                  if err != nil {
                      fatalf("failed positive source %s: %v", extra.name, err)
                  }

                  fmt.Fprintf(report, "\n[%s]\n", extra.name)
                  addedCount := 0

                  for _, value := range values {
                      fmt.Fprintln(report, value)

                      if isCoveredByRoots(value, finalRoots) {
                          continue
                      }
                      if !addRoot(ruCategory, globalSeen, value) {
                          continue
                      }
                      finalRoots[value] = true
                      writtenDomainCount++
                      addedCount++
                  }

                  totalPositiveInput += sourceLines
                  totalPositiveNew += len(values)
                  totalPositiveAdded += addedCount
                  totalPositiveTLD += skippedTLD
                  totalPositiveBare += skippedBare
                  totalPositiveInvalid += skippedInvalid
                  fmt.Fprintf(report, "# source_lines=%d new_vs_base=%d added_to_final_before_prune=%d skipped_ru_tld=%d skipped_bare=%d skipped_invalid=%d\n", sourceLines, len(values), addedCount, skippedTLD, skippedBare, skippedInvalid)
              }

              fmt.Fprintf(report, "\nTOTAL positive source lines: %d\n", totalPositiveInput)
              fmt.Fprintf(report, "TOTAL new vs base RU: %d\n", totalPositiveNew)
              fmt.Fprintf(report, "TOTAL added to final before prune: %d\n", totalPositiveAdded)
              fmt.Fprintf(report, "TOTAL skipped RU TLD: %d\n", totalPositiveTLD)
              fmt.Fprintf(report, "TOTAL skipped bare: %d\n", totalPositiveBare)
              fmt.Fprintf(report, "TOTAL skipped invalid: %d\n", totalPositiveInvalid)

              if err := report.Flush(); err != nil {
                  fatalf("failed to write positive-source report: %v", err)
              }
              if err := reportFile.Close(); err != nil {
                  fatalf("failed to close positive-source report: %v", err)
              }

              var pruned int
              ruCategory.Domain, pruned = pruneCoveredDomains(ruCategory.Domain)
              removedCoveredDomainCount += pruned
              sortDomains(ruCategory.Domain)

              blockCategory.Domain, removedCoveredBlockDomainCount = pruneCoveredDomains(blockCategory.Domain)
              sortDomains(blockCategory.Domain)

              if floor := minRURules(); len(ruCategory.Domain) < floor {
                  fatalf("RU category has only %d rules (minimum %d): upstream sources look broken", len(ruCategory.Domain), floor)
              }

              result.Entry = append(result.Entry, ruCategory, blockCategory)

              hydraAppendCategories, err := loadOrderedCategories(args[argHydraAppend])
              if err != nil {
                  fatalf("failed to read Hydra append manifest: %v", err)
              }

              wanted := make(map[string]bool, len(hydraAppendCategories))
              for _, category := range hydraAppendCategories {
                  wanted[category] = true
              }

              hydraByCategory := make(map[string]*router.GeoSite)
              for _, site := range lists["hydra"].Entry {
                  if site == nil {
                      continue
                  }
                  category := normalizeName(site.CountryCode)
                  if !wanted[category] {
                      continue
                  }
                  if _, exists := hydraByCategory[category]; exists {
                      fatalf("duplicate source category in Hydra DAT: %s", category)
                  }
                  hydraByCategory[category] = site
              }

              for _, category := range hydraAppendCategories {
                  site, ok := hydraByCategory[category]
                  if !ok {
                      fatalf("required Hydra category missing: %s", category)
                  }

                  dst := &router.GeoSite{CountryCode: strings.ToUpper(category)}
                  seen := make(map[string]bool, len(site.Domain))

                  for _, domain := range site.Domain {
                      if domain == nil {
                          continue
                      }

                      hydraAttributeCount += len(domain.Attribute)
                      value := normalizeName(domain.Value)
                      if value == "" {
                          continue
                      }
                      if hasAttributeMarker(value) {
                          fatalf("attribute marker embedded in Hydra source domain value: %s", domain.Value)
                      }

                      switch domain.Type {
                      case router.Domain_RootDomain:
                      case router.Domain_Full:
                          appendedConvertedFullToRootCount++
                      default:
                          appendedUnsupportedTypeCount++
                          continue
                      }

                      if !isValidDomain(value) {
                          fatalf("invalid domain in Hydra category %s: %s", category, domain.Value)
                      }

                      if !addRoot(dst, seen, value) {
                          appendedDuplicateCount++
                          continue
                      }
                      appendedRuleCount++
                  }

                  var prunedHydra int
                  dst.Domain, prunedHydra = pruneCoveredDomains(dst.Domain)
                  appendedCoveredDomainCount += prunedHydra
                  sortDomains(dst.Domain)

                  if len(dst.Domain) == 0 {
                      fatalf("Hydra category is empty: %s", category)
                  }
                  result.Entry = append(result.Entry, dst)
              }

              outputData, err := proto.MarshalOptions{Deterministic: true}.Marshal(result)
              if err != nil {
                  fatalf("failed to marshal final output DAT: %v", err)
              }
              if err := os.WriteFile(outputPath, outputData, 0o644); err != nil {
                  fatalf("failed to write output DAT: %v", err)
              }

              fmt.Println()
              fmt.Println("========================================")
              fmt.Println("RU LIGHT GEOSITE BUILD v9")
              fmt.Println("========================================")
              fmt.Printf("Source category matches       : %d\n", sourceCategoryCount)
              fmt.Printf("Source domain rules           : %d\n", sourceDomainCount)
              fmt.Printf("Written domain rules          : %d (before pruning)\n", writtenDomainCount)
              fmt.Printf("Removed configured RU TLD     : %d\n", removedRussianDomainCount)
              fmt.Printf("Removed bare single-label     : %d\n", removedBareDomainCount)
              fmt.Printf("Removed invalid domains      : %d\n", removedInvalidDomainCount)
              fmt.Printf("Removed regex/keyword        : %d\n", removedUnsupportedTypeCount)
              fmt.Printf("Removed duplicates             : %d\n", duplicateDomainCount)
              fmt.Printf("Full -> RootDomain (RU)       : %d\n", convertedFullToRootCount)
              fmt.Printf("Covered RU domains removed    : %d\n", removedCoveredDomainCount)
              fmt.Printf("Davoyan legacy domains        : %d\n", legacyDomainCount)
              fmt.Printf("Davoyan legacy written        : %d\n", legacyStats.written)
              fmt.Printf("Local RU written              : %d\n", localStats.written)
              fmt.Printf("Local BLOCK domains           : %d\n", localBlockDomainCount)
              fmt.Printf("Local BLOCK duplicates        : %d\n", localBlockDuplicateCount)
              fmt.Printf("Covered BLOCK domains removed : %d\n", removedCoveredBlockDomainCount)
              fmt.Printf("Compact RU roots added        : %d/%d\n", compactRootsAdded, len(compactRussianRoots))
              fmt.Printf("Appended Hydra rules          : %d\n", appendedRuleCount)
              fmt.Printf("Hydra duplicates removed     : %d\n", appendedDuplicateCount)
              fmt.Printf("Full -> RootDomain (Hydra)    : %d\n", appendedConvertedFullToRootCount)
              fmt.Printf("Removed unsupported Hydra     : %d\n", appendedUnsupportedTypeCount)
              fmt.Printf("Covered Hydra domains removed : %d\n", appendedCoveredDomainCount)
              fmt.Printf("Source attributes encountered : %d\n", sourceAttributeCount)
              fmt.Printf("Hydra attributes encountered  : %d\n", hydraAttributeCount)
              fmt.Printf("Positive source lines         : %d\n", totalPositiveInput)
              fmt.Printf("Positive NEW vs base RU      : %d\n", totalPositiveNew)
              fmt.Printf("Positive added to final      : %d\n", totalPositiveAdded)
              fmt.Printf("Positive skipped RU TLD       : %d\n", totalPositiveTLD)
              fmt.Printf("Positive skipped bare         : %d\n", totalPositiveBare)
              fmt.Printf("Positive skipped invalid      : %d\n", totalPositiveInvalid)
              fmt.Printf("Positive delta report         : %s\n", reportPath)
              fmt.Printf("FINAL RU rules               : %d\n", len(ruCategory.Domain))
              fmt.Printf("FINAL BLOCK rules            : %d\n", len(blockCategory.Domain))
              fmt.Printf("Final categories              : %d\n", len(result.Entry))
              fmt.Printf("Final DAT size                : %d bytes\n", len(outputData))
              fmt.Printf("Output categories             : RU + BLOCK + %d Hydra categories (clean attributes)\n", len(hydraAppendCategories))
              fmt.Println()
              fmt.Println("Configured compact RU-family roots:")
              for _, root := range compactRussianRoots {
