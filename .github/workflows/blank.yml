name: Build Ultimate Light Geosite

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Clone domain-list-community
        run: git clone https://github.com/v2fly/domain-list-community.git

      - name: Prepare custom clean lists
        run: |
          cd domain-list-community
          
          # 1. ЖЕСТКАЯ ОЧИСТКА: Удаляем все мировые категории, кроме нужных для сборки "ru"
          # Сохраняем "ru" и файлы, на которые он может ссылаться (если они есть)
          cp data/ru data/by data/ua /tmp/ 2>/dev/null || true
          rm -rf data/*
          cp /tmp/ru /tmp/by /tmp/ua data/ 2>/dev/null || true
          
          # 2. Если файлов в оригинальном репозитории нет (собраны иначе), скачиваем вручную
          if [ ! -f data/ru ]; then
              echo "Downloading ru list directly..."
              curl -sL https://raw.githubusercontent.com/v2fly/domain-list-community/master/data/ru > ru_raw.txt
          else
              cat data/ru > ru_raw.txt
          fi

          # 3. Очистка: берем только первый столбец (домены), отрезаем комментарии (#)
          awk '{print $1}' ru_raw.txt | grep -v '^#' | grep -v '^$' > ru_clean.txt
          
          # 4. Вырезаем все домены, оканчивающиеся на .ru, .su, .by, .ua, .xn--p1ai
          grep -viE '\.(ru|su|by|ua|xn--p1ai)$' ru_clean.txt > ru_filtered.txt
          
          # 5. Создаем супер-категорию ru-direct. Сначала пишем корневые зоны:
          echo -e "ru\nsu\nxn--p1ai\nby\nua" > data/ru-direct
          
          # 6. Добавляем отфильтрованные .com/.net домены РФ, убирая текстовые дубли
          sort -u ru_filtered.txt >> data/ru-direct
          
          # 7. Скачиваем список заблокированных сайтов напрямую из источников
          echo "Downloading blocked lists..."
          # Источник 1: community.antifilter.download (только домены)
          curl -sLf https://community.antifilter.download/list/domains.lst > blocked_1.txt || echo "" > blocked_1.txt
          # Источник 2: re:filter (только домены)
          curl -sLf https://raw.githubusercontent.com/1andrevich/Re-filter-lists/iq-routing/domains_all.lst > blocked_2.txt || echo "" > blocked_2.txt
          
          # Объединяем, сортируем, убираем дубликаты и пустые строки
          cat blocked_1.txt blocked_2.txt | grep -v '^$' | sort -u > data/ru-blocked
          
          # Очищаем временные файлы
          rm -f ru_raw.txt ru_clean.txt ru_filtered.txt blocked_1.txt blocked_2.txt /tmp/ru /tmp/by /tmp/ua
          
          # Проверяем, что файлы не пустые и не содержат HTML ошибок
          head -n 5 data/ru-direct
          head -n 5 data/ru-blocked

      - name: Compile optimized geosite.dat
        run: |
          cd domain-list-community
          # Компилируем
          go run main.go -datapath=./data -exportlists=ru-direct,ru-blocked
          mv dlc.dat ../geosite_optimized.dat

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-optimized
          name: "Optimized Geosite (RU Direct + Blocked)"
          files: geosite_optimized.dat
          body: "Содержит ru-direct (СНГ TLD + домены РФ без мусора) и ru-blocked (Antifilter + Re:filter)."
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
