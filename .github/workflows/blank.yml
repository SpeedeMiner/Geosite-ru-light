name: Build Ultimate Light Geosite

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Clone domain-list-community
        run: git clone https://github.com/v2fly/domain-list-community.git

      - name: Extract, Filter and Build
        run: |
          cd domain-list-community
          
          echo "==== DOWNLOADING OFFICIAL RELEASE ===="
          # Качаем официальный свежий geosite.dat (он весит около 10МБ)
          curl -sLf https://github.com/v2fly/domain-list-community/releases/latest/download/dlc.dat > official.dat
          
          echo "==== UNPACKING RU CATEGORY ===="
          # Распаковываем категорию "ru" обратно в текст с помощью штатного парсера.
          # Вывод перенаправляем в файл ru_raw.txt.
          go run main.go -datapath=official.dat -exportlists=ru > ru_raw.txt
          
          # Так как unpack может создать папку dlc-export или выдать список в stdout, 
          # мы проверяем оба варианта (в зависимости от версии компилятора).
          if [ -f "dlc-export/ru.txt" ]; then
            cat dlc-export/ru.txt > ru_raw.txt
          fi
          
          echo "==== FILTERING DOMAINS ===="
          set +e
          # Чистим: оставляем только домены, удаляем \r
          sed -i 's/\r//g' ru_raw.txt
          # Удаляем префиксы вроде "full:" или "domain:", оставляем чистый домен
          awk -F':' '{if (NF==2) print $2; else print $1}' ru_raw.txt | awk '{print $1}' | awk 'NF' > ru_clean.txt
          
          # Вырезаем все домены с окончаниями .ru, .su, .by, .ua, .xn--p1ai
          grep -viE '\.(ru|su|by|ua|xn--p1ai)$' ru_clean.txt > ru_filtered.txt
          set -e
          
          echo "==== PREPARING DATA DIR ===="
          # Очищаем папку data для нашей чистой сборки
          rm -rf data/*
          
          # Собираем финальный файл data/ru
          echo -e "ru\nsu\nxn--p1ai\nby\nua" > data/ru
          sort -u ru_filtered.txt >> data/ru
          
          echo "==== BUILDING RU BLOCKED ===="
          set +e
          # Скачиваем списки блокировок
          curl -sLf https://community.antifilter.download/list/domains.lst > blocked_1.txt
          curl -sLf https://raw.githubusercontent.com/1andrevich/Re-filter-lists/iq-routing/domains_all.lst > blocked_2.txt
          
          sed -i 's/\r//g' blocked_1.txt blocked_2.txt
          cat blocked_1.txt blocked_2.txt | awk '{print $1}' | awk 'NF' | sort -u > data/ru-blocked
          set -e
          
          echo "=== Check RU-DIRECT ==="
          head -n 20 data/ru

      - name: Compile optimized geosite.dat
        run: |
          cd domain-list-community
          # Компилируем наши два чистых файла
          go run main.go -datapath=./data -exportlists=ru,ru-blocked
          mv dlc.dat ../geosite_optimized.dat

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-optimized
          name: "Optimized Geosite (RU + Blocked)"
          files: geosite_optimized.dat
          body: "Содержит категорию 'ru' (СНГ TLD + все домены РФ без мусора) и 'ru-blocked' (Antifilter + Re:filter)."
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
