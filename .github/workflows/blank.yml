name: Build Ultimate Light Geosite

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Clone domain-list-community
        run: git clone https://github.com/v2fly/domain-list-community.git

      - name: Build Custom Data Directory
        run: |
          cd domain-list-community
          
          # Очищаем папку от чужих файлов, чтобы не было конфликтов
          rm -rf data/*
          
          echo "==== FETCHING RESOLVED RU LIST ===="
          # Берем уже раскрытый список РФ (со всеми .com/.net) из стабильного runetfreedom
          curl -sLf https://raw.githubusercontent.com/runetfreedom/russia-blocked-geosite/release/text/ru.txt > ru_raw.txt
          
          echo "==== FILTERING DOMAINS ===="
          # Очищаем от мусора, пустых строк, \r и отрезаем префиксы (domain: и full:)
          sed -i 's/\r//g' ru_raw.txt
          awk -F':' '{if (NF==2) print $2; else print $1}' ru_raw.txt | grep -v '^#' | awk 'NF' > ru_clean.txt
          
          # Вырезаем всё, что заканчивается на зоны СНГ (отключаем остановку при ошибках через set +e)
          set +e
          grep -viE '\.(ru|su|by|ua|xn--p1ai)$' ru_clean.txt > ru_filtered.txt
          set -e
          
          echo "==== BUILDING FINAL RU DIRECT ===="
          # Записываем корневые зоны
          echo -e "ru\nsu\nxn--p1ai\nby\nua" > data/ru
          # Добавляем все наши отфильтрованные российские .com, .net и т.д.
          sort -u ru_filtered.txt >> data/ru
          
          echo "==== FETCHING BLOCKED LISTS ===="
          set +e
          # Качаем заблокированные домены напрямую из первоисточников
          curl -sLf https://community.antifilter.download/list/domains.lst > blocked_1.txt
          curl -sLf https://raw.githubusercontent.com/1andrevich/Re-filter-lists/iq-routing/domains_all.lst > blocked_2.txt
          set -e
          
          sed -i 's/\r//g' blocked_1.txt blocked_2.txt
          cat blocked_1.txt blocked_2.txt | awk '{print $1}' | awk 'NF' | sort -u > data/ru-blocked
          
          # Проверка в логах
          echo "=== HEAD data/ru ==="
          head -n 15 data/ru

      - name: Compile optimized geosite.dat
        run: |
          cd domain-list-community
          # Собираем наши два чистейших файла
          go run main.go -datapath=./data -exportlists=ru,ru-blocked
          mv dlc.dat ../geosite_optimized.dat

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-optimized
          name: "Optimized Geosite (RU + Blocked)"
          files: geosite_optimized.dat
          body: "Содержит 'ru' (СНГ TLD + домены РФ .com/.net) и 'ru-blocked' (Antifilter + Re:filter)."
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
