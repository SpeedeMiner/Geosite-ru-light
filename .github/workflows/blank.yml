name: Build Ultimate Light RU Geosite (Optimized v11.18)

concurrency:
  group: build-ultimate-light-ru-geosite
  # Never cancel a run that may be halfway through publishing; queue instead.
  cancel-in-progress: false

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "local/**"
      # Audit policy and comparator changes must also trigger PR checks.
      - "data/**"
      - "tools/**"
      - "docs/**"
      - "go.mod"
      - "go.sum"
  schedule:
    # Каждый понедельник в 00:00 UTC
    - cron: "0 0 * * 1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "local/**"
      - "data/**"
      - "tools/**"
      - "go.mod"
      - "go.sum"

# A numbered release selects an approved DAT and a reviewed recovery baseline.
# Change these together in the PR preparing the next numbered release.
env:
  NUMBERED_RELEASE: v11.18
  NUMBERED_DAT_SHA: 9c1ff7caef0345b944bdf6afc37fc3609394fae42408ca1b42a663445399c6c3
  NUMBERED_RECOVERY_BASELINE: v11.17
  NUMBERED_RELEASE_NOTES: docs/v11-18-reviewed-regional-ru.md

jobs:
  build:
    # PR builds run all tests but never publish production artifacts.
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      review_pending: ${{ steps.semantic_gate.outputs.review_pending }}
      publish_allowed: ${{ steps.semantic_gate.outputs.publish_allowed }}
      candidate_sha: ${{ steps.release_bundle.outputs.candidate_sha }}
      manifest_sha: ${{ steps.release_bundle.outputs.manifest_sha }}
      bundle_name: ${{ steps.release_bundle.outputs.bundle_name }}
      rolling_sha: ${{ steps.semantic_gate.outputs.rolling_sha }}
      recovery_sha: ${{ steps.numbered_recovery.outputs.receipt_sha }}

    permissions:
      contents: read

    env:
      # Актуальная полная GeoSite-база runetfreedom
      GEOSITE_URL: https://raw.githubusercontent.com/runetfreedom/russia-blocked-geosite/release/geosite.dat
      GEOSITE_SHA_URL: https://raw.githubusercontent.com/runetfreedom/russia-blocked-geosite/release/geosite.dat.sha256sum

      HYDRA_GEOSITE_URL: https://github.com/hydraponique/roscomvpn-geosite/releases/latest/download/geosite.dat
      GRIMBIRD_GEOSITE_URL: https://raw.githubusercontent.com/GrimbirdUsers/ru-routing-dat/main/geosite.dat
      MVR_GEOSITE_URL: https://raw.githubusercontent.com/mvrvntn/routing/release/geosite.dat
      YULARZHI_GEOSITE_URL: https://github.com/Yularzhi/geosite_russia/releases/latest/download/geosite.dat
      VPNYASHA_GEOSITE_URL: https://raw.githubusercontent.com/vpnyasha/geosite/main/geosite.dat
      KIRILL_GEOSITE_URL: https://github.com/kirilllavrov/RU-domain-list-for-whitelist/releases/latest/download/dlc.dat
      DIGNE_GEOSITE_URL: https://raw.githubusercontent.com/DigneZzZ/routing/main/v2ray/geosite.dat
      DAVOYAN_LEGACY_URL: https://raw.githubusercontent.com/Davoyan/mihomo-rule-sets/main/domains/category-ru-legacy.txt

      # Positive-only RU allow-pool enrichments. These are NOT refilter/block feeds.
      W1ZARDZ_RU_DIRECT_URL: https://raw.githubusercontent.com/w1zardz/amnezia-vpn-russia-split-tunneling/master/dist/ru-direct-domains.txt
      KYORESUAS_RU_STANDARD_URL: https://raw.githubusercontent.com/kyoresuas/ru-direct/release/ru-standard.domains.txt

      INPUT_FILE: source-geosite.dat
      HYDRA_INPUT_FILE: hydra-geosite.dat
      GRIMBIRD_INPUT_FILE: grimbird-geosite.dat
      MVR_INPUT_FILE: mvrvntn-geosite.dat
      YULARZHI_INPUT_FILE: yularzhi-geosite.dat
      VPNYASHA_INPUT_FILE: vpnyasha-geosite.dat
      KIRILL_INPUT_FILE: kirill-geosite.dat
      DIGNE_INPUT_FILE: digne-geosite.dat
      DAVOYAN_LEGACY_INPUT_FILE: davoyan-category-ru-legacy.txt
      W1ZARDZ_RU_DIRECT_INPUT_FILE: w1zardz-ru-direct-domains.txt
      KYORESUAS_RU_STANDARD_INPUT_FILE: kyoresuas-ru-standard-domains.txt

      # Shared by the filter and the semantic promotion gate.
      RU_APPROVED_MANIFEST: ${{ github.workspace }}/data/v11-approved-effective-ru.txt
      RU_REVIEW_DECISIONS: data/v11-external-domain-review.tsv
      RELEASE_FLOOR_TAG: v11.5
      RELEASE_FLOOR_SHA256: 9e13ae5da4122ea9567bb99c5c108503079083ed3eb5d7c97ca0f940ac9e068f
      LOCAL_RU_INPUT_FILE: local/ru.txt
      LOCAL_BLOCK_INPUT_FILE: local/block.txt

      RU_SUPPRESSED_ROOTS_REPORT: geosite_RU_suppressed_roots.tsv
      OUTPUT_FILE: geosite_RU.dat
      CATEGORY_FILE: geosite_RU_categories.txt
      HYDRA_APPEND_FILE: geosite_RU_hydra_appended_categories.txt
      OUTPUT_SHA_FILE: geosite_RU.dat.sha256sum
      NEW_SOURCES_REPORT_FILE: geosite_RU_new_sources.txt

      # Sanity floor for the final RU pool.
      MIN_RU_RULES: "800"

    steps:
      # ------------------------------------------------------------
      # 1. Repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read reviewed source revisions
        id: input_lock
        run: echo "v2fly_ref=$(python3 tools/locked_geosite_inputs.py ref)" >> "$GITHUB_OUTPUT"

      - name: Clone domain-list-community
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: v2fly/domain-list-community
          ref: ${{ github.event_name != 'schedule' && steps.input_lock.outputs.v2fly_ref || '' }}
          path: domain-list-community
          fetch-depth: 1
          persist-credentials: false

      # ------------------------------------------------------------
      # 3. Setup Go according to current domain-list-community
      # ------------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # ------------------------------------------------------------
      # 4. Fetch sources. Only successful main builds seed future caches.
      # ------------------------------------------------------------
      - name: Restore last known-good Tier-2 source snapshots
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: .geosite-source-cache
          key: geosite-tier2-v1-${{ hashFiles('tools/fetch_geosite_sources.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            geosite-tier2-v1-${{ hashFiles('tools/fetch_geosite_sources.py') }}-
      - name: Materialize reviewed GeoSite inputs
        if: github.event_name != 'schedule'
        run: |
          set -euo pipefail
          python3 tools/locked_geosite_inputs.py materialize

      - name: Discover changes in live sources
        if: github.event_name == 'schedule'
        id: source_downloads
        run: |
          set -euo pipefail
          python3 tools/fetch_geosite_sources.py
          python3 tools/locked_geosite_inputs.py discovery-report "$(git -C domain-list-community rev-parse HEAD)"

      # ------------------------------------------------------------
      # 6. Compile and unit-test the RU GeoSite tool
      # ------------------------------------------------------------
      - name: Compile and test RU GeoSite filter
        shell: bash
        run: |
          set -euo pipefail

          python3 -m unittest discover -s tools -p 'test_*.py'
          go test ./...
          go build -o /tmp/ru-geosite-filter ./tools/ru-geosite-filter
          go build -o /tmp/geosite-delta ./tools/geosite-delta
          echo "Filter compiled and policy-tested successfully."

      - name: Build and validate lightweight DAT
        run: bash tools/build_geosite_dat.sh /tmp/ru-geosite-filter

      # ------------------------------------------------------------
      # 9. Calculate checksum
      # ------------------------------------------------------------
      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "$OUTPUT_FILE" > "$OUTPUT_SHA_FILE"
          cat "$OUTPUT_SHA_FILE"

      - name: Upload validated input for corporate audit
        if: github.event_name == 'pull_request' || github.event_name == 'schedule'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: geosite-corporate-audit-input
          retention-days: 2
          if-no-files-found: error
          path: |
            geosite_RU.dat
            geosite_RU.dat.sha256sum

      # ------------------------------------------------------------
      # 9b. Reproducible semantic delta against the currently published DAT.
      # ------------------------------------------------------------
      - name: Audit semantic DAT delta against release
        id: semantic_gate
        # Fail closed before production publication, not just in PR builds.
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 --max-time 90 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-optimized/geosite_RU.dat" \
            -o /tmp/geosite-ru-released.dat
          test -s /tmp/geosite-ru-released.dat
          # Verify the published reference asset against its own checksum.
          # A stale/mismatched release reference must not authorize publishing.
          curl -fL --retry 3 --connect-timeout 15 --max-time 90 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest-optimized/geosite_RU.dat.sha256sum" \
            -o /tmp/geosite-ru-released.dat.sha256sum
          RELEASE_SHA="$(awk 'NR==1{print $1}' /tmp/geosite-ru-released.dat.sha256sum)"
          test -n "$RELEASE_SHA"
          ACTUAL_SHA="$(sha256sum /tmp/geosite-ru-released.dat | awk '{print $1}')"
          test "$RELEASE_SHA" = "$ACTUAL_SHA" || { echo "ERROR: published DAT checksum differs from published SHA256" >&2; exit 1; }
          [[ "$ACTUAL_SHA" =~ ^[0-9a-f]{64}$ ]]
          echo "rolling_sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"

          # Independently lock the audited v11.5 bytes. The rolling reference
          # still detects losses from any later, reviewed additions.
          curl -fL --retry 3 --connect-timeout 15 --max-time 90 \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/$RELEASE_FLOOR_TAG/geosite_RU.dat" \
            -o /tmp/geosite-ru-release-floor.dat
          printf '%s  %s\n' "$RELEASE_FLOOR_SHA256" /tmp/geosite-ru-release-floor.dat | sha256sum --check --strict
          RESULT=0
          /tmp/geosite-delta release-check \
            /tmp/geosite-ru-released.dat /tmp/geosite-ru-release-floor.dat \
            "$OUTPUT_FILE" geosite_RU_semantic_delta.md "$RU_APPROVED_MANIFEST" "$RU_REVIEW_DECISIONS" || RESULT=$?
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -s geosite_RU_semantic_delta.md ]; then
            cp geosite_RU_semantic_delta.md geosite_RU_production_preflight.md
          fi
          if [ "$RESULT" = 3 ] && [ "$GITHUB_EVENT_NAME" = schedule ]; then
            test -s geosite_RU_semantic_delta.md
            echo "review_pending=true" >> "$GITHUB_OUTPUT"
            echo "### New RU rules need manual approval. Publication skipped." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RESULT" != 0 ]; then
            exit "$RESULT"
          else
            test -s geosite_RU_semantic_delta.md
            if [ "$GITHUB_EVENT_NAME" = schedule ]; then
              echo "### Live discovery is report-only. Publish via reviewed locked inputs." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "publish_allowed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build and round-trip verify sing-box rule-sets
        if: github.event_name != 'schedule' && steps.semantic_gate.outputs.publish_allowed == 'true'
        run: bash tools/build_geosite_srs.sh --dat "$OUTPUT_FILE"

      - name: Verify numbered release recovery
        id: numbered_recovery
        if: github.event_name != 'schedule' && steps.semantic_gate.outputs.publish_allowed == 'true'
        run: |
          set -euo pipefail
          receipt=geosite_numbered_recovery.json
          python3 tools/verify_numbered_geosite_recovery.py check \
            "$NUMBERED_RELEASE" "$NUMBERED_DAT_SHA" "$NUMBERED_RECOVERY_BASELINE" "$receipt"
          if [ -f "$receipt" ]; then
            echo "receipt_sha=$(sha256sum "$receipt" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            printf '### Numbered release recovery verified\n- Offline replay reproduced all five %s assets.\n- All five %s rollback assets verified without rebuilding.\n' \
              "$NUMBERED_RELEASE" "$NUMBERED_RECOVERY_BASELINE" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Audit optional external candidate inventory
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 2 --connect-timeout 15 --max-time 35 \
            "https://raw.githubusercontent.com/w1zardz/amnezia-vpn-russia-split-tunneling/master/data/external-candidates.json" \
            -o /tmp/geosite-ru-external-candidates.json
          test -s /tmp/geosite-ru-external-candidates.json
          /tmp/geosite-delta \
            /tmp/geosite-ru-released.dat "$OUTPUT_FILE" geosite_RU_inventory_delta.md \
            /tmp/geosite-ru-external-candidates.json geosite_RU_external_candidate_audit.md \
            data/v11-external-domain-review.tsv "$RU_APPROVED_MANIFEST"
          python3 tools/build_domain_research_queue.py geosite_RU_external_candidate_audit.md geosite_RU_attribution_research_queue.tsv

      # Unreviewed upstream additions must not silently land in a production
      # release. Preserve the candidate and the diff even if main/schedule gate
      # fails so maintainers can inspect and approve the incremental change.
      - name: Preserve blocked auto-update candidate for review
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (failure() || steps.semantic_gate.outputs.review_pending == 'true') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: geosite-ru-main-blocked-update-review
          retention-days: 14
          if-no-files-found: warn
          path: |
            geosite_RU.dat
            geosite_RU.dat.sha256sum
            geosite_RU_semantic_delta.md
            geosite_RU_categories.txt
            geosite_RU_new_sources.txt
            geosite_RU_source_fetch.tsv
            geosite_RU_inputs.json
            geosite_RU_suppressed_roots.tsv
            data/v11-approved-effective-ru.txt

      - name: Upload PR candidate DAT and audit report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: geosite-ru-v11-pr-audit
          retention-days: 14
          if-no-files-found: error
          path: |
            geosite_RU.dat
            geosite_RU.dat.sha256sum
            geosite_RU_semantic_delta.md
            geosite_RU_production_preflight.md
            geosite_*.srs
            geosite_srs.sha256sum
            geosite_numbered_recovery.json
            geosite_RU_external_candidate_audit.md
            geosite_RU_attribution_research_queue.tsv
            data/v11-external-domain-review.tsv
            data/v11-approved-effective-ru.txt
            geosite_RU_categories.txt
            geosite_RU_new_sources.txt
            geosite_RU_source_fetch.tsv
            geosite_RU_inputs.json
            geosite_RU_suppressed_roots.tsv
            v2fly-corporate-extra-domains.txt

      - name: Preserve live source observations
        if: github.event_name == 'schedule' && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: geosite-live-source-observations
          retention-days: 14
          if-no-files-found: warn
          path: |
            geosite_RU_inputs.json
            geosite_RU_source_fetch.tsv

      - name: Cache validated fresh Tier-2 discovery snapshots
        if: success() && github.ref == 'refs/heads/main' && github.event_name == 'schedule' && steps.source_downloads.outputs.all_tier2_fresh == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: .geosite-source-cache
          key: geosite-tier2-v1-${{ hashFiles('tools/fetch_geosite_sources.py') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Seal approved release bundle
        id: release_bundle
        if: github.ref == 'refs/heads/main' && github.event_name != 'schedule' && github.event_name != 'pull_request' && steps.semantic_gate.outputs.publish_allowed == 'true'
        run: |
          set -euo pipefail
          files=("$OUTPUT_FILE" "$OUTPUT_SHA_FILE" "$CATEGORY_FILE" "$HYDRA_APPEND_FILE" "$NEW_SOURCES_REPORT_FILE")
          srs_files="$(python3 tools/build_geosite_srs.py verify-assets --dat "$OUTPUT_FILE")"
          mapfile -t srs_assets <<< "$srs_files"
          files+=("${srs_assets[@]}")
          for file in "${files[@]}"; do test -s "$file"; done
          sha256sum --check --strict "$OUTPUT_SHA_FILE"
          sha256sum -- "${files[@]}" > release-bundle.sha256sum
          echo "bundle_name=geosite-approved-release-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$(sha256sum "$OUTPUT_FILE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "manifest_sha=$(sha256sum release-bundle.sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload approved release bundle
        if: steps.release_bundle.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.release_bundle.outputs.bundle_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            geosite_RU.dat
            geosite_RU.dat.sha256sum
            geosite_RU_categories.txt
            geosite_RU_hydra_appended_categories.txt
            geosite_RU_new_sources.txt
            geosite_*.srs
            geosite_srs.sha256sum
            release-bundle.sha256sum
            geosite_RU_inputs.json
            geosite_numbered_recovery.json

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule' && github.event_name != 'pull_request' && needs.build.outputs.publish_allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download this run's approved release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.bundle_name }}
          path: dist
      - name: Verify and publish approved release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
          GIT_TERMINAL_PROMPT: "0"
          CANDIDATE_SHA: ${{ needs.build.outputs.candidate_sha }}
          BUNDLE_SHA: ${{ needs.build.outputs.manifest_sha }}
          ROLLING_SHA: ${{ needs.build.outputs.rolling_sha }}
          RECOVERY_SHA: ${{ needs.build.outputs.recovery_sha }}
        run: bash tools/publish_geosite_release.sh dist

  weekly-review:
    # Only trusted scheduled builds can invoke this write-capable job.
    needs: build
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && needs.build.outputs.review_pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout review tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Download blocked candidate evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: geosite-ru-main-blocked-update-review
          path: ${{ runner.temp }}/geosite-weekly-review
      - name: Open or update the weekly Draft PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
          GIT_TERMINAL_PROMPT: "0"
        run: python3 tools/publish_weekly_review.py "$RUNNER_TEMP/geosite-weekly-review/geosite_RU_semantic_delta.md"

  corporate-audit:
    # This job consumes an artifact. No build or publishing step depends on it.
    needs: build
    if: ${{ !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout audit tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: false
      - name: Download validated DAT
        id: audit_input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: geosite-corporate-audit-input
          path: .corporate-audit-input
      - name: Generate review-only corporate report
        id: audit_report
        if: steps.audit_input.outcome == 'success'
        continue-on-error: true
        run: bash tools/run_corporate_audit.sh
      - name: Summarize audit status
        if: ${{ !cancelled() }}
        env:
          AUDIT_OUTCOME: ${{ steps.audit_report.outcome }}
        run: |
          if [ "$AUDIT_OUTCOME" = success ]; then
            echo "### Corporate discovery (review only)" >> "$GITHUB_STEP_SUMMARY"
            grep -E '^Observed:|^\*\*Collection incomplete' geosite_RU_discovered_candidates.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Corporate discovery unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo "No successful review report was generated. See this job's logs." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload corporate audit evidence
        if: ${{ !cancelled() && steps.audit_input.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        continue-on-error: true
        with:
          name: geosite-ru-corporate-domain-discovery
          retention-days: 14
          if-no-files-found: warn
          path: |
            geosite_RU_discovered_candidates.md
            geosite_RU_discovery_raw.tsv
            geosite_RU_discovery_review_queue.tsv
            geosite_RU_discovery_status.json
            data/corporate_discovery_seeds.tsv
