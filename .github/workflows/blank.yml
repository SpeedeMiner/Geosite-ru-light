          EOF

          cat > "$TOOL_DIR/validate.go" <<'EOF'
          package main

          import (
              "fmt"
              "strings"

              router "github.com/v2fly/v2ray-core/v5/app/router/routercommon"
          )

          func validateRules(name string, domains []*router.Domain, allowFull bool) {
              roots := make(map[string]bool, len(domains))
              for _, domain := range domains {
                  if domain != nil && domain.Type == router.Domain_RootDomain {
                      if value := normalizeName(domain.Value); value != "" {
                          roots[value] = true
                      }
                  }
              }

              seen := make(map[string]bool, len(domains))
              for _, domain := range domains {
                  if domain == nil {
                      fatalf("%s contains nil domain", name)
                  }
                  if len(domain.Attribute) > 0 {
                      fatalf("leaked attributes in %s domain: %s (count: %d)", name, domain.Value, len(domain.Attribute))
                  }

                  switch domain.Type {
                  case router.Domain_RootDomain:
                  case router.Domain_Full:
                      if !allowFull {
                          fatalf("Full rule remained in %s: %s", name, domain.Value)
                      }
                  default:
                      fatalf("%s contains unsupported rule type %v: %s", name, domain.Type, domain.Value)
                  }

                  value := normalizeName(domain.Value)
                  if value == "" {
                      fatalf("%s contains empty domain value", name)
                  }
                  if hasAttributeMarker(value) {
                      fatalf("attribute marker leaked into %s value: %s", name, domain.Value)
                  }
                  if !isValidDomain(value) {
                      fatalf("invalid domain syntax in %s: %s", name, domain.Value)
                  }

                  key := domainKey(domain)
                  if seen[key] {
                      fatalf("duplicate domain in %s: %s", name, domain.Value)
                  }
                  seen[key] = true

                  covered := false
                  if domain.Type == router.Domain_RootDomain {
                      covered = hasRootAncestor(value, roots)
                  } else {
                      covered = isCoveredByRoots(value, roots)
                  }
                  if covered {
                      fatalf("redundant rule in %s: %s is covered by a RootDomain", name, value)
                  }
              }
          }

          func runValidate(args []string) {
              if len(args) != 2 {
                  usage()
              }

              list, err := loadGeoSite(args[0])
              if err != nil {
                  fatalf("%v", err)
              }

              expectedHydra, err := loadOrderedCategories(args[1])
              if err != nil {
                  fatalf("failed to read Hydra append manifest: %v", err)
              }

              wantEntries := 2 + len(expectedHydra)
              if len(list.Entry) != wantEntries {
                  fatalf("expected exactly %d categories, got %d", wantEntries, len(list.Entry))
              }

              for _, site := range list.Entry {
                  if site == nil {
                      fatalf("output contains nil category")
                  }
                  category := normalizeName(site.CountryCode)
                  if strings.Contains(category, "@") {
                      fatalf("attribute marker leaked into category name: %s", site.CountryCode)
                  }
                  for _, marker := range []string{"blocked", "geoblock", "re-filter", "refilter"} {
                      if strings.Contains(category, marker) {
                          fatalf("negative category leaked into output: %s", site.CountryCode)
                      }
                  }
              }

              // ---- RU ----------------------------------------------------------------
              ru := list.Entry[0]
              if normalizeName(ru.CountryCode) != "ru" {
                  fatalf("first category must be RU")
              }
              if floor := minRURules(); len(ru.Domain) < floor {
                  fatalf("RU has only %d rules (minimum %d)", len(ru.Domain), floor)
              }

              validateRules("RU", ru.Domain, false)

              compact := make(map[string]bool, len(compactRussianRoots))
              for _, root := range compactRussianRoots {
                  compact[root] = false
              }

              for _, domain := range ru.Domain {
                  value := normalizeName(domain.Value)
                  if isRussianTLD(value) {
                      if _, ok := compact[value]; !ok {
                          fatalf("uncompacted Russian-family TLD leaked into RU: %s", domain.Value)
                      }
                      if domain.Type != router.Domain_RootDomain {
                          fatalf("compact Russian-family TLD is not RootDomain: %s", domain.Value)
                      }
                      compact[value] = true
                  }
                  if !strings.Contains(value, ".") && !isCompactRussianRoot(value) {
                      fatalf("bare non-TLD rule leaked into RU: %s", domain.Value)
                  }
              }

              for root, ok := range compact {
                  if !ok {
                      fatalf("RU missing compact TLD root: %s", root)
                  }
              }

              // ---- BLOCK -------------------------------------------------------------
              block := list.Entry[1]
              if normalizeName(block.CountryCode) != "block" {
                  fatalf("second category must be BLOCK")
              }
              validateRules("BLOCK", block.Domain, true)

              // ---- Hydra -------------------------------------------------------------
              for i, expected := range expectedHydra {
                  site := list.Entry[i+2]
                  if category := normalizeName(site.CountryCode); category != expected {
                      fatalf("Hydra category order mismatch: expected %s, got %s", expected, site.CountryCode)
                  }
                  if len(site.Domain) == 0 {
                      fatalf("Hydra category is empty: %s", expected)
                  }
                  validateRules(expected, site.Domain, false)
              }

              fmt.Println()
              fmt.Println("========================================")
              fmt.Println("VALIDATION OK")
              fmt.Println("========================================")
              fmt.Printf("Categories: %d (RU + BLOCK + %d Hydra)\n", len(list.Entry), len(expectedHydra))
              fmt.Printf("RU rules:   %d\n", len(ru.Domain))
              fmt.Printf("BLOCK rules: %d\n", len(block.Domain))
              fmt.Printf("Compact RU-family roots: %d\n", len(compactRussianRoots))
              fmt.Println("Attributes (@ads/@cn/etc.): 0 in output")
              fmt.Println("RU policy: Russian-family TLDs are represented only by compact RootDomain roots")
          }
          EOF

          cat > "$TOOL_DIR/policy_test.go" <<'EOF'
          package main

          import (
              "testing"

              router "github.com/v2fly/v2ray-core/v5/app/router/routercommon"
          )

          func TestRussianFamilyTLDsCollapseIncludingUnicode(t *testing.T) {
              cases := []string{
                  "service.ru",
                  "service.su",
                  "service.xn--p1ai",
                  "service.рф",
                  "service.moscow",
                  "service.москва",
                  "service.tatar",
                  "service.xn--p1acf",
                  "service.рус",
                  "service.xn--d1acj3b",
                  "service.дети",
                  "service.xn--c1avg",
                  "service.орг",
                  "service.xn--j1aef",
                  "service.ком",
                  "service.xn--80aswg",
                  "service.сайт",
                  "service.xn--80asehdb",
                  "service.онлайн",
              }

              for _, domain := range cases {
                  if !isRussianTLD(domain) {
                      t.Fatalf("expected Russian-family TLD: %q", domain)
                  }
              }
          }

          func TestGlobalTLDsAreNotCollapsed(t *testing.T) {
              cases := []string{
                  "service.org",
                  "service.com",
                  "service.net",
                  "service.io",
                  "service.de",
              }

              for _, domain := range cases {
                  if isRussianTLD(domain) {
                      t.Fatalf("global TLD must not be treated as Russian-family TLD: %q", domain)
                  }
              }
          }

          func TestDomainRuleKeepsClashDOMAINExactForBlock(t *testing.T) {
              typ, value, reason := parseRuleLine("DOMAIN,example.org,no-resolve")
              if reason != skipNone {
                  t.Fatalf("unexpected parse reason: %v", reason)
              }
              if typ != router.Domain_Full {
                  t.Fatalf("DOMAIN must be parsed as Full, got %v", typ)
              }
              if value != "example.org" {
                  t.Fatalf("unexpected value: %q", value)
              }
          }

          func TestPositiveTextDoesNotAdmitBareOrRussianTLD(t *testing.T) {
              category := &router.GeoSite{CountryCode: "RU"}
              seen := make(map[string]bool)

              stats := appendDomainStrings(category, []string{
                  "com",
                  "service.ru",
                  "service.рф",
                  "service.org",
              }, seen, "test")

              if stats.removedBare != 1 {
                  t.Fatalf("expected one bare rule removed, got %d", stats.removedBare)
              }
              if stats.removedRussian != 2 {
                  t.Fatalf("expected two Russian-family rules removed, got %d", stats.removedRussian)
              }
              if stats.written != 1 {
                  t.Fatalf("expected one non-Russian domain written, got %d", stats.written)
              }
              if len(category.Domain) != 1 || category.Domain[0].Value != "service.org" {
                  t.Fatalf("unexpected output domains: %#v", category.Domain)
              }
          }

          func TestCompactRootsAreCanonicalACE(t *testing.T) {
              for _, root := range compactRussianRoots {
                  if !isValidDomain(root) {
                      t.Fatalf("configured compact root is not valid: %q", root)
                  }
                  if !isCompactRussianRoot(root) {
                      t.Fatalf("root not recognized as compact root: %q", root)
                  }
              }
          }
          EOF

          cd domain-list-community
          echo "=== gofmt ==="
          gofmt -w tools/ru-geosite-filter/*.go
          echo "=== go test ==="
          go test ./tools/ru-geosite-filter
          echo "=== go build ==="
          go build -o /tmp/ru-geosite-filter ./tools/ru-geosite-filter
          echo "Filter compiled and policy-tested successfully."

      # ------------------------------------------------------------
      # 7. Generate final lightweight geosite_RU.dat
      # ------------------------------------------------------------
      - name: Build lightweight geosite_RU.dat
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$OUTPUT_FILE" "$OUTPUT_SHA_FILE" "$NEW_SOURCES_REPORT_FILE"

          /tmp/ru-geosite-filter build \
            "$INPUT_FILE" \
            "$HYDRA_INPUT_FILE" \
            "$GRIMBIRD_INPUT_FILE" \
            "$MVR_INPUT_FILE" \
            "$YULARZHI_INPUT_FILE" \
            "$VPNYASHA_INPUT_FILE" \
            "$KIRILL_INPUT_FILE" \
            "$DIGNE_INPUT_FILE" \
            "$DAVOYAN_LEGACY_INPUT_FILE" \
            "$CATEGORY_FILE" \
            "$HYDRA_APPEND_FILE" \
            "$LOCAL_RU_INPUT_FILE" \
            "$LOCAL_BLOCK_INPUT_FILE" \
            "$W1ZARDZ_RU_DIRECT_INPUT_FILE" \
            "$KYORESUAS_RU_STANDARD_INPUT_FILE" \
            "$NEW_SOURCES_REPORT_FILE" \
            "$OUTPUT_FILE"

          test -s "$OUTPUT_FILE"

          echo
          echo "========================================"
          echo "OUTPUT"
          echo "========================================"
