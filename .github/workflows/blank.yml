name: Build Ultimate Light Geosite

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Clone domain-list-community
        run: git clone https://github.com/v2fly/domain-list-community.git

      - name: Prepare custom clean lists
        run: |
          cd domain-list-community
          
          # 1. ЖЕСТКАЯ ОЧИСТКА: удаляем символы возврата каретки (\r) из ВСЕХ исходников
          # Это на 100% исключает ошибку "empty domain rule"
          find data/ -type f -exec sed -i 's/\r//g' {} +
          
          # 2. ГЛОБАЛЬНАЯ ФИЛЬТРАЦИЯ: вырезаем из всех файлов исходников v2fly 
          # любые домены, оканчивающиеся на .ru, .su, .by, .ua, .xn--p1ai
          # При этом директивы вроде "include:ru" останутся нетронутыми!
          find data/ -type f -exec sed -i -E '/\.(ru|su|by|ua|xn--p1ai)([[:space:]]|$)/Id' {} +
          
          # 3. Добавляем корневые TLD зоны прямо в начало файла "ru"
          sed -i '1s/^/ru\nsu\nxn--p1ai\nby\nua\n/' data/ru
          
          # 4. Скачиваем списки блокировок (напрямую из первоисточников)
          echo "Downloading blocked lists..."
          curl -sLf https://community.antifilter.download/list/domains.lst > blocked_1.txt || echo "" > blocked_1.txt
          curl -sLf https://raw.githubusercontent.com/1andrevich/Re-filter-lists/iq-routing/domains_all.lst > blocked_2.txt || echo "" > blocked_2.txt
          
          # 5. Очищаем списки блокировок от \r и пустых строк, сливаем в файл ru-blocked
          sed -i 's/\r//g' blocked_1.txt blocked_2.txt
          cat blocked_1.txt blocked_2.txt | awk '{print $1}' | awk 'NF' | sort -u > data/ru-blocked
          
          # Убираем временные файлы загрузок
          rm -f blocked_1.txt blocked_2.txt

      - name: Compile optimized geosite.dat
        run: |
          cd domain-list-community
          
          # Собираем только ДВЕ нужные нам категории. Всё лишнее компилятор проигнорирует.
          go run main.go -datapath=./data -exportlists=ru,ru-blocked
          mv dlc.dat ../geosite_optimized.dat

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-optimized
          name: "Optimized Geosite (RU + Blocked)"
          files: geosite_optimized.dat
          body: "Содержит категорию 'ru' (СНГ TLD + все домены РФ без мусора) и 'ru-blocked' (Antifilter + Re:filter)."
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
