name: Build Ultimate Light RU Geosite

on:
  workflow_dispatch:

  schedule:
    # Каждый понедельник в 00:00 UTC
    - cron: "0 0 * * 0"

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      # Актуальная полная GeoSite-база runetfreedom.
      # В их текущем build workflow используется именно этот release branch.
      GEOSITE_URL: https://raw.githubusercontent.com/runetfreedom/russia-blocked-geosite/release/geosite.dat
      GEOSITE_SHA_URL: https://raw.githubusercontent.com/runetfreedom/russia-blocked-geosite/release/geosite.dat.sha256sum

      HYDRA_GEOSITE_URL: https://github.com/hydraponique/roscomvpn-geosite/releases/latest/download/geosite.dat
      GRIMBIRD_GEOSITE_URL: https://raw.githubusercontent.com/GrimbirdUsers/ru-routing-dat/main/geosite.dat
      MVR_GEOSITE_URL: https://raw.githubusercontent.com/mvrvntn/routing/release/geosite.dat

      INPUT_FILE: source-geosite.dat
      HYDRA_INPUT_FILE: hydra-geosite.dat
      GRIMBIRD_INPUT_FILE: grimbird-geosite.dat
      MVR_INPUT_FILE: mvrvntn-geosite.dat
      OUTPUT_FILE: geosite_RU.dat
      CATEGORY_FILE: geosite_RU_categories.txt
      HYDRA_APPEND_FILE: geosite_RU_hydra_appended_categories.txt
      OUTPUT_SHA_FILE: geosite_RU.dat.sha256sum

    steps:
      # ------------------------------------------------------------
      # 1. Repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Clone current domain-list-community
      #
      # Используется только для автоматического определения
      # актуальной структуры category-ru и новых *-ru категорий.
      # ------------------------------------------------------------
      - name: Clone domain-list-community
        uses: actions/checkout@v4
        with:
          repository: v2fly/domain-list-community
          path: domain-list-community
          fetch-depth: 1

      # ------------------------------------------------------------
      # 3. Setup Go according to current domain-list-community
      # ------------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: domain-list-community/go.mod
          cache-dependency-path: domain-list-community/go.sum

      # ------------------------------------------------------------
      # 4. Download source geosite.dat
      # ------------------------------------------------------------
      - name: Download source GeoSite files
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Downloading GeoSite sources"
          echo "========================================"

          curl -fL --retry 5 --retry-all-errors \
            "$GEOSITE_URL" \
            -o "$INPUT_FILE"

          curl -fL --retry 5 --retry-all-errors \
            "$GEOSITE_SHA_URL" \
            -o source-geosite.dat.sha256sum

          curl -fL --retry 5 --retry-all-errors \
            "$HYDRA_GEOSITE_URL" \
            -o "$HYDRA_INPUT_FILE"

          curl -fL --retry 5 --retry-all-errors \
            "$GRIMBIRD_GEOSITE_URL" \
            -o "$GRIMBIRD_INPUT_FILE"

          curl -fL --retry 5 --retry-all-errors \
            "$MVR_GEOSITE_URL" \
            -o "$MVR_INPUT_FILE"

          test -s "$INPUT_FILE"
          test -s source-geosite.dat.sha256sum
          test -s "$HYDRA_INPUT_FILE"
          test -s "$GRIMBIRD_INPUT_FILE"
          test -s "$MVR_INPUT_FILE"

          echo
          echo "========================================"
          echo "Verifying SHA256 of runetfreedom source"
          echo "========================================"

          EXPECTED_SHA256="$(awk 'NF {print $1; exit}' source-geosite.dat.sha256sum)"
          ACTUAL_SHA256="$(sha256sum "$INPUT_FILE" | awk '{print $1}')"

          echo "Expected: $EXPECTED_SHA256"
          echo "Actual:   $ACTUAL_SHA256"

          if [ "$EXPECTED_SHA256" != "$ACTUAL_SHA256" ]; then
            echo "ERROR: SHA256 mismatch for runetfreedom source!"
            exit 1
          fi

          echo "SHA256 verification OK."

          echo
          echo "Downloaded sources:"
          ls -lh "$INPUT_FILE" "$HYDRA_INPUT_FILE" "$GRIMBIRD_INPUT_FILE" "$MVR_INPUT_FILE"

      # ------------------------------------------------------------
      # 5. Build complete RU category manifest
      #
      # Здесь НЕ нужно вручную поддерживать каждый новый category-ru.
      #
      # Алгоритм:
      #
      # A. Рекурсивно раскрывается category-ru.
      # B. Автоматически добавляются все файлы *-ru.
      # C. Добавляются категории из ru-available-only-inside.
      # D. Добавляются дополнительные российские сервисы.
      #
      # Благодаря этому новые category-xxx-ru из upstream будут
      # попадать в результат автоматически.
      # ------------------------------------------------------------
      - name: Build RU category manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          DATA = Path("domain-list-community/data")
          output = Path("selected_ru_categories.txt")

          selected = set()
          visited = set()
          missing_v2fly = set()

          def normalize(name: str) -> str:
              return name.strip().lower()

          def visit(name: str):
              name = normalize(name)

              if not name or name in visited:
                  return

              visited.add(name)
              path = DATA / name

              if not path.is_file():
                  missing_v2fly.add(name)
                  return

              selected.add(f"runetfreedom|{name}")

              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  return

              for raw_line in text.splitlines():
                  line = raw_line.split("#", 1)[0].strip()
                  if not line:
                      continue

                  if line.lower().startswith("include:"):
                      target = line.split(":", 1)[1].strip().split()[0]
                      if re.fullmatch(r"[A-Za-z0-9_.!+-]+", target):
                          visit(target)

          # Основное ядро runetfreedom / v2fly.
          visit("category-ru")

          # Автоматически подхватываем новые *-ru категории.
          for path in DATA.iterdir():
              if path.is_file() and path.name.lower().endswith("-ru"):
                  visit(path.name)

          # Дополнительные категории runetfreedom / v2fly.
          extra_categories = {
              "ru-available-only-inside",
              "category-geoblock-ru",
              "category-media-ru-blocked",

              "yandex", "vk", "mailru", "mailru-group", "kinopoisk",
              "dzen", "ozon", "wildberries", "wb", "avito", "autoru",
              "aviasales", "rutube", "wink", "2gis", "ok", "okko",
              "sokolov", "x5", "mosmetro", "max",

              "beget", "carrotquest", "cdek", "comssone", "drweb",
              "envybox", "gismeteo", "group-ib", "headhunter", "ideco-ru",
              "kaspersky", "kontur", "mindbox", "myoffice-ru", "netcraze",
              "nic-ru", "positive-technologies", "regru", "selectel",
              "servicepipe", "skyeng", "smena", "tilda", "timeweb",
              "ucoz", "whoosh",

              "megafon", "mts", "mts-ru", "rostelecom", "t2", "t2-ru",
              "beeline",

              "1c", "1cloud", "1tv", "aeroflot", "alfabank", "avru",
              "bronevik", "cdnvideo", "citydrive", "dellin", "dixy",
              "dnevnikru", "dns-shop", "dodopizza", "domclick", "edadeal",
              "fastvps", "fixprice", "jivo", "kuper", "lemanapro",
              "lenta", "lentaru", "magnit", "megamarket", "motivtelecom",
              "ngenix", "ntv", "pochtaru", "psbank", "rambler", "rbc",
              "rt", "ruvds", "rzd", "samokat", "smotrim", "tass",
              "taxsee", "tbank", "tnt", "tutu", "vgtrk", "vtb",
              "vkusnoitochka", "vkusvill", "zentotem",

              "3ebra", "apptrackpets", "flomni", "foto-planeta", "gazfond-pn",
              "litres", "meteoinfo", "nplus1", "ognihome", "ponyexpress",
              "qms", "randomgodbot", "srv-hub", "t1", "vimu", "yourgood",

              "corp.express", "express.ms", "public.express", "xlnk.ms",
              "mfa.center", "multifactor",

              "moex", "spvb", "banki", "finuslugi", "nspk", "mironline",
              "mirpayonline", "sistema-capital", "efin", "credistory",
              "nbki", "netmonet", "tips",
          }

          for name in sorted(extra_categories):
              visit(name)

          excluded = {
              "private",
              "category-ip-geo-detect",
              "ipip",
              "tld-ru",
          }

          selected = {
              item for item in selected
              if item.split("|", 1)[1] not in excluded
          }

          # hydraponique/roscomvpn-geosite
          hydra_categories = {
              "whitelist",
              "private",
              "category-ru",
          }
          for name in hydra_categories:
              selected.add(f"hydra|{normalize(name)}")

          # mvrvntn/routing — только CATEGORY-RU добавляется в общий RU.
          mvr_categories = {
              "category-ru",
          }
          for name in mvr_categories:
              selected.add(f"mvrvntn|{normalize(name)}")

          # GrimbirdUsers/ru-routing-dat
          grimbird_categories = {
              "category-ru-whitelist",
              "ozon",
              "ru-analytics",
              "ru-cdn",
              "ru-finance",
              "ru-medical",
              "ru-retail-extra",
              "ru-transport",
              "ru-tv",
              "ru-whitelist-extended",
              "swift",
          }
          for name in grimbird_categories:
              selected.add(f"grimbird|{normalize(name)}")

          selected = {
              item for item in selected
              if item and item.split("|", 1)[1]
              and not item.split("|", 1)[1].startswith(".")
          }

          with output.open("w", encoding="utf-8") as f:
              for item in sorted(selected):
                  f.write(item + "\n")

          # Отдельный порядок категорий Hydra, которые НЕ вливаются в RU,
          # а добавляются в конец итогового GeoSiteList отдельными категориями.
          hydra_append_categories = [
              "apple",
              "epicgames",
              "escapefromtarkov",
              "faceit",
              "github",
              "google-deepmind",
              "google-play",
              "microsoft",
              "pinterest",
              "riot",
              "steam",
              "telegram",
              "twitch",
              "twitch-ads",
              "youtube",
              "win-spy",
          ]

          append_output = Path("hydra_append_categories.txt")
          append_output.write_text(
              "\n".join(f"hydra|{name}" for name in hydra_append_categories) + "\n",
              encoding="utf-8",
          )

          print()
          print("========================================")
          print("RU CATEGORY MANIFEST")
          print("========================================")
          print(f"Manifest entries:          {len(selected)}")
          print(f"Runetfreedom/v2fly entries: {sum(x.startswith('runetfreedom|') for x in selected)}")
          print(f"Hydra entries merged into RU: {sum(x.startswith('hydra|') for x in selected)}")
          print(f"Grimbird entries:             {sum(x.startswith('grimbird|') for x in selected)}")
          print(f"mvrvntn entries merged into RU: {sum(x.startswith('mvrvntn|') for x in selected)}")
          print("Hydra categories appended separately: 16")
          print(f"Missing v2fly candidates:       {len(missing_v2fly)}")

          if missing_v2fly:
              print("\nCandidates not present in v2fly data:")
              for name in sorted(missing_v2fly):
                  print(f"  ? {name}")

          print("\nSelected source/category pairs:")
          for item in sorted(selected):
              print(f"  + {item}")

          print(f"\nManifest written to: {output}")
          PY

          cp selected_ru_categories.txt "$CATEGORY_FILE"

          echo
          echo "=== Total manifest entries ==="
          wc -l "$CATEGORY_FILE"

          echo
          echo "=== External categories merged into RU ==="
          grep -E '^(hydra|grimbird|mvrvntn)\|' "$CATEGORY_FILE"

          echo
          echo "=== Hydra categories appended separately ==="
          cat hydra_append_categories.txt

          cp hydra_append_categories.txt "$HYDRA_APPEND_FILE"

      # ------------------------------------------------------------
      # 6. Create protobuf filter.
      #
      # Используем тот же v2ray-core/v5, который используется самим
      # актуальным domain-list-community.
      # ------------------------------------------------------------
      - name: Create RU GeoSite protobuf filter
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p domain-list-community/tools/ru-geosite-filter

          cat > domain-list-community/tools/ru-geosite-filter/main.go <<'EOF'
          package main

          import (
              "bufio"
              "fmt"
              "os"
              "sort"
              "strings"

              router "github.com/v2fly/v2ray-core/v5/app/router/routercommon"
              "google.golang.org/protobuf/proto"
          )

          func normalizeName(value string) string {
              return strings.ToLower(strings.TrimSpace(value))
          }

          func isRussianTLD(value string) bool {
              value = normalizeName(value)
              value = strings.TrimSuffix(value, ".")
              value = strings.TrimPrefix(value, ".")

              switch value {
              case "ru", "su", "xn--p1ai", "рф":
                  return true
              }

              return strings.HasSuffix(value, ".ru") ||
                  strings.HasSuffix(value, ".su") ||
                  strings.HasSuffix(value, ".xn--p1ai") ||
                  strings.HasSuffix(value, ".рф")
          }

          func domainKey(domain *router.Domain) string {
              return fmt.Sprintf("%d|%s", domain.Type, normalizeName(domain.Value))
          }

          func loadGeoSite(path string) (*router.GeoSiteList, error) {
              data, err := os.ReadFile(path)
              if err != nil {
                  return nil, err
              }

              list := new(router.GeoSiteList)
              if err := proto.Unmarshal(data, list); err != nil {
                  return nil, fmt.Errorf("invalid geosite %s: %w", path, err)
              }

              return list, nil
          }

          func loadManifest(path string) (map[string]map[string]bool, error) {
              file, err := os.Open(path)
              if err != nil {
                  return nil, err
              }
              defer file.Close()

              result := make(map[string]map[string]bool)
              scanner := bufio.NewScanner(file)

              for scanner.Scan() {
                  line := strings.TrimSpace(scanner.Text())
                  if line == "" || strings.HasPrefix(line, "#") {
                      continue
                  }

                  parts := strings.SplitN(line, "|", 2)
                  if len(parts) != 2 {
                      return nil, fmt.Errorf("invalid manifest entry: %q", line)
                  }

                  source := normalizeName(parts[0])
                  category := normalizeName(parts[1])
                  if source == "" || category == "" {
                      return nil, fmt.Errorf("invalid manifest entry: %q", line)
                  }

                  if result[source] == nil {
                      result[source] = make(map[string]bool)
                  }
                  result[source][category] = true
              }

              if err := scanner.Err(); err != nil {
                  return nil, err
              }

              return result, nil
          }

          func loadOrderedCategories(path string) ([]string, error) {
              file, err := os.Open(path)
              if err != nil {
                  return nil, err
              }
              defer file.Close()

              var categories []string
              scanner := bufio.NewScanner(file)

              for scanner.Scan() {
                  line := strings.TrimSpace(scanner.Text())
                  if line == "" || strings.HasPrefix(line, "#") {
                      continue
                  }

                  parts := strings.SplitN(line, "|", 2)
                  if len(parts) != 2 || normalizeName(parts[0]) != "hydra" {
                      return nil, fmt.Errorf("invalid Hydra append manifest entry: %q", line)
                  }

                  category := normalizeName(parts[1])
                  if category == "" {
                      return nil, fmt.Errorf("empty Hydra category in manifest: %q", line)
                  }

                  categories = append(categories, category)
              }

              if err := scanner.Err(); err != nil {
                  return nil, err
              }

              if len(categories) == 0 {
                  return nil, fmt.Errorf("Hydra append manifest is empty")
              }

              return categories, nil
          }

          func cloneDomain(domain *router.Domain) *router.Domain {
              return proto.Clone(domain).(*router.Domain)
          }

          func main() {
              if len(os.Args) != 7 {
                  fmt.Fprintf(
                      os.Stderr,
                      "usage: %s runetfreedom.dat hydra.dat grimbird.dat mvrvntn.dat selected.txt hydra_append.txt output.dat\n",
                      os.Args[0],
                  )
                  os.Exit(2)
              }

              sources := map[string]string{
                  "runetfreedom": os.Args[1],
                  "hydra":         os.Args[2],
                  "grimbird":      os.Args[3],
                  "mvrvntn":       os.Args[4],
              }

              manifest, err := loadManifest(os.Args[5])
              if err != nil {
                  panic(fmt.Errorf("failed to read manifest: %w", err))
              }

              lists := make(map[string]*router.GeoSiteList)
              for source, path := range sources {
                  list, err := loadGeoSite(path)
                  if err != nil {
                      panic(err)
                  }
                  lists[source] = list
              }

              result := new(router.GeoSiteList)
              ruCategory := &router.GeoSite{CountryCode: "RU"}
              globalSeen := make(map[string]bool)

              sourceCategoryCount := 0
              sourceDomainCount := 0
              writtenDomainCount := 0
              duplicateDomainCount := 0
              removedRussianDomainCount := 0
              removedUnsupportedTypeCount := 0
              missingExternalCount := 0

              matched := make(map[string]map[string]bool)
              for source := range sources {
                  matched[source] = make(map[string]bool)
              }

              for source, selectedCategories := range manifest {
                  list, ok := lists[source]
                  if !ok {
                      panic(fmt.Sprintf("unknown source in manifest: %s", source))
                  }

                  for _, site := range list.Entry {
                      if site == nil {
                          continue
                      }

                      category := normalizeName(site.CountryCode)
                      if !selectedCategories[category] {
                          continue
                      }

                      matched[source][category] = true
                      sourceCategoryCount++

                      for _, domain := range site.Domain {
                          if domain == nil {
                              continue
                          }

                          sourceDomainCount++

                          switch domain.Type {
                          case router.Domain_RootDomain,
                              router.Domain_Full:
                              // OK
                          default:
                              removedUnsupportedTypeCount++
                              continue
                          }

                          value := normalizeName(domain.Value)
                          if value == "" {
                              continue
                          }

                          // Все .ru/.su/.рф правила схлопываются в три
                          // компактных RootDomain ниже.
                          if isRussianTLD(value) {
                              removedRussianDomainCount++
                              continue
                          }

                          key := domainKey(domain)
                          if globalSeen[key] {
                              duplicateDomainCount++
                              continue
                          }

                          globalSeen[key] = true
                          copied := cloneDomain(domain)
                          copied.Value = value
                          ruCategory.Domain = append(ruCategory.Domain, copied)
                          writtenDomainCount++
                      }
                  }
              }

              for _, source := range []string{"hydra", "grimbird", "mvrvntn"} {
                  for category := range manifest[source] {
                      if !matched[source][category] {
                          fmt.Printf(
                              "WARNING: requested external category %s|%s was not found in source DAT\n",
                              source,
                              category,
                          )
                          missingExternalCount++
                      }
                  }
              }

              if missingExternalCount > 0 {
                  panic(fmt.Sprintf(
                      "required external categories missing: %d",
                      missingExternalCount,
                  ))
              }

              for _, value := range []string{"ru", "xn--p1ai", "su"} {
                  key := fmt.Sprintf("%d|%s", router.Domain_RootDomain, value)
                  if !globalSeen[key] {
                      globalSeen[key] = true
                      ruCategory.Domain = append(ruCategory.Domain, &router.Domain{
                          Type:  router.Domain_RootDomain,
                          Value: value,
                      })
                      writtenDomainCount++
                  }
              }

              sort.Slice(ruCategory.Domain, func(i, j int) bool {
                  a := ruCategory.Domain[i]
                  b := ruCategory.Domain[j]
                  if a.Type != b.Type {
                      return a.Type < b.Type
                  }
                  return normalizeName(a.Value) < normalizeName(b.Value)
              })

              if len(ruCategory.Domain) == 0 {
                  panic("RU category is empty")
              }

              result.Entry = append(result.Entry, ruCategory)

              // ----------------------------------------------------------
              // После обработки общего RU добавляем выбранные категории
              // Hydra отдельными категориями и строго в заданном порядке.
              // Они НЕ вливаются в RU и НЕ дедуплицируются с RU.
              // Внутри каждой категории повторяющиеся Type+Value удаляются.
              // ----------------------------------------------------------
              hydraAppendCategories, err := loadOrderedCategories(os.Args[6])
              if err != nil {
                  panic(fmt.Errorf("failed to read Hydra append manifest: %w", err))
              }

              hydraList := lists["hydra"]
              hydraByCategory := make(map[string]*router.GeoSite)
              for _, site := range hydraList.Entry {
                  if site == nil {
                      continue
                  }
                  category := normalizeName(site.CountryCode)
                  for _, wanted := range hydraAppendCategories {
                      if category == wanted {
                          if _, exists := hydraByCategory[category]; exists {
                              panic(fmt.Sprintf("duplicate source category in Hydra DAT: %s", wanted))
                          }
                          hydraByCategory[category] = site
                          break
                      }
                  }
              }

              appendedRuleCount := 0
              appendedDuplicateCount := 0

              for _, category := range hydraAppendCategories {
                  site, ok := hydraByCategory[category]
                  if !ok {
                      panic(fmt.Sprintf("required Hydra category missing: %s", category))
                  }

                  dst := &router.GeoSite{CountryCode: site.CountryCode}
                  seen := make(map[string]bool)

                  for _, domain := range site.Domain {
                      if domain == nil {
                          continue
                      }

                      key := domainKey(domain)
                      if seen[key] {
                          appendedDuplicateCount++
                          continue
                      }

                      seen[key] = true
                      copied := cloneDomain(domain)
                      copied.Value = normalizeName(copied.Value)
                      if copied.Value == "" {
                          continue
                      }
                      dst.Domain = append(dst.Domain, copied)
                      appendedRuleCount++
                  }

                  if len(dst.Domain) == 0 {
                      panic(fmt.Sprintf("Hydra category is empty: %s", category))
                  }

                  result.Entry = append(result.Entry, dst)
              }

              // ----------------------------------------------------------
              // Финальная сериализация: RU идёт первым, затем Hydra.
              // ----------------------------------------------------------
              outputData, err := proto.MarshalOptions{Deterministic: true}.Marshal(result)
              if err != nil {
                  panic(fmt.Errorf("failed to marshal final output DAT: %w", err))
              }

              if err := os.WriteFile(os.Args[7], outputData, 0644); err != nil {
                  panic(fmt.Errorf("failed to write output DAT: %w", err))
              }

              fmt.Println()
              fmt.Println("========================================")
              fmt.Println("RU LIGHT GEOSITE BUILD")
              fmt.Println("========================================")
              fmt.Printf("Source category matches : %d\n", sourceCategoryCount)
              fmt.Printf("Source domain rules     : %d\n", sourceDomainCount)
              fmt.Printf("Written domain rules    : %d\n", writtenDomainCount)
              fmt.Printf("Removed RU TLD rules    : %d\n", removedRussianDomainCount)
              fmt.Printf("Removed regex/keyword   : %d\n", removedUnsupportedTypeCount)
              fmt.Printf("Removed duplicates      : %d\n", duplicateDomainCount)
              fmt.Printf("Appended Hydra rules    : %d\n", appendedRuleCount)
              fmt.Printf("Hydra duplicates removed: %d\n", appendedDuplicateCount)
              fmt.Printf("Final categories        : %d\n", len(result.Entry))
              fmt.Printf("Final DAT size          : %d bytes\n", len(outputData))
              fmt.Println("Output categories       : RU + 16 Hydra categories")
          }
          EOF

          cd domain-list-community

          echo "=== Building RU filter ==="

          go build \
            -o /tmp/ru-geosite-filter \
            ./tools/ru-geosite-filter

          echo "Filter compiled successfully."

      # ------------------------------------------------------------
      # 7. Generate final lightweight geosite_RU.dat
      # ------------------------------------------------------------
      - name: Build lightweight geosite_RU.dat
        shell: bash
        run: |
          set -euo pipefail

          /tmp/ru-geosite-filter \
            "$INPUT_FILE" \
            "$HYDRA_INPUT_FILE" \
            "$GRIMBIRD_INPUT_FILE" \
            "$MVR_INPUT_FILE" \
            selected_ru_categories.txt \
            hydra_append_categories.txt \
            "$OUTPUT_FILE"

          test -s "$OUTPUT_FILE"

          echo
          echo "========================================"
          echo "OUTPUT"
          echo "========================================"

          ls -lh "$OUTPUT_FILE"

      # ------------------------------------------------------------
      # 8. Calculate checksum
      # ------------------------------------------------------------
      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "$OUTPUT_FILE" \
            | tee "$OUTPUT_SHA_FILE"

      # ------------------------------------------------------------
      # 9. Final validation
      #
      # Проверяем:
      # - protobuf читается;
      # - итог состоит ровно из одной категории RU;
      # - внутри RU нет дубликатов;
      # - присутствуют компактные ru / su / xn--p1ai;
      # - нет Regex/Plain и прочих российских TLD.
      # ------------------------------------------------------------
      - name: Validate final DAT
        shell: bash
        run: |
          set -euo pipefail

          cd domain-list-community

          cat > tools/ru-geosite-filter/validate.go <<'EOF'
          package main

          import (
              "fmt"
              "os"
              "strings"

              router "github.com/v2fly/v2ray-core/v5/app/router/routercommon"
              "google.golang.org/protobuf/proto"
          )

          func isRussianTLD(value string) bool {
              value = strings.ToLower(strings.TrimSpace(value))
              value = strings.TrimSuffix(value, ".")
              value = strings.TrimPrefix(value, ".")

              switch value {
              case "ru", "su", "xn--p1ai", "рф":
                  return true
              }

              return strings.HasSuffix(value, ".ru") ||
                  strings.HasSuffix(value, ".su") ||
                  strings.HasSuffix(value, ".xn--p1ai") ||
                  strings.HasSuffix(value, ".рф")
          }

          func domainKey(domain *router.Domain) string {
              return fmt.Sprintf(
                  "%d|%s",
                  domain.Type,
                  strings.ToLower(strings.TrimSpace(domain.Value)),
              )
          }

          func main() {
              if len(os.Args) != 2 {
                  os.Exit(2)
              }

              data, err := os.ReadFile(os.Args[1])
              if err != nil {
                  panic(err)
              }

              list := new(router.GeoSiteList)
              if err := proto.Unmarshal(data, list); err != nil {
                  panic(fmt.Errorf("invalid geosite protobuf: %w", err))
              }

              expectedHydra := []string{
                  "apple",
                  "epicgames",
                  "escapefromtarkov",
                  "faceit",
                  "github",
                  "google-deepmind",
                  "google-play",
                  "microsoft",
                  "pinterest",
                  "riot",
                  "steam",
                  "telegram",
                  "twitch",
                  "twitch-ads",
                  "youtube",
                  "win-spy",
              }

              if len(list.Entry) != 1+len(expectedHydra) {
                  panic(fmt.Sprintf(
                      "expected exactly %d categories, got %d",
                      1+len(expectedHydra),
                      len(list.Entry),
                  ))
              }

              // RU должен быть первым и единственным объединённым RU.
              ru := list.Entry[0]
              if ru == nil || strings.ToLower(strings.TrimSpace(ru.CountryCode)) != "ru" {
                  panic("first category must be RU")
              }

              seenRU := make(map[string]bool, len(ru.Domain))
              expectedTLD := map[string]bool{
                  "ru":       false,
                  "xn--p1ai": false,
                  "su":       false,
              }

              for _, domain := range ru.Domain {
                  if domain == nil {
                      panic("RU contains nil domain")
                  }

                  switch domain.Type {
                  case router.Domain_RootDomain, router.Domain_Full:
                  default:
                      panic(fmt.Sprintf("unsupported rule type in RU: %v", domain.Type))
                  }

                  value := strings.ToLower(strings.TrimSpace(domain.Value))
                  if value == "" {
                      panic("RU contains empty domain value")
                  }

                  key := domainKey(domain)
                  if seenRU[key] {
                      panic(fmt.Sprintf("duplicate domain in RU: %s", domain.Value))
                  }
                  seenRU[key] = true

                  if domain.Type == router.Domain_RootDomain {
                      if _, ok := expectedTLD[value]; ok {
                          expectedTLD[value] = true
                      }
                  }

                  if isRussianTLD(value) &&
                      value != "ru" && value != "su" && value != "xn--p1ai" {
                      panic(fmt.Sprintf("Russian TLD leaked into RU: %s", domain.Value))
                  }
              }

              for name, ok := range expectedTLD {
                  if !ok {
                      panic(fmt.Sprintf("RU missing compact TLD: %s", name))
                  }
              }

              // Остальные категории обязаны идти строго в указанном порядке.
              for i, expected := range expectedHydra {
                  site := list.Entry[i+1]
                  if site == nil {
                      panic(fmt.Sprintf("Hydra category %s is nil", expected))
                  }

                  category := strings.ToLower(strings.TrimSpace(site.CountryCode))
                  if category != expected {
                      panic(fmt.Sprintf(
                          "Hydra category order mismatch: expected %s, got %s",
                          expected,
                          site.CountryCode,
                      ))
                  }

                  if len(site.Domain) == 0 {
                      panic(fmt.Sprintf("Hydra category is empty: %s", category))
                  }

                  seen := make(map[string]bool, len(site.Domain))
                  for _, domain := range site.Domain {
                      if domain == nil {
                          panic(fmt.Sprintf("%s contains nil domain", category))
                      }

                      value := strings.ToLower(strings.TrimSpace(domain.Value))
                      if value == "" {
                          panic(fmt.Sprintf("%s contains empty domain value", category))
                      }

                      key := domainKey(domain)
                      if seen[key] {
                          panic(fmt.Sprintf(
                              "duplicate domain in Hydra category %s: %s",
                              category,
                              domain.Value,
                          ))
                      }
                      seen[key] = true
                  }
              }

              fmt.Println()
              fmt.Println("========================================")
              fmt.Println("VALIDATION OK")
              fmt.Println("========================================")
              fmt.Printf("Categories: %d (RU + 16 Hydra)\n", len(list.Entry))
              fmt.Printf("RU rules:  %d\n", len(ru.Domain))
              fmt.Println("Single merged category: RU")
              fmt.Println("RU duplicates: none")
              fmt.Println("RU compact TLDs: ru, xn--p1ai, su")
              fmt.Println("Hydra categories: 16, appended after RU in requested order")
              fmt.Println("Hydra intra-category duplicates: none")
          }
          EOF

          go run \
            ./tools/ru-geosite-filter/validate.go \
            "$GITHUB_WORKSPACE/$OUTPUT_FILE"

      # ------------------------------------------------------------
      # 10. Publish GitHub Release
      # ------------------------------------------------------------
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-optimized
          name: "Optimized RU GeoSite"
          make_latest: true

          files: |
            geosite_RU.dat
            geosite_RU.dat.sha256sum
            geosite_RU_categories.txt
            geosite_RU_hydra_appended_categories.txt

          body: |
            # Optimized RU GeoSite

            Automatically generated Russian-region GeoSite database.

            ## Sources

            - `runetfreedom/russia-blocked-geosite`
            - `hydraponique/roscomvpn-geosite`
            - `GrimbirdUsers/ru-routing-dat`
            - `mvrvntn/routing` (`category-ru` merged into RU)

            ## Selection

            The selected RU categories from runetfreedom, Hydra, Grimbird, and mvrvntn are merged into a single `RU` category.

            Hydra categories:
            - `whitelist`
            - `private`
            - `category-ru`

            Grimbird categories:
            - `category-ru-whitelist`
            - `ozon`
            - `ru-analytics`
            - `ru-cdn`
            - `ru-finance`
            - `ru-medical`
            - `ru-retail-extra`
            - `ru-transport`
            - `ru-tv`
            - `ru-whitelist-extended`
            - `swift`

            mvrvntn category merged into RU:
            - `category-ru`

            The runetfreedom/v2fly side continues to include the recursive `category-ru`, all current `*-ru` lists,
            `ru-available-only-inside`, and the additional Russian service/company lists.

            ## Filtering

            Before the final merge, the following Russian zones are removed from source categories:

            - `.ru`
            - `.su`
            - `.xn--p1ai`
            - `.рф`

            Regex and keyword rules are removed to reduce size. Only `RootDomain` and `Full` rules remain.

            ## Deduplication

            Duplicate rules with the same type and domain value are kept only once across all source categories.

            ## Appended Hydra categories

            After the merged `RU` category, the following Hydra categories are appended as separate categories, in this exact order:

            `apple`, `epicgames`, `escapefromtarkov`, `faceit`, `github`, `google-deepmind`,
            `google-play`, `microsoft`, `pinterest`, `riot`, `steam`, `telegram`, `twitch`,
            `twitch-ads`, `youtube`, `win-spy`.

            Their domain rules are kept as separate routing categories; only duplicate Type+Value rules within each appended category are removed.

            ## Compact Russian TLDs

            The single generated `RU` category contains these compact rules:

            `domain:ru`
            `domain:xn--p1ai`
            `domain:su`

            ## Usage

            `ext:geosite_RU.dat:RU`

            Appended Hydra categories can be used by their original names, for example `geosite:apple`, `geosite:github`, `geosite:youtube`, and `geosite:win-spy`.

            There is no separate `TLD-RU` category.

            `geosite_RU_categories.txt` contains the source category manifest merged into RU.
            `geosite_RU_hydra_appended_categories.txt` contains the ordered list of appended Hydra categories.

          fail_on_unmatched_files: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # 11. Also publish files to release branch.
      #
      # Получится постоянный raw URL:
      #
      # https://raw.githubusercontent.com/OWNER/REPO/release/geosite_RU.dat
      #
      # ------------------------------------------------------------
      - name: Publish files to release branch
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/geosite-release
          mkdir -p /tmp/geosite-release

          cp "$OUTPUT_FILE" \
            /tmp/geosite-release/geosite_RU.dat

          cp "$OUTPUT_SHA_FILE" \
            /tmp/geosite-release/geosite_RU.dat.sha256sum

          cp "$CATEGORY_FILE" \
            /tmp/geosite-release/geosite_RU_categories.txt

          cp "$HYDRA_APPEND_FILE" \
            /tmp/geosite-release/geosite_RU_hydra_appended_categories.txt

          cd /tmp/geosite-release

          git init
          git checkout -b release

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit \
            -m "Update optimized RU GeoSite"

          git remote add origin \
            "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"

          git push \
            --force \
            origin \
            release

      # ------------------------------------------------------------
      # 12. Workflow summary
      # ------------------------------------------------------------
      - name: Print download URLs
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "DOWNLOAD URLS"
          echo "========================================"
          echo
          echo "GitHub Release:"
          echo "https://github.com/${{ github.repository }}/releases/download/latest-optimized/geosite_RU.dat"
          echo
          echo "Raw release branch:"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/release/geosite_RU.dat"
          echo
          echo "SHA256:"
          cat "$OUTPUT_SHA_FILE"
