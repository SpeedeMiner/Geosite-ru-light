name: Build Ultimate Light RU Geosite

on:
  workflow_dispatch:

  schedule:
    # Каждый понедельник в 00:00 UTC
    - cron: "0 0 * * 0"

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      # Актуальная полная GeoSite-база runetfreedom.
      # В их текущем build workflow используется именно этот release branch.
      GEOSITE_URL: https://raw.githubusercontent.com/runetfreedom/russia-blocked-geosite/release/geosite.dat
      GEOSITE_SHA_URL: https://raw.githubusercontent.com/runetfreedom/russia-blocked-geosite/release/geosite.dat.sha256sum

      INPUT_FILE: source-geosite.dat
      OUTPUT_FILE: geosite_RU.dat
      CATEGORY_FILE: geosite_RU_categories.txt
      OUTPUT_SHA_FILE: geosite_RU.dat.sha256sum

    steps:
      # ------------------------------------------------------------
      # 1. Repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Clone current domain-list-community
      #
      # Используется только для автоматического определения
      # актуальной структуры category-ru и новых *-ru категорий.
      # ------------------------------------------------------------
      - name: Clone domain-list-community
        uses: actions/checkout@v4
        with:
          repository: v2fly/domain-list-community
          path: domain-list-community
          fetch-depth: 1

      # ------------------------------------------------------------
      # 3. Setup Go according to current domain-list-community
      # ------------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: domain-list-community/go.mod
          cache-dependency-path: domain-list-community/go.sum

      # ------------------------------------------------------------
      # 4. Download source geosite.dat
      # ------------------------------------------------------------
      - name: Download source GeoSite
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Downloading source geosite.dat"
          echo "========================================"

          curl -fL --retry 5 --retry-all-errors \
            "$GEOSITE_URL" \
            -o "$INPUT_FILE"

          curl -fL --retry 5 --retry-all-errors \
            "$GEOSITE_SHA_URL" \
            -o source-geosite.dat.sha256sum

          test -s "$INPUT_FILE"
          test -s source-geosite.dat.sha256sum

          echo
          echo "========================================"
          echo "Verifying SHA256"
          echo "========================================"

          EXPECTED_SHA256="$(awk 'NF {print $1; exit}' source-geosite.dat.sha256sum)"
          ACTUAL_SHA256="$(sha256sum "$INPUT_FILE" | awk '{print $1}')"

          echo "Expected: $EXPECTED_SHA256"
          echo "Actual:   $ACTUAL_SHA256"

          if [ "$EXPECTED_SHA256" != "$ACTUAL_SHA256" ]; then
            echo "ERROR: SHA256 mismatch!"
            exit 1
          fi

          echo "SHA256 verification OK."

          echo
          ls -lh "$INPUT_FILE"

      # ------------------------------------------------------------
      # 5. Build complete RU category manifest
      #
      # Здесь НЕ нужно вручную поддерживать каждый новый category-ru.
      #
      # Алгоритм:
      #
      # A. Рекурсивно раскрывается category-ru.
      # B. Автоматически добавляются все файлы *-ru.
      # C. Добавляются категории из ru-available-only-inside.
      # D. Добавляются дополнительные российские сервисы.
      #
      # Благодаря этому новые category-xxx-ru из upstream будут
      # попадать в результат автоматически.
      # ------------------------------------------------------------
      - name: Build RU category manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          DATA = Path("domain-list-community/data")

          selected = set()
          visited = set()
          missing = set()

          def normalize(name: str) -> str:
              return name.strip().lower()

          def visit(name: str):
              name = normalize(name)

              if not name:
                  return

              if name in visited:
                  return

              visited.add(name)

              path = DATA / name

              if not path.is_file():
                  missing.add(name)
                  return

              selected.add(name)

              try:
                  text = path.read_text(
                      encoding="utf-8",
                      errors="ignore",
                  )
              except Exception:
                  return

              for raw_line in text.splitlines():
                  line = raw_line.split("#", 1)[0].strip()

                  if not line:
                      continue

                  # Поддерживаем:
                  # include:foo
                  # include:foo @attr
                  #
                  # Берём только имя включаемого списка.
                  if line.lower().startswith("include:"):
                      target = line.split(":", 1)[1].strip()

                      if not target:
                          continue

                      target = target.split()[0].strip()

                      # Защита от потенциальных странных имён.
                      if re.fullmatch(r"[A-Za-z0-9_.!+-]+", target):
                          visit(target)

          # ----------------------------------------------------------
          # Официальное ядро.
          # ----------------------------------------------------------
          visit("category-ru")

          visit("tld-ru")

          # ----------------------------------------------------------
          # Все актуальные *-ru файлы из v2fly.
          #
          # Это автоматически подхватит новые категории.
          # Например:
          #
          # category-foo-ru
          # category-bar-ru
          # something-ru
          # ----------------------------------------------------------
          for path in DATA.iterdir():
              if not path.is_file():
                  continue

              name = path.name.lower()

              if name.endswith("-ru"):
                  visit(name)

          # ----------------------------------------------------------
          # Специальная категория runetfreedom.
          # ----------------------------------------------------------
          extra_categories = {
              "ru-available-only-inside",

              # Может присутствовать в некоторых актуальных
              # российско-ориентированных GeoSite-сборках.
              "category-geoblock-ru",

              # Текущая extended/внешняя RU-категория.
              "category-media-ru-blocked",

              # Основные сервисы.
              "yandex",
              "vk",
              "mailru",
              "mailru-group",
              "kinopoisk",
              "dzen",
              "ozon",
              "wildberries",
              "wb",
              "avito",
              "autoru",
              "aviasales",
              "rutube",
              "wink",
              "2gis",
              "ok",
              "okko",
              "sokolov",
              "x5",
              "mosmetro",
              "max",

              # Российские компании / инфраструктура.
              "beget",
              "carrotquest",
              "cdek",
              "comssone",
              "drweb",
              "envybox",
              "gismeteo",
              "group-ib",
              "headhunter",
              "ideco-ru",
              "kaspersky",
              "kontur",
              "mindbox",
              "myoffice-ru",
              "netcraze",
              "nic-ru",
              "positive-technologies",
              "regru",
              "selectel",
              "servicepipe",
              "skyeng",
              "smena",
              "tilda",
              "timeweb",
              "ucoz",
              "whoosh",

              # Телеком.
              "megafon",
              "mts",
              "mts-ru",
              "rostelecom",
              "t2",
              "t2-ru",
              "beeline",

              # Дополнительные российские сервисы.
              "1c",
              "1cloud",
              "1tv",
              "aeroflot",
              "alfabank",
              "avru",
              "bronevik",
              "cdnvideo",
              "citydrive",
              "dellin",
              "dixy",
              "dnevnikru",
              "dns-shop",
              "dodopizza",
              "domclick",
              "edadeal",
              "fastvps",
              "fixprice",
              "jivo",
              "kuper",
              "lemanapro",
              "lenta",
              "lentaru",
              "magnit",
              "megamarket",
              "motivtelecom",
              "ngenix",
              "ntv",
              "pochtaru",
              "psbank",
              "rambler",
              "rbc",
              "rt",
              "ruvds",
              "rzd",
              "samokat",
              "smotrim",
              "tass",
              "taxsee",
              "tbank",
              "tnt",
              "tutu",
              "vgtrk",
              "vtb",
              "vkusnoitochka",
              "vkusvill",
              "zentotem",

              # Дополнительные российские организации.
              "3ebra",
              "apptrackpets",
              "flomni",
              "foto-planeta",
              "gazfond-pn",
              "litres",
              "meteoinfo",
              "nplus1",
              "ognihome",
              "ponyexpress",
              "qms",
              "randomgodbot",
              "srv-hub",
              "t1",
              "vimu",
              "yourgood",

              # eXpress / MFA.
              "corp.express",
              "express.ms",
              "public.express",
              "xlnk.ms",
              "mfa.center",
              "multifactor",

              # Финансовые.
              "moex",
              "spvb",
              "banki",
              "finuslugi",
              "nspk",
              "mironline",
              "mirpayonline",
              "sistema-capital",
              "efin",
              "credistory",
              "nbki",
              "netmonet",
              "tips",

              # Остальные.
              "ipip",
          }

          for name in sorted(extra_categories):
              visit(name)

          # ----------------------------------------------------------
          # Нежелательные общие технические категории.
          # ----------------------------------------------------------
          excluded = {
              "private",
              "category-ip-geo-detect",
              "ipip",
          }

          selected -= excluded

          # Удаляем случайно попавшие пустые/служебные значения.
          selected = {
              x for x in selected
              if x and not x.startswith(".")
          }

          # ----------------------------------------------------------
          # Сохраняем итоговый manifest.
          # ----------------------------------------------------------
          output = Path("selected_ru_categories.txt")

          with output.open("w", encoding="utf-8") as f:
              for name in sorted(selected):
                  f.write(name + "\n")

          # ----------------------------------------------------------
          # Статистика.
          # ----------------------------------------------------------
          print()
          print("========================================")
          print("RU CATEGORY MANIFEST")
          print("========================================")
          print(f"Selected categories: {len(selected)}")
          print(f"Visited lists:       {len(visited)}")
          print(f"Missing candidates:  {len(missing)}")
          print()

          print("Selected categories:")
          for name in sorted(selected):
              print(f"  + {name}")

          if missing:
              print()
              print("Candidates not present in v2fly data.")
              print("They may still exist in the downloaded runetfreedom DAT:")
              for name in sorted(missing):
                  print(f"  ? {name}")

          print()
          print(f"Manifest written to: {output}")
          PY

          # Заглавные/мелкие имена категорий для удобства просмотра.
          cp selected_ru_categories.txt "$CATEGORY_FILE"

          echo
          echo "=== Total candidates ==="
          wc -l "$CATEGORY_FILE"

          echo
          echo "=== First categories ==="
          head -n 50 "$CATEGORY_FILE"

      # ------------------------------------------------------------
      # 6. Create protobuf filter.
      #
      # Используем тот же v2ray-core/v5, который используется самим
      # актуальным domain-list-community.
      # ------------------------------------------------------------
      - name: Create RU GeoSite protobuf filter
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p domain-list-community/tools/ru-geosite-filter

          cat > domain-list-community/tools/ru-geosite-filter/main.go <<'EOF'
          package main

          import (
              "fmt"
              "io"
              "os"
              "sort"
              "strings"

              router "github.com/v2fly/v2ray-core/v5/app/router/routercommon"
              "google.golang.org/protobuf/proto"
          )

          // normalizeName приводит название категории/домена
          // к стабильному виду для сравнения.
          func normalizeName(value string) string {
              return strings.ToLower(strings.TrimSpace(value))
          }

          // isRussianTLD определяет российские TLD, которые пользователь
          // хочет убрать из содержимого всех категорий.
          //
          // Удаляются:
          //   .ru
          //   .su
          //   .xn--p1ai
          //   .рф
          //
          // Также удаляются сами TLD:
          //   ru
          //   su
          //   xn--p1ai
          //   рф
          func isRussianTLD(value string) bool {
              value = normalizeName(value)

              value = strings.TrimSuffix(value, ".")
              value = strings.TrimPrefix(value, ".")

              switch value {
              case "ru":
                  return true
              case "su":
                  return true
              case "xn--p1ai":
                  return true
              case "рф":
                  return true
              }

              if strings.HasSuffix(value, ".ru") {
                  return true
              }

              if strings.HasSuffix(value, ".su") {
                  return true
              }

              if strings.HasSuffix(value, ".xn--p1ai") {
                  return true
              }

              if strings.HasSuffix(value, ".рф") {
                  return true
              }

              return false
          }

          // attrKey сохраняет различия между одинаковыми доменами,
          // если у них разные GeoSite attributes.
          func attrKey(domain *router.Domain) string {
              if len(domain.Attribute) == 0 {
                  return ""
              }

              values := make([]string, 0, len(domain.Attribute))

              for _, attr := range domain.Attribute {
                  if attr == nil {
                      continue
                  }

                  values = append(
                      values,
                      normalizeName(attr.Key),
                  )
              }

              sort.Strings(values)

              return strings.Join(values, ",")
          }

          func domainKey(domain *router.Domain) string {
              return fmt.Sprintf(
                  "%d|%s|%s",
                  domain.Type,
                  normalizeName(domain.Value),
                  attrKey(domain),
              )
          }

          func copyDomain(domain *router.Domain) *router.Domain {
              return proto.Clone(domain).(*router.Domain)
          }

          func loadSelected(path string) (map[string]bool, error) {
              data, err := os.ReadFile(path)
              if err != nil {
                  return nil, err
              }

              selected := make(map[string]bool)

              for _, line := range strings.Split(string(data), "\n") {
                  line = normalizeName(line)

                  if line == "" {
                      continue
                  }

                  selected[line] = true
              }

              return selected, nil
          }

          func main() {
              if len(os.Args) != 4 {
                  fmt.Fprintf(
                      os.Stderr,
                      "usage: %s input.dat selected.txt output.dat\n",
                      os.Args[0],
                  )
                  os.Exit(2)
              }

              inputPath := os.Args[1]
              selectedPath := os.Args[2]
              outputPath := os.Args[3]

              selected, err := loadSelected(selectedPath)
              if err != nil {
                  panic(fmt.Errorf(
                      "failed to read selected categories: %w",
                      err,
                  ))
              }

              inputFile, err := os.Open(inputPath)
              if err != nil {
                  panic(fmt.Errorf(
                      "failed to open input DAT: %w",
                      err,
                  ))
              }

              defer inputFile.Close()

              inputData, err := io.ReadAll(inputFile)
              if err != nil {
                  panic(fmt.Errorf(
                      "failed to read input DAT: %w",
                      err,
                  ))
              }

              source := new(router.GeoSiteList)

              if err := proto.Unmarshal(inputData, source); err != nil {
                  panic(fmt.Errorf(
                      "failed to parse source geosite.dat: %w",
                      err,
                  ))
              }

              // ----------------------------------------------------------
              // Собираем ВСЕ выбранные категории в ОДНУ категорию RU.
              //
              // Дедупликация глобальная: одинаковый Type + Value
              // учитывается только один раз, даже если домен встречается
              // в нескольких исходных категориях.
              //
              // Российские TLD удаляются из всех исходных категорий и
              // затем добавляются компактно в ту же самую RU-категорию.
              // ----------------------------------------------------------
              result := new(router.GeoSiteList)

              sourceCategoryCount := len(source.Entry)
              selectedCategoryCount := 0
              writtenCategoryCount := 0

              sourceDomainCount := 0
              writtenDomainCount := 0
              duplicateDomainCount := 0
              removedRussianDomainCount := 0
              removedUnsupportedTypeCount := 0

              matchedCategories := make(map[string]bool)
              globalSeen := make(map[string]bool)

              // Единая итоговая категория.
              ruCategory := &router.GeoSite{
                  CountryCode: "RU",
              }

              for _, site := range source.Entry {
                  if site == nil {
                      continue
                  }

                  category := normalizeName(site.CountryCode)

                  // Исходные RU/TLD-RU не копируем: итоговая RU
                  // создаётся полностью заново ниже.
                  if category == "ru" || category == "tld-ru" {
                      continue
                  }

                  if !selected[category] {
                      continue
                  }

                  matchedCategories[category] = true
                  selectedCategoryCount++

                  for _, domain := range site.Domain {
                      if domain == nil {
                          continue
                      }

                      sourceDomainCount++

                      // Для лёгкой базы оставляем только RootDomain и Full.
                      switch domain.Type {
                      case router.Domain_RootDomain,
                          router.Domain_Full:

                      default:
                          removedUnsupportedTypeCount++
                          continue
                      }

                      value := normalizeName(domain.Value)

                      if value == "" {
                          continue
                      }

                      // Российские TLD будут добавлены компактно ниже.
                      if isRussianTLD(value) {
                          removedRussianDomainCount++
                          continue
                      }

                      // Глобальная дедупликация по типу и значению.
                      key := fmt.Sprintf("%d|%s", domain.Type, value)

                      if globalSeen[key] {
                          duplicateDomainCount++
                          continue
                      }

                      globalSeen[key] = true

                      copied := copyDomain(domain)
                      copied.Value = value
                      ruCategory.Domain = append(ruCategory.Domain, copied)
                      writtenDomainCount++
                  }
              }

              // ----------------------------------------------------------
              // Компактные российские TLD добавляем в ту же RU-категорию.
              // ----------------------------------------------------------
              for _, value := range []string{"ru", "xn--p1ai", "su"} {
                  key := fmt.Sprintf("%d|%s", router.Domain_RootDomain, value)

                  if globalSeen[key] {
                      continue
                  }

                  globalSeen[key] = true
                  ruCategory.Domain = append(ruCategory.Domain, &router.Domain{
                      Type:  router.Domain_RootDomain,
                      Value: value,
                  })
                  writtenDomainCount++
              }

              // Стабильный порядок правил внутри единой RU.
              sort.Slice(ruCategory.Domain, func(i, j int) bool {
                  a := ruCategory.Domain[i]
                  b := ruCategory.Domain[j]

                  if a.Type != b.Type {
                      return a.Type < b.Type
                  }

                  return normalizeName(a.Value) < normalizeName(b.Value)
              })

              if len(ruCategory.Domain) == 0 {
                  panic("RU category is empty")
              }

              result.Entry = append(result.Entry, ruCategory)
              writtenCategoryCount = 1

              outputData, err := proto.MarshalOptions{
                  Deterministic: true,
              }.Marshal(result)

              if err != nil {
                  panic(fmt.Errorf(
                      "failed to marshal output DAT: %w",
                      err,
                  ))
              }

              if err := os.WriteFile(
                  outputPath,
                  outputData,
                  0644,
              ); err != nil {
                  panic(fmt.Errorf(
                      "failed to write output DAT: %w",
                      err,
                  ))
              }

              // ----------------------------------------------------------
              // Проверяем, что ключевые категории действительно
              // присутствуют в downloaded DAT.
              // ----------------------------------------------------------
              required := []string{
                  "category-ru",
                  "ru-available-only-inside",
              }

              for _, category := range required {
                  if !matchedCategories[category] {
                      fmt.Printf(
                          "WARNING: required category %q was not found in source DAT\n",
                          category,
                      )
                  }
              }

              fmt.Println()
              fmt.Println("========================================")
              fmt.Println("RU LIGHT GEOSITE BUILD")
              fmt.Println("========================================")
              fmt.Printf(
                  "Source categories       : %d\n",
                  sourceCategoryCount,
              )
              fmt.Printf(
                  "Selected source categories: %d\n",
                  selectedCategoryCount,
              )
              fmt.Printf(
                  "Final categories         : %d\n",
                  len(result.Entry),
              )
              fmt.Printf(
                  "Written categories       : %d\n",
                  writtenCategoryCount,
              )
              fmt.Printf(
                  "Source domain rules     : %d\n",
                  sourceDomainCount,
              )
              fmt.Printf(
                  "Written domain rules    : %d\n",
                  writtenDomainCount,
              )
              fmt.Printf(
                  "Removed RU TLD rules    : %d\n",
                  removedRussianDomainCount,
              )
              fmt.Printf(
                  "Removed regex/keyword   : %d\n",
                  removedUnsupportedTypeCount,
              )
              fmt.Printf(
                  "Removed duplicates      : %d\n",
                  duplicateDomainCount,
              )
              fmt.Printf(
                  "Final DAT size          : %d bytes\n",
                  len(outputData),
              )
              fmt.Println()

              fmt.Println("Output categories:")

              outputNames := make([]string, 0, len(result.Entry))

              for _, site := range result.Entry {
                  outputNames = append(
                      outputNames,
                      site.CountryCode,
                  )
              }

              sort.Strings(outputNames)

              for _, name := range outputNames {
                  fmt.Printf("  %s\n", name)
              }
          }
          EOF

          cd domain-list-community

          echo "=== Building RU filter ==="

          go build \
            -o /tmp/ru-geosite-filter \
            ./tools/ru-geosite-filter

          echo "Filter compiled successfully."

      # ------------------------------------------------------------
      # 7. Generate final lightweight geosite_RU.dat
      # ------------------------------------------------------------
      - name: Build lightweight geosite_RU.dat
        shell: bash
        run: |
          set -euo pipefail

          /tmp/ru-geosite-filter \
            "$INPUT_FILE" \
            selected_ru_categories.txt \
            "$OUTPUT_FILE"

          test -s "$OUTPUT_FILE"

          echo
          echo "========================================"
          echo "OUTPUT"
          echo "========================================"

          ls -lh "$OUTPUT_FILE"

      # ------------------------------------------------------------
      # 8. Calculate checksum
      # ------------------------------------------------------------
      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "$OUTPUT_FILE" \
            | tee "$OUTPUT_SHA_FILE"

      # ------------------------------------------------------------
      # 9. Final validation
      #
      # Проверяем:
      # - protobuf читается;
      # - итог состоит ровно из одной категории RU;
      # - внутри RU нет дубликатов;
      # - присутствуют компактные ru / su / xn--p1ai;
      # - нет Regex/Plain и прочих российских TLD.
      # ------------------------------------------------------------
      - name: Validate final DAT
        shell: bash
        run: |
          set -euo pipefail

          cd domain-list-community

          cat > tools/ru-geosite-filter/validate.go <<'EOF'
          package main

          import (
              "fmt"
              "os"
              "strings"

              router "github.com/v2fly/v2ray-core/v5/app/router/routercommon"
              "google.golang.org/protobuf/proto"
          )

          func isRussianTLD(value string) bool {
              value = strings.ToLower(strings.TrimSpace(value))
              value = strings.TrimSuffix(value, ".")
              value = strings.TrimPrefix(value, ".")

              switch value {
              case "ru", "su", "xn--p1ai", "рф":
                  return true
              }

              return strings.HasSuffix(value, ".ru") ||
                  strings.HasSuffix(value, ".su") ||
                  strings.HasSuffix(value, ".xn--p1ai") ||
                  strings.HasSuffix(value, ".рф")
          }

          func domainKey(domain *router.Domain) string {
              value := strings.ToLower(strings.TrimSpace(domain.Value))
              return fmt.Sprintf("%d|%s", domain.Type, value)
          }

          func main() {
              if len(os.Args) != 2 {
                  os.Exit(2)
              }

              data, err := os.ReadFile(os.Args[1])
              if err != nil {
                  panic(err)
              }

              list := new(router.GeoSiteList)

              if err := proto.Unmarshal(data, list); err != nil {
                  panic(fmt.Errorf("invalid geosite protobuf: %w", err))
              }

              // Итоговый DAT должен содержать ровно одну категорию: RU.
              if len(list.Entry) != 1 {
                  panic(fmt.Sprintf(
                      "expected exactly 1 category, got %d",
                      len(list.Entry),
                  ))
              }

              site := list.Entry[0]
              if site == nil {
                  panic("RU category is nil")
              }

              category := strings.ToLower(strings.TrimSpace(site.CountryCode))
              if category != "ru" {
                  panic(fmt.Sprintf(
                      "expected only RU category, got %q",
                      site.CountryCode,
                  ))
              }

              totalRules := len(site.Domain)
              seen := make(map[string]bool, totalRules)
              expectedTLD := map[string]bool{
                  "ru":       false,
                  "xn--p1ai": false,
                  "su":       false,
              }

              for _, domain := range site.Domain {
                  if domain == nil {
                      panic("RU contains nil domain")
                  }

                  switch domain.Type {
                  case router.Domain_RootDomain,
                      router.Domain_Full:
                      // OK

                  default:
                      panic(fmt.Sprintf(
                          "unsupported rule type in RU: %v",
                          domain.Type,
                      ))
                  }

                  value := strings.ToLower(strings.TrimSpace(domain.Value))
                  if value == "" {
                      panic("RU contains empty domain value")
                  }

                  key := domainKey(domain)
                  if seen[key] {
                      panic(fmt.Sprintf(
                          "duplicate domain in RU: %s",
                          domain.Value,
                      ))
                  }
                  seen[key] = true

                  // Компактные TLD должны присутствовать как RootDomain.
                  if domain.Type == router.Domain_RootDomain {
                      if _, ok := expectedTLD[value]; ok {
                          expectedTLD[value] = true
                      }
                  }

                  // Никаких отдельных .ru/.su/.рф-зон кроме трёх
                  // компактных корневых правил быть не должно.
                  if isRussianTLD(value) &&
                      value != "ru" && value != "su" && value != "xn--p1ai" {
                      panic(fmt.Sprintf(
                          "Russian TLD leaked into RU: %s",
                          domain.Value,
                      ))
                  }
              }

              for name, ok := range expectedTLD {
                  if !ok {
                      panic(fmt.Sprintf(
                          "RU missing compact TLD: %s",
                          name,
                      ))
                  }
              }

              fmt.Println()
              fmt.Println("========================================")
              fmt.Println("VALIDATION OK")
              fmt.Println("========================================")
              fmt.Println("Categories: 1")
              fmt.Printf("Rules:      %d\n", totalRules)
              fmt.Println("Single category: RU")
              fmt.Println("Global duplicates: none")
              fmt.Println("RU category contains: ru, xn--p1ai, su")
              fmt.Println("No extra Russian TLD rules found.")
              fmt.Println("No regex/keyword rules found.")
          }
          EOF

          go run \
            ./tools/ru-geosite-filter/validate.go \
            "$GITHUB_WORKSPACE/$OUTPUT_FILE"

      # ------------------------------------------------------------
      # 10. Publish GitHub Release
      # ------------------------------------------------------------
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-optimized
          name: "Optimized RU GeoSite"
          make_latest: true

          files: |
            geosite_RU.dat
            geosite_RU.dat.sha256sum
            geosite_RU_categories.txt

          body: |
            # Optimized RU GeoSite

            Automatically generated Russian-region GeoSite database.

            ## Source

            runetfreedom/russia-blocked-geosite

            ## Selection

            All selected source categories are merged into a single `RU` category.
            Source categories are selected automatically from `category-ru`, all `*-ru` lists,
            `ru-available-only-inside`, and the additional Russian service/company lists.

            ## Filtering

            Before the final merge, the following Russian zones are removed from source categories:

            - `.ru`
            - `.su`
            - `.xn--p1ai`
            - `.рф`

            Regex and keyword rules are removed to reduce size. Only `RootDomain` and `Full` rules remain.

            ## Deduplication

            Duplicate rules with the same type and domain value are kept only once across all source categories.

            ## Compact Russian TLDs

            The single generated `RU` category contains these compact rules:

            `domain:ru`
            `domain:xn--p1ai`
            `domain:su`

            ## Usage

            `ext:geosite_RU.dat:RU`

            There is no separate `TLD-RU` category.

            `geosite_RU_categories.txt` contains the source category manifest used to build RU.

          fail_on_unmatched_files: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # 11. Also publish files to release branch.
      #
      # Получится постоянный raw URL:
      #
      # https://raw.githubusercontent.com/OWNER/REPO/release/geosite_RU.dat
      #
      # ------------------------------------------------------------
      - name: Publish files to release branch
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/geosite-release
          mkdir -p /tmp/geosite-release

          cp "$OUTPUT_FILE" \
            /tmp/geosite-release/geosite_RU.dat

          cp "$OUTPUT_SHA_FILE" \
            /tmp/geosite-release/geosite_RU.dat.sha256sum

          cp "$CATEGORY_FILE" \
            /tmp/geosite-release/geosite_RU_categories.txt

          cd /tmp/geosite-release

          git init
          git checkout -b release

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          git commit \
            -m "Update optimized RU GeoSite"

          git remote add origin \
            "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"

          git push \
            --force \
            origin \
            release

      # ------------------------------------------------------------
      # 12. Workflow summary
      # ------------------------------------------------------------
      - name: Print download URLs
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "DOWNLOAD URLS"
          echo "========================================"
          echo
          echo "GitHub Release:"
          echo "https://github.com/${{ github.repository }}/releases/download/latest-optimized/geosite_RU.dat"
          echo
          echo "Raw release branch:"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/release/geosite_RU.dat"
          echo
          echo "SHA256:"
          cat "$OUTPUT_SHA_FILE"
