name: Build Ultimate Light Geosite

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Clone domain-list-community
        run: git clone https://github.com/v2fly/domain-list-community.git

      - name: Prepare Clean Data Directory
        run: |
          cd domain-list-community
          rm -rf data/*
          
          # ОТКЛЮЧАЕМ падение скрипта при ненулевых кодах (grep exit 1)
          set +e
          
          echo "==== BUILDING RU DIRECT ===="
          # Скачиваем сырые TXT списки (игнорируя 404 ошибки)
          curl -sLf https://raw.githubusercontent.com/v2fly/domain-list-community/release/category-ru-whitelist.txt > ru_1.txt
          curl -sLf https://raw.githubusercontent.com/v2fly/domain-list-community/release/ru.txt > ru_2.txt
          
          # Склеиваем, чистим \r, оставляем только первый столбец
          cat ru_1.txt ru_2.txt > ru_raw.txt
          sed -i 's/\r//g' ru_raw.txt
          awk '{print $1}' ru_raw.txt | awk 'NF' | grep -v '^#' > ru_clean.txt
          
          # Вырезаем .ru, .su и т.д. (grep вернет 1 если не найдет совпадений, но set +e спасет)
          grep -viE '\.(ru|su|by|ua|xn--p1ai)$' ru_clean.txt > ru_filtered.txt
          
          # Создаем финальный файл data/ru
          echo -e "ru\nsu\nxn--p1ai\nby\nua" > data/ru
          sort -u ru_filtered.txt >> data/ru
          
          echo "==== BUILDING RU BLOCKED ===="
          curl -sLf https://community.antifilter.download/list/domains.lst > blocked_1.txt
          curl -sLf https://raw.githubusercontent.com/1andrevich/Re-filter-lists/iq-routing/domains_all.lst > blocked_2.txt
          
          sed -i 's/\r//g' blocked_1.txt blocked_2.txt
          cat blocked_1.txt blocked_2.txt | awk '{print $1}' | awk 'NF' | sort -u > data/ru-blocked
          
          # Убираем временные файлы
          rm -f ru_1.txt ru_2.txt ru_raw.txt ru_clean.txt ru_filtered.txt blocked_1.txt blocked_2.txt
          
          # ВКЛЮЧАЕМ проверку ошибок обратно перед компиляцией
          set -e

      - name: Compile optimized geosite.dat
        run: |
          cd domain-list-community
          go run main.go -datapath=./data -exportlists=ru,ru-blocked
          mv dlc.dat ../geosite_optimized.dat

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-optimized
          name: "Optimized Geosite (RU + Blocked)"
          files: geosite_optimized.dat
          body: "Содержит категорию 'ru' (СНГ TLD + все домены РФ без мусора) и 'ru-blocked' (Antifilter + Re:filter)."
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
