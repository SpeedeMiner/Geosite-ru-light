name: Build Ultimate Light Geosite

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Clone domain-list-community
        run: git clone https://github.com/v2fly/domain-list-community.git

      - name: Prepare Clean Data Directory
        run: |
          cd domain-list-community
          # 1. Удаляем ВСЁ из папки data. Никаких чужих файлов и битых ссылок.
          rm -rf data/*
          
          echo "==== BUILDING RU DIRECT ===="
          # 2. Скачиваем плоский (скомпилированный в текст) список ВСЕХ RU-доменов v2fly.
          # Это решает проблему пропавших файлов и ссылок include:
          curl -sLf https://raw.githubusercontent.com/v2fly/domain-list-community/release/geosite.dat > /dev/null || true
          curl -sLf https://raw.githubusercontent.com/v2fly/domain-list-community/release/category-ru-whitelist.txt > ru_raw.txt || echo "" > ru_raw.txt
          curl -sLf https://raw.githubusercontent.com/v2fly/domain-list-community/release/ru.txt >> ru_raw.txt || true
          
          # 3. Чистим скачанный файл: убираем \r, оставляем только домены, убираем пустые строки
          sed -i 's/\r//g' ru_raw.txt
          awk '{print $1}' ru_raw.txt | awk 'NF' | grep -v '^#' > ru_clean.txt
          
          # 4. Вырезаем все домены с окончаниями .ru, .su, .by, .ua, .xn--p1ai
          grep -viE '\.(ru|su|by|ua|xn--p1ai)$' ru_clean.txt > ru_filtered.txt || true
          
          # 5. Собираем финальный файл data/ru
          echo -e "ru\nsu\nxn--p1ai\nby\nua" > data/ru
          sort -u ru_filtered.txt >> data/ru
          
          echo "==== BUILDING RU BLOCKED ===="
          # 6. Скачиваем списки блокировок
          curl -sLf https://community.antifilter.download/list/domains.lst > blocked_1.txt || echo "" > blocked_1.txt
          curl -sLf https://raw.githubusercontent.com/1andrevich/Re-filter-lists/iq-routing/domains_all.lst > blocked_2.txt || echo "" > blocked_2.txt
          
          # 7. Чистим от \r и пустых строк, сливаем в data/ru-blocked
          sed -i 's/\r//g' blocked_1.txt blocked_2.txt
          cat blocked_1.txt blocked_2.txt | awk '{print $1}' | awk 'NF' | sort -u > data/ru-blocked
          
          # Убираем временные файлы
          rm -f ru_raw.txt ru_clean.txt ru_filtered.txt blocked_1.txt blocked_2.txt

      - name: Compile optimized geosite.dat
        run: |
          cd domain-list-community
          # 8. Компилируем только 2 файла, которые мы создали своими руками
          go run main.go -datapath=./data -exportlists=ru,ru-blocked
          mv dlc.dat ../geosite_optimized.dat

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-optimized
          name: "Optimized Geosite (RU + Blocked)"
          files: geosite_optimized.dat
          body: "Содержит категорию 'ru' (СНГ TLD + все домены РФ без мусора) и 'ru-blocked' (Antifilter + Re:filter)."
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
