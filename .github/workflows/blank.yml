name: Build Ultimate Light RU Geosite

concurrency:
  group: build-ultimate-light-ru-geosite
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    # Каждый понедельник в 00:00 UTC
    - cron: "0 0 * * 1"
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      # Актуальная полная GeoSite-база runetfreedom
      GEOSITE_URL: https://raw.githubusercontent.com/runetfreedom/russia-blocked-geosite/release/geosite.dat
      GEOSITE_SHA_URL: https://raw.githubusercontent.com/runetfreedom/russia-blocked-geosite/release/geosite.dat.sha256sum

      HYDRA_GEOSITE_URL: https://github.com/hydraponique/roscomvpn-geosite/releases/latest/download/geosite.dat
      GRIMBIRD_GEOSITE_URL: https://raw.githubusercontent.com/GrimbirdUsers/ru-routing-dat/main/geosite.dat
      MVR_GEOSITE_URL: https://raw.githubusercontent.com/mvrvntn/routing/release/geosite.dat
      YULARZHI_GEOSITE_URL: https://github.com/Yularzhi/geosite_russia/releases/latest/download/geosite.dat
      VPNYASHA_GEOSITE_URL: https://raw.githubusercontent.com/vpnyasha/geosite/main/geosite.dat
      KIRILL_GEOSITE_URL: https://github.com/kirilllavrov/RU-domain-list-for-whitelist/releases/latest/download/dlc.dat
      DIGNE_GEOSITE_URL: https://cdn.jsdelivr.net/gh/DigneZzZ/routing@main/v2ray/geosite.dat
      DAVOYAN_LEGACY_URL: https://raw.githubusercontent.com/Davoyan/mihomo-rule-sets/main/domains/category-ru-legacy.txt

      # Positive-only RU allow-pool enrichments. These are NOT refilter/block feeds.
      GOLUKON_AVAILABLE_URL: https://raw.githubusercontent.com/golukon/domains-only-russia/main/ru-available-only-inside
      MOBILE_WHITELIST_URL: https://raw.githubusercontent.com/golukon/russia-mobile-internet-whitelist/main/whitelist.txt
      DAVIDDT_RU_SUFFIX_URL: https://raw.githubusercontent.com/daviddt369/ru-not-ru-domain/main/rules/ru-domain-suffix.txt
      DMITRIY_ENRICH_URL: https://raw.githubusercontent.com/Dmitriy9000/russia-minimal-geosite/main/enrich/ru-available-only-inside
      W1ZARDZ_RU_DIRECT_URL: https://raw.githubusercontent.com/w1zardz/amnezia-vpn-russia-split-tunneling/master/dist/ru-direct-domains.txt
      SUPERTICO_DOMAINS_URL: https://raw.githubusercontent.com/supertico/linux-split-dns-for-amnezia-ru/main/z_russian_websites.txt

      INPUT_FILE: source-geosite.dat
      HYDRA_INPUT_FILE: hydra-geosite.dat
      GRIMBIRD_INPUT_FILE: grimbird-geosite.dat
      MVR_INPUT_FILE: mvrvntn-geosite.dat
      YULARZHI_INPUT_FILE: yularzhi-geosite.dat
      VPNYASHA_INPUT_FILE: vpnyasha-geosite.dat
      KIRILL_INPUT_FILE: kirill-geosite.dat
      DIGNE_INPUT_FILE: digne-geosite.dat
      DAVOYAN_LEGACY_INPUT_FILE: davoyan-category-ru-legacy.txt
      GOLUKON_AVAILABLE_INPUT_FILE: golukon-ru-available-only-inside.txt
      MOBILE_WHITELIST_INPUT_FILE: mobile-whitelist.txt
      DAVIDDT_RU_SUFFIX_INPUT_FILE: daviddt-ru-domain-suffix.txt
      DMITRIY_ENRICH_INPUT_FILE: dmitriy-ru-available-only-inside.txt
      W1ZARDZ_RU_DIRECT_INPUT_FILE: w1zardz-ru-direct-domains.txt
      SUPERTICO_DOMAINS_INPUT_FILE: supertico-russian-websites.txt
      # Локальные ручные списки доменов
      LOCAL_RU_INPUT_FILE: local/ru.txt
      LOCAL_BLOCK_INPUT_FILE: local/block.txt
      OUTPUT_FILE: geosite_RU.dat
      CATEGORY_FILE: geosite_RU_categories.txt
      HYDRA_APPEND_FILE: geosite_RU_hydra_appended_categories.txt
      OUTPUT_SHA_FILE: geosite_RU.dat.sha256sum
      NEW_SOURCES_REPORT_FILE: geosite_RU_new_sources.txt

    steps:
      # ------------------------------------------------------------
      # 1. Repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # 2. Clone current domain-list-community
      # ------------------------------------------------------------
      - name: Clone domain-list-community
        uses: actions/checkout@v4
        with:
          repository: v2fly/domain-list-community
          path: domain-list-community
          fetch-depth: 1

      # ------------------------------------------------------------
      # 3. Setup Go according to current domain-list-community
      # ------------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: domain-list-community/go.mod
          cache-dependency-path: domain-list-community/go.sum

      # ------------------------------------------------------------
      # 4. Download source geosite.dat
      # ------------------------------------------------------------
      - name: Download source GeoSite files
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "Downloading GeoSite sources"
          echo "========================================"

          download_source() {
            local label="$1"
            local url="$2"
            local output="$3"

            echo "--- $label"
            echo "URL: $url"
            rm -f "$output"

            if ! curl -fsSL \
              --connect-timeout 20 \
              --max-time 300 \
              --retry 5 \
              --retry-delay 2 \
              --retry-max-time 180 \
              "$url" -o "$output"; then
              echo "ERROR: download failed: $label" >&2
              echo "ERROR: URL: $url" >&2
              rm -f "$output"
              return 1
            fi

            if ! test -s "$output"; then
              echo "ERROR: downloaded file is empty: $label" >&2
              rm -f "$output"
              return 1
            fi

            ls -lh "$output"
          }

          download_source "runetfreedom GeoSite" "$GEOSITE_URL" "$INPUT_FILE"
          download_source "runetfreedom SHA256" "$GEOSITE_SHA_URL" source-geosite.dat.sha256sum
          download_source "Hydra GeoSite" "$HYDRA_GEOSITE_URL" "$HYDRA_INPUT_FILE"
          download_source "Grimbird GeoSite" "$GRIMBIRD_GEOSITE_URL" "$GRIMBIRD_INPUT_FILE"
          download_source "mvrvntn GeoSite" "$MVR_GEOSITE_URL" "$MVR_INPUT_FILE"
          download_source "Yularzhi GeoSite" "$YULARZHI_GEOSITE_URL" "$YULARZHI_INPUT_FILE"
          download_source "vpnyasha GeoSite" "$VPNYASHA_GEOSITE_URL" "$VPNYASHA_INPUT_FILE"
          download_source "Kirill GeoSite" "$KIRILL_GEOSITE_URL" "$KIRILL_INPUT_FILE"
          download_source "Digne GeoSite" "$DIGNE_GEOSITE_URL" "$DIGNE_INPUT_FILE"
          download_source "Davoyan legacy" "$DAVOYAN_LEGACY_URL" "$DAVOYAN_LEGACY_INPUT_FILE"
          download_source "Golukon RU available" "$GOLUKON_AVAILABLE_URL" "$GOLUKON_AVAILABLE_INPUT_FILE"
          download_source "Mobile whitelist" "$MOBILE_WHITELIST_URL" "$MOBILE_WHITELIST_INPUT_FILE"
          download_source "Daviddt RU suffix" "$DAVIDDT_RU_SUFFIX_URL" "$DAVIDDT_RU_SUFFIX_INPUT_FILE"
          download_source "Dmitriy enrich" "$DMITRIY_ENRICH_URL" "$DMITRIY_ENRICH_INPUT_FILE"
          download_source "W1ZARDZ RU direct domains" "$W1ZARDZ_RU_DIRECT_URL" "$W1ZARDZ_RU_DIRECT_INPUT_FILE"
          download_source "SuperTico Russian websites" "$SUPERTICO_DOMAINS_URL" "$SUPERTICO_DOMAINS_INPUT_FILE"

          test -s "$INPUT_FILE"
          test -s source-geosite.dat.sha256sum
          test -s "$HYDRA_INPUT_FILE"
          test -s "$GRIMBIRD_INPUT_FILE"
          test -s "$MVR_INPUT_FILE"
          test -s "$YULARZHI_INPUT_FILE"
          test -s "$VPNYASHA_INPUT_FILE"
          test -s "$KIRILL_INPUT_FILE"
          test -s "$DIGNE_INPUT_FILE"
          test -s "$DAVOYAN_LEGACY_INPUT_FILE"
          test -s "$GOLUKON_AVAILABLE_INPUT_FILE"
          test -s "$MOBILE_WHITELIST_INPUT_FILE"
          test -s "$DAVIDDT_RU_SUFFIX_INPUT_FILE"
          test -s "$DMITRIY_ENRICH_INPUT_FILE"
          test -s "$W1ZARDZ_RU_DIRECT_INPUT_FILE"
          test -s "$SUPERTICO_DOMAINS_INPUT_FILE"
          test -f "$LOCAL_RU_INPUT_FILE"
          test -f "$LOCAL_BLOCK_INPUT_FILE"

          echo "Local RU list    : $LOCAL_RU_INPUT_FILE"
          echo "Local BLOCK list : $LOCAL_BLOCK_INPUT_FILE"

          echo
          echo "========================================"
          echo "Verifying SHA256 of runetfreedom source"
          echo "========================================"

          EXPECTED_SHA256="$(awk 'NF {print $1; exit}' source-geosite.dat.sha256sum)"
          ACTUAL_SHA256="$(sha256sum "$INPUT_FILE" | awk '{print $1}')"

          echo "Expected: $EXPECTED_SHA256"
          echo "Actual:   $ACTUAL_SHA256"

          if [ "$EXPECTED_SHA256" != "$ACTUAL_SHA256" ]; then
            echo "ERROR: SHA256 mismatch for runetfreedom source!"
            exit 1
          fi

          echo "SHA256 verification OK."

          echo
          echo "Downloaded sources:"
          ls -lh "$INPUT_FILE" "$HYDRA_INPUT_FILE" "$GRIMBIRD_INPUT_FILE" "$MVR_INPUT_FILE" "$YULARZHI_INPUT_FILE" "$VPNYASHA_INPUT_FILE" "$KIRILL_INPUT_FILE" "$DIGNE_INPUT_FILE" "$DAVOYAN_LEGACY_INPUT_FILE" \
            "$GOLUKON_AVAILABLE_INPUT_FILE" "$MOBILE_WHITELIST_INPUT_FILE" "$DAVIDDT_RU_SUFFIX_INPUT_FILE" "$DMITRIY_ENRICH_INPUT_FILE" \
            "$W1ZARDZ_RU_DIRECT_INPUT_FILE" "$SUPERTICO_DOMAINS_INPUT_FILE"

      # ------------------------------------------------------------
      # 5. Build RU category manifest from the current v2fly tree
      # ------------------------------------------------------------
      - name: Build RU category manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          DATA = Path("domain-list-community/data")
          output = Path("selected_ru_categories.txt")

          selected = set()
          visited = set()
          missing_v2fly = set()

          # These are negative / non-RU categories. They must be blocked before
          # recursion so their children can never leak into the RU manifest.
          excluded = {
              "private",
              "category-ip-geo-detect",
              "ipip",
              "tld-ru",
              "category-geoblock-ru",
          }

          def normalize(name: str) -> str:
              return name.strip().lower()

          def is_excluded(name: str) -> bool:
              name = normalize(name)
              if not name:
                  return True
              if name in excluded:
                  return True
              if any(marker in name for marker in ("blocked", "geoblock", "re-filter", "refilter")):
                  return True
              if re.search(r"(^|[-_.])ban([-_.]|$)", name):
                  return True
              return False

          def visit(name: str):
              name = normalize(name)

              if not name or name in visited or is_excluded(name):
                  return

              visited.add(name)
              path = DATA / name

              if not path.is_file():
                  missing_v2fly.add(name)
                  return

              selected.add(f"runetfreedom|{name}")

              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  return

              for raw_line in text.splitlines():
                  line = raw_line.split("#", 1)[0].strip()
                  if not line:
                      continue

                  if line.lower().startswith("include:"):
                      payload = line.split(":", 1)[1].strip()
                      parts = payload.split()
                      # Do not promote selective includes (for example,
                      # "include:foo @ads") into a whole standalone category.
                      # The selected parent category already exists in the source
                      # DAT with its resolved rules and attributes.
                      if len(parts) != 1:
                          continue
                      target = parts[0]
                      if re.fullmatch(r"[A-Za-z0-9_.!+-]+", target):
                          visit(target)

          # Основное ядро runetfreedom / v2fly
          visit("category-ru")

          # Автоматически подхватываем новые *-ru категории, кроме negative feeds.
          for path in DATA.iterdir():
              if (
                  path.is_file()
                  and path.name.lower().endswith("-ru")
                  and not is_excluded(path.name)
              ):
                  visit(path.name)

          # Optional standalone compatibility categories. Older versions of the upstream data
          # used many service names as separate files; current v2fly consolidates
          # a number of them into category-ru or its subcategories. Therefore a
          # missing optional file is NOT a build error. Real data coverage comes
          # from the resolved category-ru tree and the dedicated external sources
          # below (Kirill, Grimbird, etc.).
          extra_categories = {
              "2gis", "aviasales", "autoru", "avito", "dzen", "kinopoisk",
              "mailru", "mailru-group", "max", "mosmetro", "mts", "ok", "okko",
              "ozon", "rutube", "sokolov", "wildberries", "wb", "wink", "x5",
              "yandex",
              "beget", "carrotquest", "cdek", "comssone", "drweb", "envybox",
              "gismeteo", "group-ib", "headhunter", "ideco-ru", "kaspersky", "kontur",
              "mindbox", "myoffice-ru", "netcraze", "nic-ru", "positive-technologies",
              "regru", "selectel", "servicepipe", "skyeng", "smena", "tilda",
              "timeweb", "ucoz", "whoosh",
              "megafon", "mts-ru", "rostelecom", "t2-ru",
          }

          optional_missing = []
          for name in sorted(extra_categories):
              normalized = normalize(name)
              path = DATA / normalized
              if path.is_file():
                  visit(normalized)
              else:
                  optional_missing.append(normalized)

          # A missing include referenced by an existing v2fly category is a real
          # integrity error; a missing optional standalone service file is only a
          # compatibility/staleness notice.
          if missing_v2fly:
              print()
              print("ERROR: required v2fly include categories are missing:")
              for name in sorted(missing_v2fly):
                  print(f"  - {name}")
              raise SystemExit(1)

          print()
          print(f"Optional standalone categories present: {len(extra_categories) - len(optional_missing)}/{len(extra_categories)}")
          if optional_missing:
              print("Optional standalone categories absent in current v2fly data (not fatal):")
              for name in optional_missing:
                  print(f"  - {name}")

          selected = {
              item
              for item in selected
              if not is_excluded(item.split("|", 1)[1])
          }

          # hydraponique/roscomvpn-geosite
          hydra_categories = {
              "whitelist",
              "private",
              "category-ru",
          }
          for name in hydra_categories:
              selected.add(f"hydra|{normalize(name)}")

          # mvrvntn/routing — только CATEGORY-RU добавляется в общий RU
          mvr_categories = {
              "category-ru",
          }
          for name in mvr_categories:
              selected.add(f"mvrvntn|{normalize(name)}")

          # Yularzhi/geosite_russia — CATEGORY-RU и PRIVATE добавляются в общий RU
          yularzhi_categories = {
              "category-ru",
              "private",
          }
          for name in yularzhi_categories:
              selected.add(f"yularzhi|{normalize(name)}")

          # vpnyasha/geosite — RU-focused enriched categories
          vpnyasha_categories = {
              "our-whitelist",
              "our-category-ru",
              "our-geoblock-ru",
              "our-games",
          }
          for name in vpnyasha_categories:
              selected.add(f"vpnyasha|{normalize(name)}")

          # kirilllavrov/RU-domain-list-for-whitelist
          kirill_categories = {
              "category-ru",
          }
          for name in kirill_categories:
              selected.add(f"kirill|{normalize(name)}")

          # DigneZzZ/routing — только category-ru
          digne_categories = {
              "category-ru",
          }
          for name in digne_categories:
              selected.add(f"digne|{normalize(name)}")

          # GrimbirdUsers/ru-routing-dat
          grimbird_categories = {
              "category-ru-whitelist",
              "ozon",
              "ru-analytics",
              "ru-cdn",
              "ru-finance",
              "ru-medical",
              "ru-retail-extra",
              "ru-transport",
              "ru-tv",
              "ru-whitelist-extended",
              "swift",
          }
          for name in grimbird_categories:
              selected.add(f"grimbird|{normalize(name)}")

          selected = {
              item for item in selected
              if item and item.split("|", 1)[1]
              and not item.split("|", 1)[1].startswith(".")
          }

          with output.open("w", encoding="utf-8") as f:
              for item in sorted(selected):
                  f.write(item + "\n")

          # Отдельный порядок категорий Hydra, которые НЕ вливаются в RU
          hydra_append_categories = [
              "apple",
              "epicgames",
              "escapefromtarkov",
              "faceit",
              "github",
              "google-deepmind",
              "google-play",
              "microsoft",
              "pinterest",
              "riot",
              "steam",
              "telegram",
              "twitch",
              "twitch-ads",
              "youtube",
              "win-spy",
          ]

          append_output = Path("hydra_append_categories.txt")
          append_output.write_text(
              "\n".join(f"hydra|{name}" for name in hydra_append_categories) + "\n",
              encoding="utf-8",
          )

          print()
          print("========================================")
          print("RU CATEGORY MANIFEST")
          print("========================================")
          print(f"Manifest entries: {len(selected)}")
          print(f"Manifest written to: {output}")
          print(f"Excluded negative categories: {len(excluded)} + pattern rules")
          PY

          cp selected_ru_categories.txt "$CATEGORY_FILE"
          cp hydra_append_categories.txt "$HYDRA_APPEND_FILE"

      # ------------------------------------------------------------
      # 6. Create protobuf filter
      # ------------------------------------------------------------
      - name: Create RU GeoSite protobuf filter
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p domain-list-community/tools/ru-geosite-filter

          cat > domain-list-community/tools/ru-geosite-filter/main.go <<'EOF'
          package main

          import (
              "bufio"
              "fmt"
              "os"
              "sort"
              "strings"

              router "github.com/v2fly/v2ray-core/v5/app/router/routercommon"
              "google.golang.org/protobuf/proto"
          )

          func normalizeName(value string) string {
              return strings.ToLower(strings.TrimSpace(value))
          }

          func isRussianTLD(value string) bool {
              value = normalizeName(value)
              value = strings.TrimSuffix(value, ".")
              value = strings.TrimPrefix(value, ".")

              switch value {
              case "ru", "su", "xn--p1ai", "рф":
                  return true
              }

              return strings.HasSuffix(value, ".ru") ||
                  strings.HasSuffix(value, ".su") ||
                  strings.HasSuffix(value, ".xn--p1ai") ||
                  strings.HasSuffix(value, ".рф")
          }

          func domainKey(domain *router.Domain) string {
              return fmt.Sprintf("%d|%s", domain.Type, normalizeName(domain.Value))
          }

          func pruneCoveredRootDomains(domains []*router.Domain) ([]*router.Domain, int) {
              roots := make(map[string]bool)
              for _, domain := range domains {
                  if domain == nil || domain.Type != router.Domain_RootDomain {
                      continue
                  }
                  value := normalizeName(domain.Value)
                  if value != "" {
                      roots[value] = true
                  }
              }

              result := make([]*router.Domain, 0, len(domains))
              removed := 0
              for _, domain := range domains {
                  if domain == nil || domain.Type != router.Domain_RootDomain {
                      result = append(result, domain)
                      continue
                  }

                  value := normalizeName(domain.Value)
                  covered := false
                  for parent := value; ; {
                      dot := strings.IndexByte(parent, '.')
                      if dot < 0 {
                          break
                      }
                      parent = parent[dot+1:]
                      if roots[parent] {
                          covered = true
                          break
                      }
                  }

                  if covered {
                      removed++
                      continue
                  }
                  result = append(result, domain)
              }
              return result, removed
          }

          func loadGeoSite(path string) (*router.GeoSiteList, error) {
              data, err := os.ReadFile(path)
              if err != nil {
                  return nil, err
              }

              list := new(router.GeoSiteList)
              if err := proto.Unmarshal(data, list); err != nil {
                  return nil, fmt.Errorf("invalid geosite %s: %w", path, err)
              }

              return list, nil
          }

          func loadManifest(path string) (map[string]map[string]bool, error) {
              file, err := os.Open(path)
              if err != nil {
                  return nil, err
              }
              defer file.Close()

              result := make(map[string]map[string]bool)
              scanner := bufio.NewScanner(file)

              for scanner.Scan() {
                  line := strings.TrimSpace(scanner.Text())
                  if line == "" || strings.HasPrefix(line, "#") {
                      continue
                  }

                  parts := strings.SplitN(line, "|", 2)
                  if len(parts) != 2 {
                      return nil, fmt.Errorf("invalid manifest entry: %q", line)
                  }

                  source := normalizeName(parts[0])
                  category := normalizeName(parts[1])
                  if source == "" || category == "" {
                      return nil, fmt.Errorf("invalid manifest entry: %q", line)
                  }

                  if result[source] == nil {
                      result[source] = make(map[string]bool)
                  }
                  result[source][category] = true
              }

              if err := scanner.Err(); err != nil {
                  return nil, err
              }

              return result, nil
          }

          func loadOrderedCategories(path string) ([]string, error) {
              file, err := os.Open(path)
              if err != nil {
                  return nil, err
              }
              defer file.Close()

              var categories []string
              scanner := bufio.NewScanner(file)

              for scanner.Scan() {
                  line := strings.TrimSpace(scanner.Text())
                  if line == "" || strings.HasPrefix(line, "#") {
                      continue
                  }

                  parts := strings.SplitN(line, "|", 2)
                  if len(parts) != 2 || normalizeName(parts[0]) != "hydra" {
                      return nil, fmt.Errorf("invalid Hydra append manifest entry: %q", line)
                  }

                  category := normalizeName(parts[1])
                  if category == "" {
                      return nil, fmt.Errorf("empty Hydra category in manifest: %q", line)
                  }

                  categories = append(categories, category)
              }

              if err := scanner.Err(); err != nil {
                  return nil, err
              }

              if len(categories) == 0 {
                  return nil, fmt.Errorf("Hydra append manifest is empty")
              }

              return categories, nil
          }

          func normalizeManualDomain(value string) string {
              value = strings.TrimSpace(strings.TrimPrefix(value, "-"))
              value = strings.TrimPrefix(value, "*.")
              value = normalizeName(value)
              value = strings.TrimSuffix(value, ".")
              return value
          }

          func isNumericOnly(value string) bool {
              if value == "" {
                  return false
              }
              for _, ch := range value {
                  if (ch < '0' || ch > '9') && ch != '.' {
                      return false
                  }
              }
              return true
          }

          func loadDomainList(path string, requireNonEmpty bool, label string) ([]string, error) {
              file, err := os.Open(path)
              if err != nil {
                  return nil, err
              }
              defer file.Close()

              var domains []string
              seen := make(map[string]bool)
              scanner := bufio.NewScanner(file)

              for scanner.Scan() {
                  line := strings.TrimSpace(strings.TrimPrefix(scanner.Text(), "\ufeff"))
                  if line == "" || strings.HasPrefix(line, "#") {
                      continue
                  }
                  if idx := strings.IndexByte(line, '#'); idx >= 0 {
                      line = strings.TrimSpace(line[:idx])
                  }
                  if line == "" {
                      continue
                  }

                  upper := strings.ToUpper(line)
                  for _, prefix := range []string{"DOMAIN-SUFFIX,", "DOMAIN-FULL,", "DOMAIN,"} {
                      if strings.HasPrefix(upper, prefix) {
                          line = strings.TrimSpace(line[len(prefix):])
                          break
                      }
                  }
                  for _, prefix := range []string{"DOMAIN-KEYWORD,", "DOMAIN-REGEX,", "DOMAIN-WILDCARD,"} {
                      if strings.HasPrefix(upper, prefix) {
                          line = ""
                          break
                      }
                  }
                  if line == "" {
                      continue
                  }

                  for _, prefix := range []string{"domain:", "full:"} {
                      if strings.HasPrefix(strings.ToLower(line), prefix) {
                          line = strings.TrimSpace(line[len(prefix):])
                          break
                      }
                  }

                  line = normalizeManualDomain(line)

                  if line == "" || strings.ContainsAny(line, " \t:/\\[](){}|$") || isNumericOnly(line) {
                      continue
                  }

                  if seen[line] {
                      continue
                  }
                  seen[line] = true
                  domains = append(domains, line)
              }

              if err := scanner.Err(); err != nil {
                  return nil, err
              }
              if len(domains) == 0 && requireNonEmpty {
                  return nil, fmt.Errorf("%s domain list is empty", label)
              }
              return domains, nil
          }

          func loadBlockDomainList(path string, requireNonEmpty bool) ([]*router.Domain, error) {
              file, err := os.Open(path)
              if err != nil {
                  return nil, err
              }
              defer file.Close()

              var domains []*router.Domain
              seen := make(map[string]bool)
              scanner := bufio.NewScanner(file)

              for scanner.Scan() {
                  line := strings.TrimSpace(strings.TrimPrefix(scanner.Text(), "\ufeff"))
                  if line == "" || strings.HasPrefix(line, "#") {
                      continue
                  }
                  if idx := strings.IndexByte(line, '#'); idx >= 0 {
                      line = strings.TrimSpace(line[:idx])
                  }
                  if line == "" {
                      continue
                  }

                  domainType := router.Domain_RootDomain
                  lower := strings.ToLower(line)
                  upper := strings.ToUpper(line)

                  switch {
                  case strings.HasPrefix(upper, "DOMAIN-SUFFIX,"):
                      line = strings.TrimSpace(line[len("DOMAIN-SUFFIX,"):])
                      domainType = router.Domain_RootDomain
                  case strings.HasPrefix(upper, "DOMAIN-FULL,"):
                      line = strings.TrimSpace(line[len("DOMAIN-FULL,"):])
                      domainType = router.Domain_Full
                  case strings.HasPrefix(upper, "DOMAIN,"):
                      line = strings.TrimSpace(line[len("DOMAIN,"):])
                      domainType = router.Domain_RootDomain
                  case strings.HasPrefix(lower, "domain:"):
                      line = strings.TrimSpace(line[len("domain:"):])
                      domainType = router.Domain_RootDomain
                  case strings.HasPrefix(lower, "full:"):
                      line = strings.TrimSpace(line[len("full:"):])
                      domainType = router.Domain_Full
                  case strings.HasPrefix(upper, "DOMAIN-KEYWORD,"),
                      strings.HasPrefix(upper, "DOMAIN-REGEX,"),
                      strings.HasPrefix(upper, "DOMAIN-WILDCARD,"):
                      continue
                  }

                  line = normalizeManualDomain(line)

                  if line == "" || strings.ContainsAny(line, " \t:/\\[](){}|$") || isNumericOnly(line) {
                      continue
                  }

                  key := fmt.Sprintf("%d|%s", domainType, line)
                  if seen[key] {
                      continue
                  }
                  seen[key] = true
                  domains = append(domains, &router.Domain{
                      Type:  domainType,
                      Value: line,
                  })
              }

              if err := scanner.Err(); err != nil {
                  return nil, err
              }
              if len(domains) == 0 && requireNonEmpty {
                  return nil, fmt.Errorf("local BLOCK domain list is empty")
              }
              return domains, nil
          }

          func isCoveredByRoots(value string, roots map[string]bool) bool {
              value = normalizeName(value)
              if value == "" {
                  return false
              }

              if roots[value] {
                  return true
              }

              for parent := value; ; {
                  dot := strings.IndexByte(parent, '.')
                  if dot < 0 {
                      break
                  }
                  parent = parent[dot+1:]
                  if roots[parent] {
                      return true
                  }
              }

              return false
          }

          // Compare a positive-only source against the RU set that already exists
          // before enrichment. The comparison is parent-aware: foo.example.com is
          // already covered when example.com is present. The returned list is
          // source-local, so the same NEW domain can legitimately appear in more
          // than one source section in the report.
          func collectNewPositiveSource(
              path string,
              baseRoots map[string]bool,
          ) (values []string, sourceLines int, skippedRussianTLD int, err error) {
              sourceValues, err := loadDomainList(path, true, path)
              if err != nil {
                  return nil, 0, 0, err
              }

              // Deterministic order: parent roots before deeper hostnames.
              sort.Slice(sourceValues, func(i, j int) bool {
                  di := strings.Count(sourceValues[i], ".")
                  dj := strings.Count(sourceValues[j], ".")
                  if di != dj {
                      return di < dj
                  }
                  return sourceValues[i] < sourceValues[j]
              })

              seen := make(map[string]bool)
              for _, raw := range sourceValues {
                  sourceLines++
                  value := normalizeName(raw)
                  if value == "" {
                      continue
                  }
                  if isRussianTLD(value) {
                      skippedRussianTLD++
                      continue
                  }
                  // Do not allow bare TLD/hostname labels such as "com" into RU.
                  if !strings.Contains(value, ".") {
                      continue
                  }

                  if seen[value] {
                      continue
                  }
                  seen[value] = true

                  if isCoveredByRoots(value, baseRoots) {
                      continue
                  }

                  values = append(values, value)
              }

              return values, sourceLines, skippedRussianTLD, nil
          }

          func appendDomainStrings(category *router.GeoSite, values []string, seen map[string]bool, skipRussianTLD bool) (written, duplicates, removedRussian int) {
              for _, value := range values {
                  value = normalizeName(value)
                  if value == "" {
                      continue
                  }
                  if skipRussianTLD && isRussianTLD(value) {
                      removedRussian++
                      continue
                  }
                  cleaned := &router.Domain{
                      Type:  router.Domain_RootDomain,
                      Value: value,
                  }
                  key := domainKey(cleaned)
                  if seen[key] {
                      duplicates++
                      continue
                  }
                  seen[key] = true
                  category.Domain = append(category.Domain, cleaned)
                  written++
              }
              return
          }

          func main() {
              // 0=program, 1..21=input/output. Keep the indexes explicit because
              // this command has many positional arguments and an off-by-one here
              // can overwrite an input file instead of producing the DAT.
              const outputArg = 21
              const reportArg = 20

              if len(os.Args) != outputArg+1 {
                  fmt.Fprintf(
                      os.Stderr,
                      "usage: %s runetfreedom.dat hydra.dat grimbird.dat mvrvntn.dat yularzhi.dat vpnyasha.dat kirill.dat digne.dat davoyan-legacy.txt selected.txt hydra_append.txt local-ru.txt local-block.txt golukon-available.txt mobile-whitelist.txt daviddt-ru-suffix.txt dmitriy-enrich.txt w1zardz-ru-direct.txt supertico-domains.txt new-positive-report.txt output.dat\n",
                      os.Args[0],
                  )
                  os.Exit(2)
              }

              sources := map[string]string{
                  "runetfreedom": os.Args[1],
                  "hydra":        os.Args[2],
                  "grimbird":     os.Args[3],
                  "mvrvntn":      os.Args[4],
                  "yularzhi":     os.Args[5],
                  "vpnyasha":     os.Args[6],
                  "kirill":       os.Args[7],
                  "digne":        os.Args[8],
              }

              legacyDomains, err := loadDomainList(os.Args[9], true, "Davoyan legacy")
              if err != nil {
                  panic(fmt.Errorf("failed to read Davoyan legacy list: %w", err))
              }

              localRUDomains, err := loadDomainList(os.Args[12], false, "local RU")
              if err != nil {
                  panic(fmt.Errorf("failed to read local RU list: %w", err))
              }

              localBlockDomains, err := loadBlockDomainList(os.Args[13], false)
              if err != nil {
                  panic(fmt.Errorf("failed to read local BLOCK list: %w", err))
              }

              positiveExtras := []struct {
                  name string
                  path string
              }{
                  {"golukon-ru-available-only-inside", os.Args[14]},
                  {"mobile-whitelist", os.Args[15]},
                  {"daviddt-ru-domain-suffix", os.Args[16]},
                  {"dmitriy-ru-available-only-inside", os.Args[17]},
                  {"w1zardz-ru-direct-domains", os.Args[18]},
                  {"supertico-russian-websites", os.Args[19]},
              }

              manifest, err := loadManifest(os.Args[10])
              if err != nil {
                  panic(fmt.Errorf("failed to read manifest: %w", err))
              }

              lists := make(map[string]*router.GeoSiteList)
              for source, path := range sources {
                  list, err := loadGeoSite(path)
                  if err != nil {
                      panic(err)
                  }
                  lists[source] = list
              }

              result := new(router.GeoSiteList)
              ruCategory := &router.GeoSite{CountryCode: "RU"}
              blockCategory := &router.GeoSite{CountryCode: "BLOCK"}
              globalSeen := make(map[string]bool)
              blockSeen := make(map[string]bool)

              sourceCategoryCount := 0
              sourceDomainCount := 0
              writtenDomainCount := 0
              duplicateDomainCount := 0
              removedRussianDomainCount := 0
              removedUnsupportedTypeCount := 0
              convertedFullToRootCount := 0
              removedCoveredDomainCount := 0
              localRUDomainCount := 0
              localRUDuplicateCount := 0
              localRUFilteredTLDCount := 0
              localBlockDomainCount := 0
              localBlockDuplicateCount := 0
              removedCoveredBlockDomainCount := 0
              missingExternalCount := 0

              newPositiveReportPath := os.Args[reportArg]
              outputPath := os.Args[outputArg]

              // Only input arguments may collide with the output path/report path.
              // Do not compare a path with itself at reportArg/outputArg.
              for i := 1; i < reportArg; i++ {
                  if os.Args[i] == outputPath {
                      panic(fmt.Sprintf("output path collides with input argument %d: %s", i, outputPath))
                  }
                  if os.Args[i] == newPositiveReportPath {
                      panic(fmt.Sprintf("report path collides with input argument %d: %s", i, newPositiveReportPath))
                  }
              }

              matched := make(map[string]map[string]bool)
              for source := range sources {
                  matched[source] = make(map[string]bool)
              }

              for source, selectedCategories := range manifest {
                  list, ok := lists[source]
                  if !ok {
                      panic(fmt.Sprintf("unknown source in manifest: %s", source))
                  }

                  for _, site := range list.Entry {
                      if site == nil {
                          continue
                      }

                      category := normalizeName(site.CountryCode)
                      if !selectedCategories[category] {
                          continue
                      }

                      matched[source][category] = true
                      sourceCategoryCount++

                      for _, domain := range site.Domain {
                          if domain == nil {
                              continue
                          }

                          sourceDomainCount++

                          switch domain.Type {
                          case router.Domain_RootDomain:
                          case router.Domain_Full:
                              convertedFullToRootCount++
                          default:
                              removedUnsupportedTypeCount++
                              continue
                          }

                          value := normalizeName(domain.Value)
                          if value == "" {
                              continue
                          }

                          if isRussianTLD(value) {
                              removedRussianDomainCount++
                              continue
                          }

                          cleaned := &router.Domain{
                              Type:  router.Domain_RootDomain,
                              Value: value,
                          }

                          key := domainKey(cleaned)
                          if globalSeen[key] {
                              duplicateDomainCount++
                              continue
                          }

                          globalSeen[key] = true
                          ruCategory.Domain = append(ruCategory.Domain, cleaned)
                          writtenDomainCount++
                      }
                  }
              }

              for _, source := range []string{"hydra", "grimbird", "mvrvntn", "yularzhi", "vpnyasha", "kirill", "digne"} {
                  for category := range manifest[source] {
                      if !matched[source][category] {
                          fmt.Printf(
                              "WARNING: requested external category %s|%s was not found in source DAT\n",
                              source,
                              category,
                          )
                          missingExternalCount++
                      }
                  }
              }

              if missingExternalCount > 0 {
                  panic(fmt.Sprintf(
                      "required external categories missing: %d",
                      missingExternalCount,
                  ))
              }

              legacyDomainCount := len(legacyDomains)
              legacyWritten, legacyDuplicateCount, legacyFilteredTLD := appendDomainStrings(ruCategory, legacyDomains, globalSeen, true)
              writtenDomainCount += legacyWritten
              duplicateDomainCount += legacyDuplicateCount
              removedRussianDomainCount += legacyFilteredTLD

              localRUDomainCount, localRUDuplicateCount, localRUFilteredTLDCount = appendDomainStrings(ruCategory, localRUDomains, globalSeen, true)
              writtenDomainCount += localRUDomainCount
              duplicateDomainCount += localRUDuplicateCount
              removedRussianDomainCount += localRUFilteredTLDCount

              for _, domain := range localBlockDomains {
                  if domain == nil || normalizeName(domain.Value) == "" {
                      continue
                  }

                  cleaned := &router.Domain{
                      Type:  domain.Type,
                      Value: normalizeManualDomain(domain.Value),
                  }

                  key := domainKey(cleaned)
                  if blockSeen[key] {
                      localBlockDuplicateCount++
                      continue
                  }

                  blockSeen[key] = true
                  blockCategory.Domain = append(blockCategory.Domain, cleaned)
                  localBlockDomainCount++
              }

              for _, value := range []string{"ru", "xn--p1ai", "su"} {
                  key := fmt.Sprintf("%d|%s", router.Domain_RootDomain, value)
                  if !globalSeen[key] {
                      globalSeen[key] = true
                      ruCategory.Domain = append(ruCategory.Domain, &router.Domain{
                          Type:  router.Domain_RootDomain,
                          Value: value,
                      })
                      writtenDomainCount++
                  }
              }

              // ----------------------------------------------------------
              // Positive-only enrichment: compare each new source with the
              // current RU pool before adding it. No refilter/block source is
              // consumed here. The report contains only addresses that were
              // genuinely absent from the current RU pool at build start.
              // ----------------------------------------------------------
              report, err := os.Create(newPositiveReportPath)
              if err != nil {
                  panic(fmt.Errorf("failed to create positive-source report: %w", err))
              }
              defer report.Close()

              fmt.Fprintln(report, "# Positive-only RU source delta")
              fmt.Fprintln(report, "# NEW = source domain not covered by the pre-enrichment RU root-domain set")
              fmt.Fprintln(report, "# refilter/block/negative feeds are intentionally excluded")
              fmt.Fprintln(report)

              baseRoots := make(map[string]bool)
              for _, domain := range ruCategory.Domain {
                  if domain != nil && domain.Type == router.Domain_RootDomain {
                      value := normalizeName(domain.Value)
                      if value != "" {
                          baseRoots[value] = true
                      }
                  }
              }

              totalPositiveNew := 0
              totalPositiveAdded := 0
              totalPositiveInput := 0
              totalPositiveTLD := 0

              // Starts with the pre-enrichment RU coverage. As positive sources are
              // merged, newly added root domains also cover their child hostnames.
              finalRoots := make(map[string]bool, len(baseRoots))
              for root := range baseRoots {
                  finalRoots[root] = true
              }

              for _, extra := range positiveExtras {
                  values, sourceLines, skippedTLD, err := collectNewPositiveSource(extra.path, baseRoots)
                  if err != nil {
                      panic(fmt.Errorf("failed positive source %s: %w", extra.name, err))
                  }

                  fmt.Fprintf(report, "\n[%s]\n", extra.name)
                  addedCount := 0

                  for _, value := range values {
                      // This line is NEW relative to the original RU pool and is
                      // therefore always printed under its source. It may still be
                      // covered by a parent added earlier from another positive source.
                      fmt.Fprintln(report, value)

                      key := fmt.Sprintf("%d|%s", router.Domain_RootDomain, value)
                      if globalSeen[key] || isCoveredByRoots(value, finalRoots) {
                          continue
                      }

                      ruCategory.Domain = append(ruCategory.Domain, &router.Domain{
                          Type:  router.Domain_RootDomain,
                          Value: value,
                      })
                      globalSeen[key] = true
                      finalRoots[value] = true
                      writtenDomainCount++
                      addedCount++
                  }

                  totalPositiveInput += sourceLines
                  totalPositiveNew += len(values)
                  totalPositiveAdded += addedCount
                  totalPositiveTLD += skippedTLD
                  fmt.Fprintf(report, "# source_lines=%d new_vs_base=%d added_to_final_before_prune=%d skipped_ru_tld=%d\n", sourceLines, len(values), addedCount, skippedTLD)
              }

              fmt.Fprintf(report, "\nTOTAL positive source lines: %d\n", totalPositiveInput)
              fmt.Fprintf(report, "TOTAL new vs base RU: %d\n", totalPositiveNew)
              fmt.Fprintf(report, "TOTAL added to final before prune: %d\n", totalPositiveAdded)
              fmt.Fprintf(report, "TOTAL skipped RU TLD: %d\n", totalPositiveTLD)

              var pruned int
              ruCategory.Domain, pruned = pruneCoveredRootDomains(ruCategory.Domain)
              removedCoveredDomainCount += pruned

              sort.Slice(ruCategory.Domain, func(i, j int) bool {
                  a := ruCategory.Domain[i]
                  b := ruCategory.Domain[j]
                  if a.Type != b.Type {
                      return a.Type < b.Type
                  }
                  return normalizeName(a.Value) < normalizeName(b.Value)
              })

              var prunedBlock int
              blockCategory.Domain, prunedBlock = pruneCoveredRootDomains(blockCategory.Domain)
              removedCoveredBlockDomainCount += prunedBlock

              sort.Slice(blockCategory.Domain, func(i, j int) bool {
                  a := blockCategory.Domain[i]
                  b := blockCategory.Domain[j]
                  if a.Type != b.Type {
                      return a.Type < b.Type
                  }
                  return normalizeName(a.Value) < normalizeName(b.Value)
              })

              if len(ruCategory.Domain) == 0 {
                  panic("RU category is empty")
              }

              result.Entry = append(result.Entry, ruCategory, blockCategory)

              hydraAppendCategories, err := loadOrderedCategories(os.Args[11])
              if err != nil {
                  panic(fmt.Errorf("failed to read Hydra append manifest: %w", err))
              }

              hydraList := lists["hydra"]
              hydraByCategory := make(map[string]*router.GeoSite)
              for _, site := range hydraList.Entry {
                  if site == nil {
                      continue
                  }
                  category := normalizeName(site.CountryCode)
                  for _, wanted := range hydraAppendCategories {
                      if category == wanted {
                          if _, exists := hydraByCategory[category]; exists {
                              panic(fmt.Sprintf("duplicate source category in Hydra DAT: %s", wanted))
                          }
                          hydraByCategory[category] = site
                          break
                      }
                  }
              }

              appendedRuleCount := 0
              appendedDuplicateCount := 0
              appendedConvertedFullToRootCount := 0
              appendedUnsupportedTypeCount := 0
              appendedCoveredDomainCount := 0

              for _, category := range hydraAppendCategories {
                  site, ok := hydraByCategory[category]
                  if !ok {
                      panic(fmt.Sprintf("required Hydra category missing: %s", category))
                  }

                  dst := &router.GeoSite{CountryCode: site.CountryCode}
                  seen := make(map[string]bool)

                  for _, domain := range site.Domain {
                      if domain == nil {
                          continue
                      }

                      val := normalizeName(domain.Value)
                      if val == "" {
                          continue
                      }

                      domainType := router.Domain_RootDomain
                      switch domain.Type {
                      case router.Domain_RootDomain:
                      case router.Domain_Full:
                          domainType = router.Domain_RootDomain
                          appendedConvertedFullToRootCount++
                      default:
                          // Never serialize keyword/regexp/other rule types as a
                          // fake RootDomain: that would turn a pattern into a literal
                          // domain and silently corrupt the Hydra category.
                          appendedUnsupportedTypeCount++
                          continue
                      }

                      cleaned := &router.Domain{
                          Type:  domainType,
                          Value: val,
                      }

                      key := domainKey(cleaned)
                      if seen[key] {
                          appendedDuplicateCount++
                          continue
                      }

                      seen[key] = true
                      dst.Domain = append(dst.Domain, cleaned)
                      appendedRuleCount++
                  }

                  var prunedHydra int
                  dst.Domain, prunedHydra = pruneCoveredRootDomains(dst.Domain)
                  appendedCoveredDomainCount += prunedHydra

                  if len(dst.Domain) == 0 {
                      panic(fmt.Sprintf("Hydra category is empty: %s", category))
                  }

                  result.Entry = append(result.Entry, dst)
              }

              outputData, err := proto.MarshalOptions{Deterministic: true}.Marshal(result)
              if err != nil {
                  panic(fmt.Errorf("failed to marshal final output DAT: %w", err))
              }

              if err := os.WriteFile(outputPath, outputData, 0644); err != nil {
                  panic(fmt.Errorf("failed to write output DAT: %w", err))
              }

              fmt.Println()
              fmt.Println("========================================")
              fmt.Println("RU LIGHT GEOSITE BUILD")
              fmt.Println("========================================")
              fmt.Printf("Source category matches : %d\n", sourceCategoryCount)
              fmt.Printf("Source domain rules     : %d\n", sourceDomainCount)
              fmt.Printf("Written domain rules    : %d\n", writtenDomainCount)
              fmt.Printf("Removed RU TLD rules    : %d\n", removedRussianDomainCount)
              fmt.Printf("Removed regex/keyword   : %d\n", removedUnsupportedTypeCount)
              fmt.Printf("Removed duplicates      : %d\n", duplicateDomainCount)
              fmt.Printf("Full -> RootDomain (RU): %d\n", convertedFullToRootCount)
              fmt.Printf("Covered RU domains removed: %d\n", removedCoveredDomainCount)
              fmt.Printf("Davoyan legacy domains   : %d\n", legacyDomainCount)
              fmt.Printf("Davoyan legacy duplicates: %d\n", legacyDuplicateCount)
              fmt.Printf("Local RU domains         : %d\n", localRUDomainCount)
              fmt.Printf("Local RU duplicates      : %d\n", localRUDuplicateCount)
              fmt.Printf("Local RU Russian TLDs    : %d\n", localRUFilteredTLDCount)
              fmt.Printf("Local BLOCK domains      : %d\n", localBlockDomainCount)
              fmt.Printf("Local BLOCK duplicates   : %d\n", localBlockDuplicateCount)
              fmt.Printf("Covered BLOCK domains removed: %d\n", removedCoveredBlockDomainCount)
              fmt.Printf("Appended Hydra rules    : %d\n", appendedRuleCount)
              fmt.Printf("Hydra duplicates removed: %d\n", appendedDuplicateCount)
              fmt.Printf("Full -> RootDomain (Hydra): %d\n", appendedConvertedFullToRootCount)
              fmt.Printf("Removed unsupported Hydra types: %d\n", appendedUnsupportedTypeCount)
              fmt.Printf("Covered Hydra domains removed: %d\n", appendedCoveredDomainCount)
              fmt.Printf("Positive source lines   : %d\n", totalPositiveInput)
              fmt.Printf("Positive NEW vs base RU : %d\n", totalPositiveNew)
              fmt.Printf("Positive added to final : %d\n", totalPositiveAdded)
              fmt.Printf("Positive skipped RU TLD : %d\n", totalPositiveTLD)
              fmt.Printf("Positive delta report   : %s\n", newPositiveReportPath)
              fmt.Printf("Final categories        : %d\n", len(result.Entry))
              fmt.Printf("Final DAT size          : %d bytes\n", len(outputData))
              fmt.Println("Output categories       : RU + BLOCK + 16 Hydra categories (clean attributes)")
          }
          EOF

          cd domain-list-community
          echo "=== Building RU filter ==="
          go build -o /tmp/ru-geosite-filter ./tools/ru-geosite-filter
          echo "Filter compiled successfully."

      # ------------------------------------------------------------
      # 7. Generate final lightweight geosite_RU.dat
      # ------------------------------------------------------------
      - name: Build lightweight geosite_RU.dat
        shell: bash
        run: |
          set -euo pipefail

          # Keep the manifests generated by the previous step; they are release artifacts.
          rm -f "$OUTPUT_FILE" "$OUTPUT_SHA_FILE" "$NEW_SOURCES_REPORT_FILE"

          test -s "$CATEGORY_FILE"
          test -s "$HYDRA_APPEND_FILE"

          /tmp/ru-geosite-filter \
            "$INPUT_FILE" \
            "$HYDRA_INPUT_FILE" \
            "$GRIMBIRD_INPUT_FILE" \
            "$MVR_INPUT_FILE" \
            "$YULARZHI_INPUT_FILE" \
            "$VPNYASHA_INPUT_FILE" \
            "$KIRILL_INPUT_FILE" \
            "$DIGNE_INPUT_FILE" \
            "$DAVOYAN_LEGACY_INPUT_FILE" \
            selected_ru_categories.txt \
            hydra_append_categories.txt \
            "$LOCAL_RU_INPUT_FILE" \
            "$LOCAL_BLOCK_INPUT_FILE" \
            "$GOLUKON_AVAILABLE_INPUT_FILE" \
            "$MOBILE_WHITELIST_INPUT_FILE" \
            "$DAVIDDT_RU_SUFFIX_INPUT_FILE" \
            "$DMITRIY_ENRICH_INPUT_FILE" \
            "$W1ZARDZ_RU_DIRECT_INPUT_FILE" \
            "$SUPERTICO_DOMAINS_INPUT_FILE" \
            "$NEW_SOURCES_REPORT_FILE" \
            "$OUTPUT_FILE"

          test -s "$OUTPUT_FILE"

          echo
          echo "========================================"
          echo "OUTPUT"
          echo "========================================"
          ls -lh "$OUTPUT_FILE"

      # ------------------------------------------------------------
      # 8. Calculate checksum
      # ------------------------------------------------------------
      - name: Generate SHA256
        shell: bash
        run: |
          set -euo pipefail

          sha256sum "$OUTPUT_FILE" > "$OUTPUT_SHA_FILE"
          cat "$OUTPUT_SHA_FILE"

      # ------------------------------------------------------------
      # 9. Final validation
      # ------------------------------------------------------------
      - name: Validate final DAT
        shell: bash
        run: |
          set -euo pipefail

          cd domain-list-community

          cat > tools/ru-geosite-filter/validate.go <<'EOF'
          package main

          import (
              "fmt"
              "os"
              "strings"

              router "github.com/v2fly/v2ray-core/v5/app/router/routercommon"
              "google.golang.org/protobuf/proto"
          )

          func isRussianTLD(value string) bool {
              value = strings.ToLower(strings.TrimSpace(value))
              value = strings.TrimSuffix(value, ".")
              value = strings.TrimPrefix(value, ".")

              switch value {
              case "ru", "su", "xn--p1ai", "рф":
                  return true
              }

              return strings.HasSuffix(value, ".ru") ||
                  strings.HasSuffix(value, ".su") ||
                  strings.HasSuffix(value, ".xn--p1ai") ||
                  strings.HasSuffix(value, ".рф")
          }

          func domainKey(domain *router.Domain) string {
              return fmt.Sprintf(
                  "%d|%s",
                  domain.Type,
                  strings.ToLower(strings.TrimSpace(domain.Value)),
              )
          }

          func main() {
              if len(os.Args) != 2 {
                  os.Exit(2)
              }

              data, err := os.ReadFile(os.Args[1])
              if err != nil {
                  panic(err)
              }

              list := new(router.GeoSiteList)
              if err := proto.Unmarshal(data, list); err != nil {
                  panic(fmt.Errorf("invalid geosite protobuf: %w", err))
              }

              expectedHydra := []string{
                  "apple",
                  "epicgames",
                  "escapefromtarkov",
                  "faceit",
                  "github",
                  "google-deepmind",
                  "google-play",
                  "microsoft",
                  "pinterest",
                  "riot",
                  "steam",
                  "telegram",
                  "twitch",
                  "twitch-ads",
                  "youtube",
                  "win-spy",
              }

              if len(list.Entry) != 2+len(expectedHydra) {
                  panic(fmt.Sprintf(
                      "expected exactly %d categories, got %d",
                      2+len(expectedHydra),
                      len(list.Entry),
                  ))
              }

              ru := list.Entry[0]
              if ru == nil || strings.ToLower(strings.TrimSpace(ru.CountryCode)) != "ru" {
                  panic("first category must be RU")
              }

              seenRU := make(map[string]bool, len(ru.Domain))
              rootRU := make(map[string]bool, len(ru.Domain))
              for _, domain := range ru.Domain {
                  if domain != nil && domain.Type == router.Domain_RootDomain {
                      value := strings.ToLower(strings.TrimSpace(domain.Value))
                      if value != "" {
                          rootRU[value] = true
                      }
                  }
              }

              expectedTLD := map[string]bool{
                  "ru":       false,
                  "xn--p1ai": false,
                  "su":       false,
              }

              for _, domain := range ru.Domain {
                  if domain == nil {
                      panic("RU contains nil domain")
                  }

                  if len(domain.Attribute) > 0 {
                      panic(fmt.Sprintf("leaked attributes in RU domain: %s (count: %d)", domain.Value, len(domain.Attribute)))
                  }

                  if domain.Type != router.Domain_RootDomain {
                      panic(fmt.Sprintf(
                          "RU contains non-RootDomain rule: %v",
                          domain.Type,
                      ))
                  }

                  value := strings.ToLower(strings.TrimSpace(domain.Value))
                  if value == "" {
                      panic("RU contains empty domain value")
                  }

                  key := domainKey(domain)
                  if seenRU[key] {
                      panic(fmt.Sprintf("duplicate domain in RU: %s", domain.Value))
                  }
                  seenRU[key] = true

                  if domain.Type == router.Domain_RootDomain {
                      if _, ok := expectedTLD[value]; ok {
                          expectedTLD[value] = true
                      }
                  }

                  if isRussianTLD(value) &&
                      value != "ru" && value != "su" && value != "xn--p1ai" {
                      panic(fmt.Sprintf("Russian TLD leaked into RU: %s", domain.Value))
                  }

                  for parent := value; ; {
                      dot := strings.IndexByte(parent, '.')
                      if dot < 0 {
                          break
                      }
                      parent = parent[dot+1:]
                      if rootRU[parent] {
                          panic(fmt.Sprintf(
                              "redundant child domain in RU: %s is covered by %s",
                              value,
                              parent,
                          ))
                      }
                  }
              }

              for name, ok := range expectedTLD {
                  if !ok {
                      panic(fmt.Sprintf("RU missing compact TLD: %s", name))
                  }
              }

              block := list.Entry[1]
              if block == nil || strings.ToLower(strings.TrimSpace(block.CountryCode)) != "block" {
                  panic("second category must be BLOCK")
              }

              seenBlock := make(map[string]bool, len(block.Domain))
              rootsBlock := make(map[string]bool, len(block.Domain))
              for _, domain := range block.Domain {
                  if domain != nil && domain.Type == router.Domain_RootDomain {
                      value := strings.ToLower(strings.TrimSpace(domain.Value))
                      if value != "" {
                          rootsBlock[value] = true
                      }
                  }
              }

              for _, domain := range block.Domain {
                  if domain == nil {
                      panic("BLOCK contains nil domain")
                  }

                  if len(domain.Attribute) > 0 {
                      panic(fmt.Sprintf("leaked attributes in BLOCK domain: %s", domain.Value))
                  }

                  if domain.Type != router.Domain_RootDomain &&
                      domain.Type != router.Domain_Full {
                      panic(fmt.Sprintf("BLOCK contains unsupported domain type: %v", domain.Type))
                  }
                  value := strings.ToLower(strings.TrimSpace(domain.Value))
                  if value == "" {
                      panic("BLOCK contains empty domain value")
                  }
                  key := domainKey(domain)
                  if seenBlock[key] {
                      panic(fmt.Sprintf("duplicate domain in BLOCK: %s", domain.Value))
                  }
                  seenBlock[key] = true

                  if domain.Type == router.Domain_RootDomain {
                      for parent := value; ; {
                          dot := strings.IndexByte(parent, '.')
                          if dot < 0 {
                              break
                          }
                          parent = parent[dot+1:]
                          if rootsBlock[parent] {
                              panic(fmt.Sprintf(
                                  "redundant child domain in BLOCK: %s is covered by %s",
                                  value,
                                  parent,
                              ))
                          }
                      }
                  }
              }

              for i, expected := range expectedHydra {
                  site := list.Entry[i+2]
                  if site == nil {
                      panic(fmt.Sprintf("Hydra category %s is nil", expected))
                  }

                  category := strings.ToLower(strings.TrimSpace(site.CountryCode))
                  if category != expected {
                      panic(fmt.Sprintf(
                          "Hydra category order mismatch: expected %s, got %s",
                          expected,
                          site.CountryCode,
                      ))
                  }

                  if len(site.Domain) == 0 {
                      panic(fmt.Sprintf("Hydra category is empty: %s", category))
                  }

                  seen := make(map[string]bool, len(site.Domain))
                  roots := make(map[string]bool, len(site.Domain))
                  for _, domain := range site.Domain {
                      if domain != nil && domain.Type == router.Domain_RootDomain {
                          value := strings.ToLower(strings.TrimSpace(domain.Value))
                          if value != "" {
                              roots[value] = true
                          }
                      }
                  }

                  for _, domain := range site.Domain {
                      if domain == nil {
                          panic(fmt.Sprintf("%s contains nil domain", category))
                      }

                      if len(domain.Attribute) > 0 {
                          panic(fmt.Sprintf("leaked attributes in %s domain: %s", category, domain.Value))
                      }

                      value := strings.ToLower(strings.TrimSpace(domain.Value))
                      if value == "" {
                          panic(fmt.Sprintf("%s contains empty domain value", category))
                      }

                      if domain.Type == router.Domain_Full {
                          panic(fmt.Sprintf(
                              "Full rule remained in Hydra category %s: %s",
                              category,
                              domain.Value,
                          ))
                      }

                      if domain.Type == router.Domain_RootDomain {
                          for parent := value; ; {
                              dot := strings.IndexByte(parent, '.')
                              if dot < 0 {
                                  break
                              }
                              parent = parent[dot+1:]
                              if roots[parent] {
                                  panic(fmt.Sprintf(
                                      "redundant child domain in Hydra category %s: %s is covered by %s",
                                      category,
                                      value,
                                      parent,
                                  ))
                              }
                          }
                      }

                      key := domainKey(domain)
                      if seen[key] {
                          panic(fmt.Sprintf(
                              "duplicate domain in Hydra category %s: %s",
                              category,
                              domain.Value,
                          ))
                      }
                      seen[key] = true
                  }
              }

              fmt.Println()
              fmt.Println("========================================")
              fmt.Println("VALIDATION OK")
              fmt.Println("========================================")
              fmt.Printf("Categories: %d (RU + BLOCK + 16 Hydra)\n", len(list.Entry))
              fmt.Printf("RU rules:   %d\n", len(ru.Domain))
              fmt.Printf("BLOCK rules: %d\n", len(block.Domain))
              fmt.Println("Attributes (@ads/@cn): 0 (strictly verified across all categories)")
          }
          EOF

          go run ./tools/ru-geosite-filter/validate.go "$GITHUB_WORKSPACE/$OUTPUT_FILE"
          test -s "$GITHUB_WORKSPACE/$NEW_SOURCES_REPORT_FILE"

      # ------------------------------------------------------------
      # 10. Publish GitHub Release
      # ------------------------------------------------------------
      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFY RELEASE ARTIFACTS"
          echo "========================================"

          for file in \
            "$OUTPUT_FILE" \
            "$OUTPUT_SHA_FILE" \
            "$CATEGORY_FILE" \
            "$HYDRA_APPEND_FILE" \
            "$NEW_SOURCES_REPORT_FILE"; do
            test -s "$GITHUB_WORKSPACE/$file"
            echo "OK: $file"
          done

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-optimized
          name: "Optimized RU GeoSite"
          make_latest: true

          files: |
            geosite_RU.dat
            geosite_RU.dat.sha256sum
            geosite_RU_categories.txt
            geosite_RU_hydra_appended_categories.txt
            geosite_RU_new_sources.txt

          body: |
            # Optimized RU GeoSite

            Automatically generated Russian-region GeoSite database.

          fail_on_unmatched_files: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # 11. Publish files to release branch and purge jsDelivr cache
      # ------------------------------------------------------------
      - name: Publish files to release branch and sync CDN
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/geosite-release
          mkdir -p /tmp/geosite-release

          cp "$OUTPUT_FILE" /tmp/geosite-release/geosite_RU.dat
          cp "$OUTPUT_SHA_FILE" /tmp/geosite-release/geosite_RU.dat.sha256sum
          cp "$CATEGORY_FILE" /tmp/geosite-release/geosite_RU_categories.txt
          cp "$HYDRA_APPEND_FILE" /tmp/geosite-release/geosite_RU_hydra_appended_categories.txt
          cp "$NEW_SOURCES_REPORT_FILE" /tmp/geosite-release/geosite_RU_new_sources.txt

          cd /tmp/geosite-release

          git init
          git checkout -b release

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Update optimized RU GeoSite"

          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push --force origin release

          echo "========================================"
          echo "Waiting for GitHub raw cache propagation"
          echo "========================================"

          EXPECTED_SHA="$(awk '{print $1}' geosite_RU.dat.sha256sum)"
          echo "Target SHA256: $EXPECTED_SHA"

          RAW_UPDATED=false
          for i in {1..12}; do
            REMOTE_SHA="$(curl -fsSL --max-time 10 "https://raw.githubusercontent.com/${{ github.repository }}/release/geosite_RU.dat.sha256sum" | awk '{print $1}' || true)"
            if [ "$REMOTE_SHA" = "$EXPECTED_SHA" ]; then
              echo "GitHub raw updated successfully ($((i * 5))s)."
              RAW_UPDATED=true
              break
            fi
            sleep 5
          done

          if [ "$RAW_UPDATED" != true ]; then
            echo "WARNING: GitHub raw checksum has not propagated within the validation window."
            echo "WARNING: Release branch is updated, but raw.githubusercontent.com may still serve cached content."
          fi

          echo "========================================"
          echo "Purging jsDelivr CDN cache"
          echo "========================================"

          curl -sS "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/" || true
          echo
          curl -sS "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/geosite_RU.dat" || true
          echo
          curl -sS "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/geosite_RU.dat.sha256sum" || true
          echo

          sleep 2
          CDN_SIZE="$(curl -sI "https://cdn.jsdelivr.net/gh/${{ github.repository }}@release/geosite_RU.dat" | grep -i content-length | awk '{print $2}' | tr -d '\r' || true)"
          LOCAL_SIZE="$(wc -c < geosite_RU.dat)"

          echo "Local size : $LOCAL_SIZE bytes"
          echo "CDN size   : $CDN_SIZE bytes"

          if [ "$CDN_SIZE" = "$LOCAL_SIZE" ]; then
            echo "SUCCESS: jsDelivr CDN is 100% up to date!"
          else
            echo "NOTICE: CDN size differs. Propagation across edge nodes is in progress."
          fi

      # ------------------------------------------------------------
      # 12. Workflow summary
      # ------------------------------------------------------------
      - name: Print download URLs
        shell: bash
        run: |
          echo
          echo "========================================"
          echo "DOWNLOAD URLS"
          echo "========================================"
          echo
          echo "GitHub Release:"
          echo "https://github.com/${{ github.repository }}/releases/download/latest-optimized/geosite_RU.dat"
          echo
          echo "Raw release branch:"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/release/geosite_RU.dat"
          echo
          echo "jsDelivr CDN:"
          echo "https://cdn.jsdelivr.net/gh/${{ github.repository }}@release/geosite_RU.dat"
          echo
          echo "Positive-source delta report:"
          echo "https://raw.githubusercontent.com/${{ github.repository }}/release/geosite_RU_new_sources.txt"
          echo
          echo "SHA256:"
          cat "$OUTPUT_SHA_FILE"
